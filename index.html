      <button class="btn btn-ghost mt-2" data-action="back-upload">&#8592; Upload different files</button>`;
  }

  /* ── Category rules - keyword/SKU matching ── */
  const CAT_ORDER = ['Wet Areas','Glassware','Furniture','Brassware','Panels','Flooring','Sundries'];
  const CAT_RULES = [
    ['Wet Areas', [
      [/\bshower tray\b/i,'b'],[/\banti.slip.*tray\b/i,'n'],[/\bwetroom\b(?!.*screen)/i,'b'],
      [/S8-WET/i,'s'],[/S8-PROFILE/i,'s'],[/\bshower set\b/i,'n'],[/^RR-/i,'s'],
      [/\bshower trap\b/i,'n'],[/\bbottle trap\b/i,'n'],[/\bbath trap\b/i,'n'],
      [/\bpan connector\b/i,'n'],[/\bflexi\b/i,'n'],[/\bisolation val/i,'n'],
      [/\bextractor fan\b/i,'n'],[/^CEF-/i,'s'],[/\bheating element\b/i,'n'],
      [/^HB\d/i,'s'],[/\belectric shower\b/i,'n'],[/^TS-\d/i,'s'],
      [/\briser\b/i,'n'],[/^NEV-/i,'s'],
      [/\bbath\b(?!.*(?:filler|mixer|tap|waste|pop.up|screen|wall))/i,'n'],
    ]],
    ['Glassware', [
      [/S6-.*GLASS/i,'s'],[/BLKSCREEN/i,'s'],[/GRIDBATHSCREEN/i,'s'],[/^GRID\d/i,'s'],
      [/\bbathscreen\b/i,'n'],[/\bbath screen\b/i,'n'],[/\bwetroom screen\b/i,'n'],
      [/\bgrid.*screen\b/i,'n'],[/\bside panel.*mm\b/i,'n'],[/\bpivot door\b/i,'n'],
      [/\bsliding.*door\b/i,'n'],[/\bdouble door quad\b/i,'n'],
      [/S8-FLIPPER/i,'s'],[/\bdeflector panel\b/i,'n'],
    ]],
    ['Brassware', [
      [/^TAP\d/i,'s'],[/^SAN\d/i,'s'],[/^BLACK2\d/i,'s'],[/^BR-BRASS/i,'s'],
      [/\bmixer\b/i,'n'],[/\bbath filler\b/i,'n'],[/\btap\b/i,'n'],[/\bdeck mounted\b/i,'n'],
      [/^TRV\d/i,'s'],[/^C15-/i,'s'],[/^ST-\d/i,'s'],[/^VI-/i,'s'],[/^TS-29079/i,'s'],
      [/\btowel rail\b/i,'n'],[/\bradiator valve\b/i,'n'],[/\bpipe collars?\b/i,'n'],
      [/\bshower dome\b/i,'n'],[/\bvibe.*rail\b/i,'n'],[/\bbrass.*rail\b/i,'n'],
      [/\bhandle\b/i,'n'],[/\bpush button\b/i,'n'],[/\bgrab rail\b/i,'n'],
      [/\bbath.*waste\b/i,'n'],[/\bpop.up waste\b/i,'n'],[/^BW\d/i,'s'],[/^BLACKBW/i,'s'],
    ]],
    ['Furniture', [
      [/^NVF/i,'s'],[/^nvf/i,'s'],[/^NVM/i,'s'],[/^nvm/i,'s'],
      [/^PMB/i,'s'],[/^pmb/i,'s'],[/^NCG/i,'s'],[/^ncg/i,'s'],
      [/^NBC/i,'s'],[/^PRC/i,'s'],[/^BTW/i,'s'],[/^NST/i,'s'],
      [/^XTY/i,'s'],[/^AR-\d/i,'s'],[/^BU-1050/i,'s'],
      [/^moe\d/i,'s'],[/^sat\d/i,'s'],[/^SPACE\d/i,'s'],
      [/^DEIA\d/i,'s'],[/^VESSEL/i,'s'],[/^mwt\d/i,'s'],[/^off\d/i,'s'],[/^vty\d/i,'s'],
      [/\bvanity\b/i,'n'],[/\bcabinet\b/i,'n'],[/\bcab\b/i,'n'],[/\bwc unit\b/i,'n'],
      [/\bbasin\b/i,'n'],[/\bpan.*seat\b/i,'n'],[/\bcistern\b/i,'n'],
      [/\bpolymarble\b/i,'n'],[/\btall unit\b/i,'n'],[/\bpedestal\b/i,'n'],
      [/\bcountertop basin\b/i,'n'],[/\bspa basin\b/i,'n'],[/\brimless.*pan\b/i,'n'],
      [/\bsoft close seat\b/i,'n'],[/999-SEAT/i,'s'],
      [/\bmirror\b/i,'n'],[/^SK-LED/i,'s'],[/^MIRROR\d/i,'s'],[/^MONO-\d/i,'s'],[/^ANN-REC/i,'s'],
      [/\bled battery mirror\b/i,'n'],
    ]],
    ['Panels', [
      [/^FF8-/i,'s'],[/^ff8-/i,'s'],[/^FF10-/i,'s'],[/^FFP10-/i,'s'],
      [/^FFTL-/i,'s'],[/^SK250-/i,'s'],
      [/^SK-CL/i,'s'],[/^SK-CE/i,'s'],[/^SK-BL/i,'s'],[/^SK-BE/i,'s'],
      [/\bl trim\b/i,'n'],[/\bend cap\b/i,'n'],[/\bh trim\b/i,'n'],
      [/\bperform panel/i,'n'],[/\bwall panel\b/i,'n'],[/\bpanel\b/i,'n'],
      [/\btile\b/i,'n'],[/\btile line\b/i,'n'],
      [/\bmarble\b/i,'n'],[/\bquartz\b/i,'n'],[/\bonyx\b/i,'n'],
      [/\b250 x 2700\b/i,'n'],
    ]],
    ['Flooring', [
      [/^LRSPC-/i,'s'],[/^LRMSPC-/i,'s'],[/^FRSPC-/i,'s'],[/^FRHSPC-/i,'s'],
      [/\bspc\b/i,'b'],[/\blvt\b/i,'b'],
      [/\bflooring\b/i,'n'],[/\bleaf range\b/i,'n'],[/\bforest range\b/i,'n'],
      [/\bherringbone\b/i,'n'],[/\bpine\b/i,'n'],[/\boak\b/i,'n'],
    ]],
    ['Sundries', [
      [/^EB-/i,'s'],[/\bsilicone\b/i,'n'],[/\bsealant\b/i,'n'],
      [/\bnail\b/i,'n'],[/\bosb\b/i,'n'],[/\bchipboard\b/i,'n'],
      [/\boffsaw\b/i,'n'],[/\bcls\b/i,'n'],[/\bdownlight\b/i,'n'],
      [/\bchauk\b/i,'n'],[/\bterminal\b/i,'n'],[/\btwin.*earth\b/i,'n'],
      [/\belectrical kit\b/i,'n'],
    ]],
  ];

  function categoriseItem(sku, name) {
    for (const [cat, rules] of CAT_RULES) {
      for (const [re, field] of rules) {
        if ((field === 's' || field === 'b') && re.test(sku)) return cat;
        if ((field === 'n' || field === 'b') && re.test(name)) return cat;
      }
    }
    return 'Sundries';
  }

  function renderItemRow(item, checks) {
    const c   = checks[item.key] || {};
    const st  = c.status || '';
    const alt = state.alternatives?.[item.key];
    const skuHtml  = item.sku  ? `<span class="item-sku">${esc(item.sku)}</span>` : '';
    const unitHtml = item.unit ? ' ' + esc(item.unit) : '';
    const altBadge = alt ? `<span style="display:inline-block;margin-left:6px;padding:1px 7px;border-radius:20px;font-size:.7rem;font-weight:700;background:#ede9fe;color:#7c3aed;">Alt proposed</span>` : '';
    return `
      <div class="item-row ${st ? 'status-' + (st === 'in' ? 'in' : st === 'part' ? 'part' : 'short') : ''}" data-key="${esc(item.key)}">
        <div class="item-name">${esc(item.name)}${skuHtml}${altBadge}</div>
        <div class="item-qty">Qty: ${item.qty}${unitHtml}</div>
        ${st === 'part' ? `<input class="qty-input" type="number" min="0" max="${item.qty}" placeholder="Have?" value="${c.haveQty || ''}" data-action="qty-input" data-key="${esc(item.key)}" />` : ''}
        <div class="item-status">
          <button class="status-btn ${st === 'in'    ? 'active-green' : ''}" data-action="set-status" data-key="${esc(item.key)}" data-status="in"    title="In stock">&#10003;</button>
          <button class="status-btn ${st === 'part'  ? 'active-amber' : ''}" data-action="set-status" data-key="${esc(item.key)}" data-status="part"  title="Partial">~</button>
          <button class="status-btn ${st === 'short' ? 'active-red'   : ''}" data-action="set-status" data-key="${esc(item.key)}" data-status="short" title="Short">&#10007;</button>
          <button class="status-btn ${alt ? 'active-amber' : ''}" data-action="open-alt" data-key="${esc(item.key)}" data-name="${esc(item.name)}" data-qty="${item.qty}" title="Propose alternative" style="font-size:.7rem;font-weight:700;color:${alt ? '#7c3aed' : 'var(--muted)'};border-color:${alt ? '#c4b5fd' : 'var(--border)'};">Alt</button>
        </div>
      </div>`;
  }

  function renderCheck() {
    const items  = state.session.masterList;
    const checks = state.checks;
    const total  = items.length;
    const done   = Object.values(checks).filter(c => c.status).length;
    const pct    = total ? Math.round((done / total) * 100) : 0;

    /* flat filtered views for Short and In Stock tabs */
    if (state.tab === 'short' || state.tab === 'in') {
      const filtered = items.filter(i =>
        state.tab === 'short'
          ? (checks[i.key]?.status === 'short' || checks[i.key]?.status === 'part')
          : checks[i.key]?.status === 'in'
      );
      const rows = filtered.map(i => renderItemRow(i, checks)).join('');
      return renderCheckShell(total, done, pct, checks,
        rows || `<div class="empty-state"><div class="icon">&#10003;</div><p>Nothing here</p></div>`);
    }

    /* All and Remaining - grouped by category */
    const showItems = state.tab === 'remaining'
      ? items.filter(i => !checks[i.key]?.status)
      : items;

    /* build per-category buckets */
    const buckets = {};
    CAT_ORDER.forEach(c => buckets[c] = []);
    showItems.forEach(i => buckets[categoriseItem(i.sku || '', i.name)].push(i));

    const catColours = {
      'Wet Areas':  '#0075ab', 'Glassware':  '#0891b2',
      'Furniture':  '#059669', 'Brassware':  '#d97706',
      'Panels':     '#7c3aed', 'Flooring':   '#b45309',
      'Sundries':   '#64748b',
    };

    const sections = CAT_ORDER.map(cat => {
      const catItems = buckets[cat];
      if (!catItems.length) return '';
      const catDone = catItems.filter(i => checks[i.key]?.status).length;
      const isOpen     = state.catExpanded?.[cat] === true; /* collapsed by default */
      const isSubmitted = !!(state.catSubmitted?.[cat]);
      const colour      = catColours[cat];
      const rows        = catItems.map(i => renderItemRow(i, checks)).join('');
      const catBg       = isSubmitted ? '#f0fdf4' : 'var(--bg)';
      const catBorder   = isSubmitted ? '#bbf7d0' : 'var(--border)';
      return `
        <div class="cat-section" style="margin-bottom:8px;border:1px solid ${catBorder};border-radius:10px;overflow:hidden;">
          <div style="display:flex;align-items:center;background:${catBg};">
            <button class="cat-head" data-action="toggle-cat" data-cat="${esc(cat)}"
              style="flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:transparent;border:none;cursor:pointer;text-align:left;font-family:inherit;">
              <div style="width:4px;height:18px;border-radius:2px;background:${colour};flex-shrink:0;"></div>
              <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.85rem;flex:1;color:var(--text);">${esc(cat)}</div>
              <div style="font-size:.75rem;color:var(--muted);">${catDone}/${catItems.length}</div>
              <div style="font-size:.7rem;color:var(--muted);transition:transform .15s;${isOpen ? '' : 'transform:rotate(-90deg);'}">&#9660;</div>
            </button>
            <button data-action="submit-cat" data-cat="${esc(cat)}"
              style="flex-shrink:0;margin-right:10px;padding:4px 10px;border-radius:20px;border:1.5px solid ${isSubmitted ? 'var(--green)' : 'var(--border)'};background:${isSubmitted ? '#d1fae5' : 'transparent'};color:${isSubmitted ? 'var(--green)' : 'var(--muted)'};font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;"
              title="${isSubmitted ? 'Mark as not done' : 'Mark category as done'}">
              ${isSubmitted ? '&#10003; Done' : 'Mark done'}
            </button>
          </div>
          <div class="cat-body item-list" style="padding:6px 8px 8px;${isOpen ? '' : 'display:none;'}">${rows}</div>
        </div>`;
    }).join('');

    return renderCheckShell(total, done, pct, checks,
      sections || `<div class="empty-state"><div class="icon">&#10003;</div><p>Nothing here</p></div>`);
  }

  function renderAltModal() {
    const m = state.altModal;
    if (!m) return '';
    const existing = state.alternatives?.[m.key] || {};
    return `
      <div id="alt-modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="background:var(--surface);border-radius:var(--radius);padding:22px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);">
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px;">Propose alternative</div>
          <div style="font-size:.83rem;color:var(--muted);margin-bottom:16px;">${esc(m.name)} &middot; Qty ${m.qty}</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div>
              <label style="font-size:.78rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;">Alternative item name</label>
              <input id="alt-name-input" type="text" placeholder="e.g. Brushed Nickel Basin Mixer" value="${esc(existing.altName || '')}"
                style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:.9rem;outline:none;" />
            </div>
            <div>
              <label style="font-size:.78rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;">Alternative SKU</label>
              <input id="alt-sku-input" type="text" placeholder="e.g. BR-NICKEL241" value="${esc(existing.altSku || '')}"
                style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:.9rem;outline:none;" />
            </div>
            <div style="font-size:.75rem;color:var(--muted);">At least one field required.</div>
            <div id="alt-error" style="color:var(--red);font-size:.8rem;min-height:18px;"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
            <button class="btn btn-primary" data-action="alt-save" style="background:#7c3aed;border-color:#7c3aed;">Save alternative</button>
            ${existing.altName || existing.altSku ? `<button class="btn btn-ghost" data-action="alt-clear" style="color:var(--red);">Remove</button>` : ''}
            <button class="btn btn-ghost" data-action="alt-close">Cancel</button>
          </div>
        </div>
      </div>`;
  }

  function renderCheckShell(total, done, pct, checks, inner) {
    const shortCount = Object.values(checks).filter(c => c.status === 'short' || c.status === 'part').length;
    const inCount    = Object.values(checks).filter(c => c.status === 'in').length;
    return `${renderAltModal()}
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:10px;">
          <div>
            <span class="card-title" style="margin-bottom:0;">Stock Check</span>
            <div class="text-muted text-sm">${state.session.code} &middot; ${done}/${total} checked</div>
            <div style="margin-top:5px;">${(state.session.jobs || []).map(j => `<span class="job-tag">${esc(j.replace(/^Q/i,""))}</span>`).join("")}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn btn-ghost" data-action="go-home">&#8592; Back</button>
            <button class="btn btn-outline" data-action="submit-all" id="submit-all-btn">&#10003; Submit</button>
            <button class="btn btn-outline" data-action="pp-go-pick" style="border-color:#059669;color:#059669;">Pick &#8594;</button>
            <button class="btn btn-primary" data-action="go-report">Report &#8594;</button>
          </div>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="tabs">
          <button class="tab-btn ${state.tab === 'all'       ? 'active' : ''}" data-action="tab" data-tab="all">All (${total})</button>
          <button class="tab-btn ${state.tab === 'remaining' ? 'active' : ''}" data-action="tab" data-tab="remaining">Remaining (${total - done})</button>
          <button class="tab-btn ${state.tab === 'short'     ? 'active' : ''}" data-action="tab" data-tab="short">Short (${shortCount})</button>
          <button class="tab-btn ${state.tab === 'in'        ? 'active' : ''}" data-action="tab" data-tab="in">In Stock (${inCount})</button>
        </div>
        ${inner}
      </div>`;
  }

  function renderReport() {
    const items  = state.session.masterList;
    const checks = state.checks;
    const shorts = items.filter(i => { const c = checks[i.key]; return c && (c.status === 'short' || c.status === 'part'); });
    const rows = shorts.map(item => {
      const c    = checks[item.key];
      const have = c.status === 'part' ? (Number(c.haveQty) || 0) : 0;
      const need = item.qty - have;
      return `<tr><td>${esc(item.name)}</td><td class="report-sku">${item.sku ? esc(item.sku) : '&mdash;'}</td><td>${item.qty}</td><td>${have}</td><td class="need">${need}</td><td>${item.jobs ? esc(item.jobs.join(', ')) : ''}</td></tr>`;
    }).join('');
    return `
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:16px;">
          <div class="card-title" style="margin-bottom:0;">Purchasing Report</div>
          <button class="btn btn-ghost" data-action="go-check">&#8592; Back</button>
        </div>
        ${shorts.length === 0
          ? `<div class="empty-state"><div class="icon">&#127881;</div><p>All items in stock - nothing to order!</p></div>`
          : `<table class="shortfall-table"><thead><tr><th>Item</th><th>SKU</th><th>Needed</th><th>Have</th><th>To Order</th><th>Job(s)</th></tr></thead><tbody>${rows}</tbody></table>`}
        <div class="flex gap-2 flex-wrap mt-4">
          <button class="btn btn-primary" data-action="copy-report">&#128203; Copy Report</button>
          <button class="btn btn-ghost"   data-action="new-session">New Session</button>
          <button class="btn btn-ghost"   data-action="go-home">&#8592; Back</button>
        </div>
      </div>`;
  }

  /* ═══════════════════════════════════════════════
     MODULE 2 - PICK COMPLETION
  ═══════════════════════════════════════════════ */
  function renderC2Home() {
    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="pp-back">&#8592; Back</button></div>
      <div class="card">
        <div class="card-title">Pick Completion</div>
        <p class="text-muted text-sm" style="margin-bottom:16px;">Enter a job number to load the pick list for that job.</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <input id="c2-job" type="text" placeholder="Job number e.g. 1659" autocapitalize="off"
            style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem;outline:none;" />
          <input id="c2-picker" type="text" placeholder="Your name (optional)"
            style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem;outline:none;" value="${esc(state.c2.pickerName || '')}" />
          <button class="btn btn-primary" data-action="c2-load" style="width:100%;">Find Job &#8594;</button>
        </div>
        ${state.c2.loading ? `<p class="text-muted text-sm mt-2">Looking up job&#8230;</p>` : ''}
      </div>`;
  }

  function renderC2Jobs() {
    const s    = state.c2.session;
    const jobs = s.jobs || [];
    const jobRows = jobs.map(jobRef => {
      const items   = s.masterList.filter(i => i.jobs && i.jobs.includes(jobRef));
      const picks   = state.c2.picks[jobRef] || {};
      const entered = Object.values(picks).filter(p => p.qty !== null && p.qty !== undefined).length;
      const total   = items.length;
      let ragColour, ragLabel;
      if (entered === 0) {
        ragColour = '#ef4444'; ragLabel = 'Not started';
      } else if (entered >= total) {
        ragColour = '#059669'; ragLabel = 'Complete';
      } else {
        ragColour = '#f59e0b'; ragLabel = entered + '/' + total + ' picked';
      }
      return `
        <div class="item-row" style="cursor:pointer;" data-action="c2-select-job" data-job="${esc(jobRef)}">
          <div style="width:10px;height:10px;border-radius:50%;background:${ragColour};flex-shrink:0;"></div>
          <div class="item-name" style="flex:1;">${esc(displayJobRef(jobRef))}</div>
          <div style="font-size:.78rem;color:#6b7280;white-space:nowrap;">${ragLabel}</div>
          <div style="color:var(--muted);font-size:1.2rem;flex-shrink:0;">&#8250;</div>
        </div>`;
    }).join('');

    const notStarted = jobs.filter(j => {
      const picks = state.c2.picks[j] || {};
      return Object.values(picks).filter(p => p.qty !== null && p.qty !== undefined).length === 0;
    }).length;

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="pp-back">&#8592; Back</button></div>
      <div class="card">
        <div class="card-title">Jobs this week - ${esc(s.code)}</div>
        <p class="text-muted text-sm" style="margin-bottom:14px;">${jobs.length} job${jobs.length !== 1 ? 's' : ''} on this session${notStarted > 0 ? ' &middot; <span style="color:#ef4444;font-weight:600;">' + notStarted + ' not started</span>' : ' &middot; <span style="color:#059669;font-weight:600;">all picked</span>'}.</p>
        <div class="item-list">${jobRows}</div>
      </div>`;
  }

  function renderC2Pick() {
    const s      = state.c2.session;
    const jobRef = state.c2.selectedJob;
    const items  = s.masterList.filter(i => i.jobs && i.jobs.includes(jobRef));
    const picks  = state.c2.picks[jobRef] || {};
    const total  = items.length;
    const entered = Object.values(picks).filter(p => p.qty !== null && p.qty !== undefined).length;
    const pct    = total ? Math.round(entered / total * 100) : 0;

    const rows = items.map(item => {
      const p = picks[item.key];
      const val = (p && p.qty !== undefined && p.qty !== null) ? p.qty : '';
      /* ── FIX: use per-job qty from packing slip, not consolidated total ── */
      const needed = (item.jobQtys && item.jobQtys[jobRef] != null)
        ? item.jobQtys[jobRef]
        : item.qty;
      let rowClass = '', indColor = '', indChar = '';
      if (val !== '') {
        const n = Number(val);
        if (n >= needed)    { rowClass = 'status-in';    indColor = 'var(--green)'; indChar = '&#10003;'; }
        else if (n > 0)     { rowClass = 'status-part';  indColor = 'var(--amber)'; indChar = '~'; }
        else                { rowClass = 'status-short'; indColor = 'var(--red)';   indChar = '&#10007;'; }
      }
      return `
        <div class="item-row ${rowClass}">
          <div class="item-name">${esc(item.name)}${item.sku ? `<span class="item-sku">${esc(item.sku)}</span>` : ''}</div>
          <div class="item-qty">Need: ${needed}${item.unit ? ' ' + esc(item.unit) : ''}</div>
          <input class="qty-input" type="number" min="0" style="width:72px;"
            placeholder="${needed}" value="${val}"
            data-action="c2-qty" data-key="${esc(item.key)}" data-needed="${needed}" />
          ${indChar ? `<div class="pick-indicator" style="color:${indColor};">${indChar}</div>` : '<div class="pick-indicator"></div>'}
        </div>`;
    }).join('');

    return `
      <div class="mod-back" style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-ghost" data-action="go-home">&#8592; Back</button>
        <button class="btn btn-ghost" data-action="c2-back-jobs" style="font-size:.8rem;">&#9776; All jobs this week</button>
      </div>
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:10px;">
          <div>
            <span class="card-title" style="margin-bottom:0;">Picking - ${esc(displayJobRef(jobRef))}</span>
            <div class="text-muted text-sm">${entered}/${total} entered &middot; blank = fully picked</div>
          </div>
          <button class="btn btn-primary" data-action="c2-submit">Submit &#8594;</button>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="item-list">${rows}</div>
      </div>
      <p class="text-muted text-sm" style="padding:0 4px;">Leave blank to record as fully picked. Only change the number if you picked less than needed.</p>`;
  }

  function renderC2Done() {
    const s      = state.c2.session;
    const jobRef = state.c2.selectedJob;
    const picks  = state.c2.picks[jobRef] || {};
    const items  = s.masterList.filter(i => i.jobs && i.jobs.includes(jobRef));
    const shorts = items.filter(i => {
      const p = picks[i.key];
      if (!p || p.qty === null || p.qty === undefined) return false;
      const needed = (i.jobQtys && i.jobQtys[jobRef] != null) ? i.jobQtys[jobRef] : i.qty;
      return Number(p.qty) < needed;
    });

    const shortRows = shorts.map(item => {
      const p    = picks[item.key];
      const pQty = Number(p.qty);
      const needed = (item.jobQtys && item.jobQtys[jobRef] != null) ? item.jobQtys[jobRef] : item.qty;
      return `<tr><td>${esc(item.name)}</td><td class="report-sku">${item.sku ? esc(item.sku) : '&mdash;'}</td><td>${needed}</td><td>${pQty}</td><td class="need">${needed - pQty}</td></tr>`;
    }).join('');

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="c2-back-jobs">&#8592; Jobs</button></div>
      <div class="card">
        <div class="card-title">Pick submitted - ${esc(displayJobRef(jobRef))}</div>
        ${shorts.length === 0
          ? `<div class="empty-state"><div class="icon">&#127881;</div><p>Fully picked - nothing short.</p></div>`
          : `<p class="text-muted text-sm" style="margin-bottom:12px;">${shorts.length} item${shorts.length !== 1 ? 's' : ''} short:</p>
             <table class="shortfall-table"><thead><tr><th>Item</th><th>SKU</th><th>Needed</th><th>Picked</th><th>Short</th></tr></thead><tbody>${shortRows}</tbody></table>`}
        <div class="flex gap-2 flex-wrap mt-4">
          ${shorts.length > 0 ? `<button class="btn btn-primary" data-action="c2-copy-short">&#128203; Copy to Purchasing</button>` : ''}
          <button class="btn btn-ghost" data-action="c2-back-jobs">Back to Jobs</button>
          <button class="btn btn-ghost" data-action="go-home">&#8592; Back</button>
        </div>
      </div>`;
  }

  /* ═══════════════════════════════════════════════
     MODULE 3 - DRIVER DELIVERY
  ═══════════════════════════════════════════════ */
  function renderC3Home() {
    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="go-home">&#8592; Back</button></div>
      <div class="card">
        <div class="card-title">Driver Delivery</div>
        <p class="text-muted text-sm" style="margin-bottom:16px;">Enter your job number to see what to deliver on site.</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <input id="c3-job" type="text" placeholder="Job number e.g. 1659" autocapitalize="off"
            style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem;outline:none;" />
          <input id="c3-driver" type="text" placeholder="Your name (required)"
            style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem;outline:none;" value="${esc(state.c3.driverName)}" />
          <button class="btn btn-primary" data-action="c3-load" style="width:100%;">Find Job &#8594;</button>
        </div>
        ${state.c3.loading ? `<p class="text-muted text-sm mt-2">Looking up job&#8230;</p>` : ''}
      </div>`;
  }

  function renderC3Check() {
    const items     = state.c3.items;
    const delivered = state.c3.delivered;
    const total     = items.length;
    const done      = Object.values(delivered).filter(d => d.status).length;
    const pct       = total ? Math.round(done / total * 100) : 0;

    const rows = items.map(item => {
      const d  = delivered[item.key] || {};
      const st = d.status || '';
      const rowClass = st === 'delivered' ? 'status-in' : st === 'short' ? 'status-short' : '';
      return `
        <div class="item-row ${rowClass}">
          <div class="item-name">${esc(item.name)}${item.sku ? `<span class="item-sku">${esc(item.sku)}</span>` : ''}</div>
          <div class="item-qty">Qty: ${item.qty}${item.unit ? ' ' + esc(item.unit) : ''}</div>
          ${st === 'short' ? `<input class="qty-input" type="number" min="0" max="${item.qty}"
            placeholder="Qty?" value="${d.deliveredQty !== undefined ? d.deliveredQty : ''}"
            data-action="c3-qty" data-key="${esc(item.key)}" />` : ''}
          <div class="item-status">
            <button class="status-btn ${st === 'delivered' ? 'active-green' : ''}"
              data-action="c3-status" data-key="${esc(item.key)}" data-status="delivered" title="Delivered in full">&#10003;</button>
            <button class="status-btn ${st === 'short' ? 'active-red' : ''}"
              data-action="c3-status" data-key="${esc(item.key)}" data-status="short" title="Short / partial">&#10007;</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="c3-back">&#8592; Back</button></div>
      <div class="card">
        ${state.c3.goodsOutOrder ? (() => {
          const o = state.c3.goodsOutOrder;
          const ctMap = { install: '#dcfce7:#166534:Install', retail: '#dbeafe:#1d4ed8:Retail', trade: '#fef3c7:#92400e:Trade', external: '#f3e8ff:#7e22ce:External' };
          const ctVal = ctMap[o.customer_type] || '#f1f5f9:#475569:Unknown';
          const [ctBg, ctCol, ctLabel] = ctVal.split(':');
          return `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <span style="background:${ctBg};color:${ctCol};font-size:.72rem;font-weight:700;border-radius:20px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em;">${ctLabel}</span>
            <span style="background:#fef3c7;color:#92400e;font-size:.72rem;font-weight:700;border-radius:20px;padding:3px 10px;">&#128666; Delivery</span>
          </div>`;
        })() : ''}
        <div class="flex justify-between items-center" style="margin-bottom:10px;">
          <div>
            <span class="card-title" style="margin-bottom:0;">Delivering - ${esc(displayJobRef(state.c3.jobRef))}</span>
            <div class="text-muted text-sm">${done}/${total} confirmed &middot; tick each item as it lands</div>
          </div>
          <button class="btn btn-primary" data-action="c3-to-signoff" ${done < 1 ? 'disabled' : ''}>Next &#8594;</button>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="item-list">${rows || '<div class="empty-state"><p>No items loaded.</p></div>'}</div>
      </div>`;
  }

  function renderC3Signoff() {
    const s = state.c3.signoff || {};
    const inputStyle = 'width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.95rem;outline:none;';
    const labelStyle = 'font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px;';
    const groupStyle = 'display:flex;flex-direction:column;gap:4px;';

    function radioGroup(name, options, current) {
      return options.map(([val, label]) => {
        const checked = current === val ? 'checked' : '';
        const border  = current === val ? 'var(--teal)' : 'var(--border)';
        const bg      = current === val ? 'var(--teal-faint)' : 'var(--surface)';
        return `<label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid ${border};border-radius:8px;cursor:pointer;font-size:.9rem;background:${bg};">
          <input type="radio" name="${name}" value="${esc(val)}" ${checked} data-action="c3-signoff-radio" data-field="${name}" style="accent-color:var(--teal);" />
          ${esc(label)}
        </label>`;
      }).join('');
    }

    const photos = s.photos || [];
    const photoThumbsHtml = photos.length
      ? photos.map((p, i) => `<div style="position:relative;display:inline-block;margin:4px;">
          <img src="${esc(p.preview)}" style="width:90px;height:90px;object-fit:cover;border-radius:6px;border:1.5px solid var(--border);" />
          <button data-action="c3-photo-remove" data-idx="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#dc2626;color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;padding:0;">&#10005;</button>
        </div>`).join('')
      : '';

    const jobLabel    = esc(displayJobRef(state.c3.jobRef));
    const postcodeVal = esc(s.postcode || '');
    const notesVal    = esc(s.notes || '');
    const teamHtml    = radioGroup('c3-team', [['Team 1','Team 1'],['Team 2','Team 2']], s.team || '');
    const hasShort    = Object.values(state.c3.delivered).some(d => d.status === 'short');
    /* if any item marked short, force partial and hide full-delivery option */
    if (hasShort && s.deliveryStatus !== 'partial' && s.deliveryStatus !== 'failed') {
      if (!state.c3.signoff) state.c3.signoff = {};
      state.c3.signoff.deliveryStatus = 'partial';
      s.deliveryStatus = 'partial';
    }
    const statusOptions = hasShort
      ? [['partial', 'Partial \u2014 some items not delivered'], ['failed', 'No delivery \u2014 delivery failed']]
      : [['all', 'Yes \u2014 all delivered'], ['partial', 'Partial \u2014 some items not delivered'], ['failed', 'No delivery \u2014 delivery failed']];
    const statusHtml  = radioGroup('c3-deliverystatus', statusOptions, s.deliveryStatus || '');
    const presentHtml = radioGroup('c3-customerpresent', [
      ['yes',       'Yes'],
      ['neighbour', 'No \u2014 left with neighbour'],
      ['agreed',    'No \u2014 left in agreed location'],
    ], s.customerPresent || '');
    const photoBtn = s.photoPreview ? '&#128247; Change photo' : '&#128247; Add photo';

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="c3-back-to-check">&#8592; Back to items</button></div>
      <div class="card">
        <div class="card-title">Delivery Sign-off - ${jobLabel}</div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Customer postcode</label>
          <input id="c3-postcode" type="text" placeholder="e.g. AB12 3CD" autocapitalize="characters"
            style="${inputStyle}" value="${postcodeVal}" />
        </div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Delivery team</label>
          <div style="display:flex;flex-direction:column;gap:6px;">${teamHtml}</div>
        </div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Materials delivered?</label>
          <div style="display:flex;flex-direction:column;gap:6px;">${statusHtml}</div>
        </div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Customer present?</label>
          <div style="display:flex;flex-direction:column;gap:6px;">${presentHtml}</div>
        </div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Issues / notes (required)</label>
          <textarea id="c3-notes" rows="3" placeholder="e.g. All delivered, no issues / Missing item X"
            style="${inputStyle}resize:vertical;">${notesVal}</textarea>
        </div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Photos of materials at site (required, add as many as needed)</label>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">${photoThumbsHtml}</div>
          <button class="btn btn-ghost" data-action="c3-photo-pick" style="width:100%;">&#128247; Add photo</button>
          <input type="file" id="c3-photo-input" accept="image/*" capture="environment" style="display:none;" />
        </div>

        <div style="${groupStyle}margin-bottom:16px;">
          <label style="${labelStyle}">Driver signature</label>
          <canvas id="c3-sig-canvas" width="600" height="180"
            style="width:100%;border:1.5px solid var(--border);border-radius:8px;background:#fff;touch-action:none;display:block;"></canvas>
          <button class="btn btn-ghost" data-action="c3-sig-clear" style="align-self:flex-start;font-size:.8rem;padding:5px 12px;">Clear signature</button>
        </div>

        <button class="btn btn-primary" data-action="c3-submit" style="width:100%;padding:14px;">
          Submit delivery
        </button>
      </div>`;
  }

  function renderC3Done() {
    const items     = state.c3.items;
    const delivered = state.c3.delivered;
    const shorts    = items.filter(i => { const d = delivered[i.key]; return d && d.status === 'short'; });

    const shortRows = shorts.map(item => {
      const d      = delivered[item.key];
      const delQty = d.deliveredQty !== undefined ? Number(d.deliveredQty) : 0;
      return `<tr><td>${esc(item.name)}</td><td>${item.qty}</td><td>${delQty}</td><td class="need">${item.qty - delQty}</td></tr>`;
    }).join('');

    return `
      <div class="card">
        <div class="card-title">Delivery submitted - ${esc(displayJobRef(state.c3.jobRef))}</div>
        ${shorts.length === 0
          ? `<div class="empty-state"><div class="icon">&#127881;</div><p>Full delivery - all items confirmed on site.</p></div>`
          : `<p class="text-muted text-sm" style="margin-bottom:12px;">${shorts.length} item${shorts.length !== 1 ? 's' : ''} not fully delivered:</p>
             <table class="shortfall-table"><thead><tr><th>Item</th><th>Expected</th><th>Delivered</th><th>Short</th></tr></thead><tbody>${shortRows}</tbody></table>`}
        <div class="flex gap-2 flex-wrap mt-4">
          <button class="btn btn-ghost" data-action="c3-another">Another Job</button>
          <button class="btn btn-ghost" data-action="go-home">&#8592; Back</button>
        </div>
      </div>`;
  }

  /* ═══════════════════════════════════════════════
     MODULE 4 - STOCK CHECKER (scaffold)
  ═══════════════════════════════════════════════ */
  const C4_CATS = [
    { key: 'wall_floor',  name: 'Wall & Floor',  icon: '&#9638;' },
    { key: 'wet_areas',   name: 'Wet Areas',     icon: '&#9711;' },
    { key: 'glassware',   name: 'Glassware',     icon: '&#9671;' },
    { key: 'brassware',   name: 'Brassware',     icon: '&#9672;' },
    { key: 'furniture',   name: 'Furniture & Ceramics', icon: '&#9636;' },
    { key: 'heating',       name: 'Heating',              icon: '&#9651;' },
    { key: 'mirrors_cabinets', name: 'Mirrors & Cabinets',  icon: '&#9645;' },
    { key: 'sundries',    name: 'Sundries',      icon: '&#9637;' },
    { key: 'eol',         name: 'End of Line',   icon: '&#9735;', special: 'eol' },
    { key: 'misc',        name: 'Miscellaneous', icon: '&#9749;', special: 'misc' },
    { key: 'showroom',    name: 'Showroom Bays',  icon: '&#9734;', special: 'showroom' },
  ];

  async function loadC4Counts() {
    if (state.c4.counts) return;
    state.c4.counts = {};
    const { data, error } = await sb.from('stock_items').select('category');
    if (error) { toast('Could not load stock categories'); return; }
    (data || []).forEach(row => {
      state.c4.counts[row.category] = (state.c4.counts[row.category] || 0) + 1;
    });
  }

  function renderC4Overview() {
    const counts = state.c4.counts || {};
    const catCards = C4_CATS.map(c => {
      if (c.special === 'eol') {
        const n = (state.c4.eolItems || []).length;
        return `
      <div class="c4-cat" data-action="c4-open-eol" style="cursor:pointer;background:linear-gradient(180deg,#f97316 0%,#ffffff 100%);">
        <div class="c4-cat-icon" style="opacity:1;color:#fff;">${c.icon}</div>
        <div class="c4-cat-name" style="color:#7c2d00;">${esc(c.name)}</div>
        <div class="c4-cat-count" style="background:rgba(249,115,22,.15);color:#7c2d00;">${n} item${n === 1 ? '' : 's'}</div>
      </div>`;
      }
      if (c.special === 'misc') {
        const n = state.c4.miscCount || 0;
        return `
      <div class="c4-cat" data-action="c4-open-misc" style="cursor:pointer;background:linear-gradient(180deg,#5b7b8a 0%,#ffffff 100%);">
        <div class="c4-cat-icon" style="opacity:1;color:#fff;">${c.icon}</div>
        <div class="c4-cat-name" style="color:#1e3a42;">${esc(c.name)}</div>
        <div class="c4-cat-count" style="background:rgba(91,123,138,.15);color:#1e3a42;">${n} logged</div>
      </div>`;
      }
      if (c.special === 'showroom') {
        const n = state.c4.showroomCount || 0;
        return `
      <div class="c4-cat" data-action="c4-open-showroom" style="cursor:pointer;background:linear-gradient(180deg,#4a9fa5 0%,#ffffff 100%);">
        <div class="c4-cat-icon" style="opacity:1;color:#fff;">${c.icon}</div>
        <div class="c4-cat-name" style="color:#164044;">${esc(c.name)}</div>
        <div class="c4-cat-count" style="background:rgba(74,159,165,.15);color:#164044;">${n} bay${n === 1 ? '' : 's'} recorded</div>
      </div>`;
      }
      const n = counts[c.key] || 0;
      const tileTop = c.key === 'sundries' ? '#4f6d7a' : '#0075ab';
      const tileDark = c.key === 'sundries' ? '#1a2d35' : '#003d5c';
      const tileAlpha = c.key === 'sundries' ? 'rgba(79,109,122,.15)' : 'rgba(0,117,171,.12)';
      return `
      <div class="c4-cat" data-action="c4-open-cat" data-cat="${c.key}" style="cursor:pointer;background:linear-gradient(180deg,${tileTop} 0%,#ffffff 100%);${n === 0 ? 'opacity:.45' : ''}">
        <div class="c4-cat-icon" style="opacity:1;color:#fff;">${c.icon}</div>
        <div class="c4-cat-name" style="color:${tileDark};">${esc(c.name)}</div>

      <div class="mod-back"><button class="btn btn-ghost" data-action="go-home">&#8592; Back</button></div>
      <div class="card">
        <div class="card-title">Stock Checker</div>
        <p class="text-muted text-sm" style="margin-bottom:12px;">Pick a category, find the product, enter what's currently on the shelf.</p>
        <div class="c4-grid">${catCards}</div>

  /* ── EOL - load all items where sku starts with EOL ── */
  async function loadC4EOLItems() {
    const { data, error } = await sb.from('stock_items')
      .select('*')
      .ilike('sku', 'EOL%')
      .order('install_category')
      .order('name');
    if (error) { toast('Could not load EOL items'); state.c4.eolItems = []; return; }
    state.c4.eolItems = data || [];
  }

  function renderC4EOL() {
    const items = state.c4.eolItems;
    if (!items) {
      return `<div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-overview">&#8592; Categories</button></div>
        <div class="card"><p class="text-muted">Loading&hellip;</p></div>`;
    }
    if (items.length === 0) {
      return `
        <div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-overview">&#8592; Categories</button></div>
        <div class="card">
          <div class="card-title">End of Line</div>
          <div class="empty-state"><div class="icon">&#9989;</div><p>No EOL items found.</p></div>
        </div>`;
    }

    /* group by install_category */
    const groups = {};
    items.forEach(i => {
      const g = i.install_category || 'Uncategorised';
      (groups[g] = groups[g] || []).push(i);
    });
    const groupKeys = Object.keys(groups).sort();

    const sections = groupKeys.map(g => {
      const grpItems = groups[g];
      const isOpen = !!(state.c4.eolExpanded || {})[g];
      const counted = grpItems.filter(i => i.current_qty !== null && i.current_qty !== undefined).length;
      const rows = grpItems.map(i => {
        const isBackordered = !!i.backorder_until;
        const boTag = isBackordered
          ? `<div class="c4-bo-tag" data-action="c4-bo-open" data-id="${esc(i.id)}">Back order - due ${esc(formatDateUK(i.backorder_until))}${i.backorder_note ? ': ' + esc(i.backorder_note) : ''}</div>`
          : `<button class="c4-bo-add" data-action="c4-bo-open" data-id="${esc(i.id)}">+ Back order</button>`;
        const boForm = state.c4.boOpenId === i.id ? `
          <div class="c4-bo-form">
            <input class="text-input" type="date" data-action="c4-bo-date" data-id="${esc(i.id)}" value="${i.backorder_until || ''}" />
            <input class="text-input" type="text" placeholder="Note (optional)" data-action="c4-bo-note" data-id="${esc(i.id)}" value="${esc(i.backorder_note || '')}" style="flex:1;" />
            <button class="btn btn-ghost" data-action="c4-bo-save" data-id="${esc(i.id)}">Save</button>
            ${isBackordered ? `<button class="btn btn-ghost" data-action="c4-bo-clear" data-id="${esc(i.id)}">Clear</button>` : ''}
          </div>` : '';
        return `
        <div class="c4-item-row${isBackordered ? ' c4-item-row-bo' : ''}${i.stocked === 'no' ? ' c4-item-row-oos' : ''}">
          <div class="c4-item-info">
            <div class="c4-item-name">${esc(i.name)}</div>
            ${(i.sku || i.vendor_sku) ? `<span class="item-sku">${esc(i.sku || i.vendor_sku)}</span>` : ''}
            ${i.stocked === 'no' ? `<span class="c4-oos-tag">Out of stock${i.oos_expected_label ? ' - ' + esc(i.oos_expected_label) : ''}</span>` : ''}
            <div class="c4-loc-pills">
              <span class="c4-loc-label">Location</span>
              ${['7','9','11','SHO','19'].map(loc => `<button class="c4-loc-pill${(i.warehouse||'') === loc ? ' active' : ''}" data-action="c4-loc" data-id="${esc(i.id)}" data-loc="${loc}">${loc}</button>`).join('')}
            </div>
            ${boTag}
            ${boForm}
          </div>
          <div class="c4-stepper">
            <button class="c4-step-btn" data-action="c4-step" data-id="${esc(i.id)}" data-dir="-1">&minus;</button>
            <input class="qty-input" type="tel" inputmode="numeric" placeholder="Qty"
              value="${i.current_qty ?? ''}"
              data-action="c4-qty-input" data-id="${esc(i.id)}" />
            <button class="c4-step-btn" data-action="c4-step" data-id="${esc(i.id)}" data-dir="1">&plus;</button>
          </div>
        </div>`;
      }).join('');

      return `
        <div class="c4-eol-group">
          <div class="c4-eol-group-header" data-action="c4-eol-toggle" data-group="${esc(g)}">
            <div class="c4-eol-group-title">${esc(g)}</div>
            <div class="c4-eol-group-meta">
              <span class="c4-cat-count">${grpItems.length} item${grpItems.length !== 1 ? 's' : ''}</span>
              ${counted > 0 ? `<span class="c4-cat-count" style="background:#d1fae5;color:#059669;">${counted} counted</span>` : ''}
              <span class="c4-eol-chevron" style="color:var(--muted);font-size:.85rem;transition:transform .2s;${isOpen ? 'transform:rotate(90deg);' : ''}">&rsaquo;</span>
            </div>
          </div>
          ${isOpen ? `<div class="c4-eol-group-body">${rows}</div>` : ''}
        </div>`;
    }).join('');

    const totalCounted = items.filter(i => i.current_qty !== null && i.current_qty !== undefined).length;

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-overview">&#8592; Categories</button></div>
      <div class="card">
        <div class="card-title">End of Line</div>
        <p class="text-muted text-sm" style="margin-bottom:12px;">${totalCounted} of ${items.length} counted - tap a category to expand</p>
        ${sections}
      </div>`;
  }

  /* ── category item list - count entry screen ── */
  async function loadC4Items(cat) {
    state.c4.loading = true;
    render();
    /* furniture tile also covers ceramics */
    const multiCats = cat === 'furniture' ? ['furniture', 'ceramics'] : null;
    const query = sb.from('stock_items').select('*').order('sub_category').order('name');
    const { data, error } = multiCats
      ? await query.in('category', multiCats)
      : await query.eq('category', cat);
    state.c4.loading = false;
    if (error) { toast('Could not load items'); state.c4.items = []; return; }
    state.c4.items = data || [];
  }

    const { data, error } = await sb.from('misc_stock').select('*').order('created_at', { ascending: false });
    if (error) { toast('Could not load misc items'); return; }
    state.c4.miscItems = data || [];
    state.c4.miscCount = (data || []).length;

    const rows = items.map(i => {
      const hasImg  = !!i.image_url;

        <div class="c4-item-info" style="flex:1;min-width:0;">

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
        <div class="card-title" style="font-size:.9rem;margin-bottom:4px;">Log an item</div>
        <p class="text-muted text-sm" style="margin-bottom:12px;">Add a photo, a description, or both. At least one is required.</p>

        <div style="margin-bottom:12px;">
          <label style="font-size:.75rem;color:var(--text-muted);display:block;margin-bottom:6px;">Photo <span style="color:var(--muted);font-weight:400;">(tap to capture or choose)</span></label>
          ${preview
            ? `<div style="position:relative;display:inline-block;">
                <img src="${esc(preview)}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;" />
                <button data-action="c4-misc-img-clear" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-weight:700;">&times;</button>
               </div>
               <br/><button class="btn btn-ghost" data-action="c4-misc-img-pick" style="margin-top:6px;font-size:.78rem;padding:5px 10px;">&#128247; Change photo</button>`
            : `<button class="btn btn-ghost" data-action="c4-misc-img-pick" style="font-size:.85rem;padding:8px 14px;">&#128247; Add photo</button>`
          }
          <input type="file" id="c4-misc-img-input" accept="image/*" capture="environment" style="display:none;" />
        </div>

        <div style="margin-bottom:10px;">
          <label style="font-size:.75rem;color:var(--text-muted);display:block;margin-bottom:4px;">Description <span style="color:var(--muted);font-weight:400;">(optional if photo added)</span></label>
          <textarea class="text-input" id="misc-desc" placeholder="e.g. Roca toilet seat, white, box of 2&hellip;" rows="2" style="width:100%;resize:none;"></textarea>
        </div>

        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
          <label style="font-size:.78rem;color:var(--text-muted);white-space:nowrap;">Qty</label>
          <input class="text-input" id="misc-qty" type="tel" inputmode="numeric" placeholder="0" style="width:70px;" />

        <div class="c4-loc-pills" style="margin-bottom:12px;">
          <span class="c4-loc-label">Location</span>
          ${locs.map(l => `<button class="c4-loc-pill" data-action="c4-misc-loc" data-loc="${l}">${l}</button>`).join('')}

        <p class="text-muted text-sm" style="margin-bottom:12px;">Log any items that aren't in the main stock lists. Admin will review and add them properly.</p>
        ${items.length ? rows : '<p class="text-muted text-sm">Nothing logged yet.</p>'}

  async function saveMiscItem() {
    const desc     = (document.getElementById('misc-desc') || {}).value || '';
    const qty      = (document.getElementById('misc-qty')  || {}).value || '';
    const loc      = state.c4.miscLoc || null;
    const file     = state.c4.miscImgFile || null;
    const hasDesc  = !!desc.trim();
    const hasPhoto = !!file;
    if (!hasDesc && !hasPhoto) { toast('Add a photo or description first'); return; }

    let imageUrl = null;
    if (hasPhoto) {
      const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = 'misc/misc-' + Date.now() + '.' + ext;
      const { error: upErr } = await sb.storage.from('showroom-images').upload(path, file, { upsert: true });
      if (upErr) { toast('Photo upload failed - check connection'); return; }
      const { data: urlData } = sb.storage.from('showroom-images').getPublicUrl(path);
      imageUrl = urlData ? urlData.publicUrl : null;
    }

    const row = {
      description:  hasDesc ? desc.trim() : null,
      qty:          qty === '' ? null : Number(qty),
      warehouse:    loc,
      submitted_by: state.role || 'warehouse',
      reviewed:     false,
      image_url:    imageUrl,
    };
    const { error } = await sb.from('misc_stock').insert(row);
    if (error) { toast('Save failed: ' + error.message); return; }
    state.c4.miscLoc      = null;
    state.c4.miscImgFile  = null;
    state.c4.miscImgPreview = null;
    await loadMiscItems();
    render();
    toast('Item logged');
  }

  async function deleteMiscItem(id) {
    if (!confirm('Remove this item?')) return;
    const { error } = await sb.from('misc_stock').delete().eq('id', id);
    if (error) { toast('Delete failed'); return; }
    await loadMiscItems();
    render();
  }

  /* ── showroom bays ── */
  const SHOWROOM_FIELDS = ['Bath or Shower', 'Screen', 'WC', 'Basin', 'Furniture', 'Brassware', 'Wall Panels', 'Flooring'];

  async function loadShowroomBays() {
    const { data, error } = await sb.from('showroom_bays').select('*').order('bay_number', { ascending: true });
    if (error) { toast('Could not load showroom bays'); return; }
    state.c4.showroomBays = data || [];
    state.c4.showroomCount = (data || []).length;
  }

  async function loadWallPanels() {
    const { data, error } = await sb.from('showroom_wall_panels').select('*').order('position');
    if (error) { /* table may not exist yet - soft fail */ state.c4.wallPanels = []; return; }
    state.c4.wallPanels = data || [];
  }

  async function saveWallPanel(panelId) {
    const nameEl = document.getElementById('wp-name-' + panelId);
    const noteEl = document.getElementById('wp-note-' + panelId);
    if (!nameEl) return;
    const row = {
      id: panelId,
      name: nameEl.value.trim() || null,
      note: noteEl ? noteEl.value.trim() || null : null,
    };
    const { error } = await sb.from('showroom_wall_panels').upsert(row, { onConflict: 'id' });
    if (error) { toast('Save failed'); return; }
    toast('Wall panel saved');
    await loadWallPanels();
    render();
  }

  async function addWallPanel() {
    const pos = ((state.c4.wallPanels || []).length) + 1;
    const { data, error } = await sb.from('showroom_wall_panels').insert({ position: pos, name: null, note: null }).select().single();
    if (error) { toast('Could not add panel'); return; }
    state.c4.wallPanels = [...(state.c4.wallPanels || []), data];
    render();
  }

  async function deleteWallPanel(id) {
    if (!confirm('Remove this wall panel?')) return;
    await sb.from('showroom_wall_panels').delete().eq('id', id);
    await loadWallPanels();
    render();
  }

  async function uploadWallPanelImage(id, file) {
    if (!file) return;
    const ext = file.name.split('.').pop() || 'jpg';
    const path = id + '-' + Date.now() + '.' + ext;
    const { error: upErr } = await sb.storage.from('showroom-images').upload(path, file, { upsert: true });
    if (upErr) { toast('Image upload failed'); return; }
    const { data: urlData } = sb.storage.from('showroom-images').getPublicUrl(path);
    const publicUrl = urlData.publicUrl;
    const { error: dbErr } = await sb.from('showroom_wall_panels').update({ image_url: publicUrl }).eq('id', id);
    if (dbErr) { toast('Could not save image URL'); return; }
    const panel = (state.c4.wallPanels || []).find(p => p.id === id);
    if (panel) panel.image_url = publicUrl;
    render();
    toast('Image saved');
  }

  function renderC4Showroom() {
    const bays = state.c4.showroomBays || [];
    const editing = state.c4.showroomEditing; // bay_number being edited, or null for new

    const bayCards = bays.map(b => {
      const fields = SHOWROOM_FIELDS.map(f => {
        const key = f.toLowerCase().replace(/ /g, '_').replace(/\//g, '_');
        const val = b[key];
        const imgUrl = b[key + '_image'];
        const imgEl = imgUrl
          ? `<div style="position:relative;display:inline-block;">
              <img class="c4-bay-img-thumb" src="${esc(imgUrl)}" alt="${esc(f)}" data-action="c4-bay-img-pick" data-bay="${esc(String(b.bay_number))}" data-field="${esc(key)}" title="Tap to change photo" />
              <button class="c4-bay-img-del-btn" data-action="c4-bay-img-del" data-bay="${esc(String(b.bay_number))}" data-field="${esc(key)}" title="Remove photo" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-weight:700;">&times;</button>
            </div>`
          : `<div class="c4-bay-img-add" data-action="c4-bay-img-pick" data-bay="${esc(String(b.bay_number))}" data-field="${esc(key)}" title="Add photo">&#128247;</div>`;
        return `
          <div class="c4-bay-field-row">
            <div class="c4-bay-field-text">
              <span>${esc(f)}</span>
              <strong>${val ? esc(val) : '<span style="color:var(--muted);font-style:italic;">Not recorded</span>'}</strong>
            </div>
            ${imgEl}
          </div>`;
      }).join('');
      return `
      <div class="c4-item-row" style="align-items:flex-start;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
          <div class="c4-item-name">Bay ${esc(String(b.bay_number))}</div>
          <button class="btn btn-ghost" data-action="c4-showroom-edit" data-bay="${esc(String(b.bay_number))}" style="font-size:.75rem;padding:4px 8px;">Edit</button>
        </div>
        ${fields}
      </div>`;
    }).join('');

    const isEditing = editing !== null && editing !== undefined;
    const editBay = isEditing ? bays.find(b => String(b.bay_number) === String(editing)) : null;

    const formFields = SHOWROOM_FIELDS.map(f => {
      const key = f.toLowerCase().replace(/ /g, '_').replace(/\//g, '_');
      const val = editBay ? (editBay[key] || '') : '';
      return `
        <div style="margin-bottom:8px;">
          <label style="font-size:.75rem;color:var(--text-muted);display:block;margin-bottom:3px;">${esc(f)}</label>
          <input class="text-input" type="text" id="sbay-${key}" placeholder="e.g. Kaldewei Puro 170x70" value="${esc(val)}" style="width:100%;" />
        </div>`;
    }).join('');

    const form = `
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
        <div class="card-title" style="font-size:.9rem;margin-bottom:10px;">${isEditing ? 'Edit Bay ' + esc(String(editing)) : 'Record a bay'}</div>
        <div style="margin-bottom:8px;">
          <label style="font-size:.75rem;color:var(--text-muted);display:block;margin-bottom:3px;">Bay number</label>
          <input class="text-input" id="sbay-number" type="tel" inputmode="numeric" placeholder="e.g. 6" value="${isEditing ? esc(String(editing)) : ''}" style="width:90px;" ${isEditing ? 'readonly' : ''} />
        </div>
        ${formFields}
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="btn btn-primary" data-action="c4-showroom-save" style="flex:1;">Save bay</button>
          ${isEditing ? `<button class="btn btn-ghost" data-action="c4-showroom-cancel" style="flex:1;">Cancel</button>` : ''}
        </div>
      </div>`;

    /* ── wall panels section ── */
    const wallPanels = state.c4.wallPanels || [];
    const wallPanelCards = wallPanels.map(p => {

              <button class="btn btn-ghost" data-action="c4-wp-delete" data-id="${esc(p.id)}" style="font-size:.72rem;padding:3px 8px;color:#dc2626;">Remove</button>

  async function saveShowroomBay() {
    const bayNum = parseInt((document.getElementById('sbay-number') || {}).value || '', 10);
    if (!bayNum || isNaN(bayNum)) { toast('Enter a bay number'); return; }
    const row = { bay_number: bayNum };
    SHOWROOM_FIELDS.forEach(f => {
      const key = f.toLowerCase().replace(/ /g, '_').replace(/\//g, '_');
      const el = document.getElementById('sbay-' + key);
      row[key] = el ? (el.value.trim() || null) : null;
    });
    /* upsert on bay_number - overwrites existing record for that bay */
    const { error } = await sb.from('showroom_bays').upsert(row, { onConflict: 'bay_number' });
    if (error) { toast('Save failed - check connection'); return; }
    state.c4.showroomEditing = null;
    await loadShowroomBays();
    render();
    toast('Bay saved');
  }

  async function uploadBayFieldImage(bayNumber, fieldKey, file) {
    if (!file) return;
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = 'bay-' + bayNumber + '-' + fieldKey + '-' + Date.now() + '.' + ext;
    const { error: upErr } = await sb.storage.from('showroom-images').upload(path, file, { upsert: true });
    if (upErr) { toast('Image upload failed'); return; }
    const { data: urlData } = sb.storage.from('showroom-images').getPublicUrl(path);
    const publicUrl = urlData.publicUrl;
    const col = fieldKey + '_image';
    const { error: dbErr } = await sb.from('showroom_bays').update({ [col]: publicUrl }).eq('bay_number', bayNumber);
    if (dbErr) { toast('Could not save image URL'); return; }
    /* update local state so render reflects immediately */
    const bay = (state.c4.showroomBays || []).find(b => String(b.bay_number) === String(bayNumber));
    if (bay) bay[col] = publicUrl;
    render();
    toast('Photo saved');
  }

  async function clearBayFieldImage(bayNumber, fieldKey) {
    if (!confirm('Remove this photo?')) return;
    const col = fieldKey + '_image';
    /* get current URL so we can delete from storage */
    const bay = (state.c4.showroomBays || []).find(b => String(b.bay_number) === String(bayNumber));
    const currentUrl = bay ? bay[col] : null;
    /* null out the DB column */
    const { error: dbErr } = await sb.from('showroom_bays').update({ [col]: null }).eq('bay_number', bayNumber);
    if (dbErr) { toast('Could not remove photo'); return; }
    /* attempt to delete from storage - best effort, don't block on error */
    if (currentUrl) {
      const parts = currentUrl.split('/showroom-images/');
      if (parts[1]) {
        await sb.storage.from('showroom-images').remove([parts[1]]);
      }
    }
    if (bay) bay[col] = null;
    render();
    toast('Photo removed');
  }

  /* ── derive unique option values from loaded items ── */
  function c4FilterOptions(field) {
    const items = state.c4.items || [];
    const seen = new Set();
    items.forEach(i => { if (i[field]) seen.add(i[field]); });
    return Array.from(seen).sort();
  }

  function renderC4FilterBar() {
    const f = state.c4.filters || {};
    const open = state.c4.filterOpen || false;
    const activeCount = [f.vendor, f.install_category, f.stocked, f.warehouse].filter(Boolean).length;
    const badge = activeCount > 0 ? `<span class="c4-filter-badge">${activeCount}</span>` : '';

    const vendorOpts = ['', ...c4FilterOptions('vendor')].map(v =>
      `<option value="${esc(v)}" ${f.vendor === v ? 'selected' : ''}>${v ? esc(v) : 'All vendors'}</option>`).join('');
    const installOpts = ['', ...c4FilterOptions('install_category')].map(v =>
      `<option value="${esc(v)}" ${f.install_category === v ? 'selected' : ''}>${v ? esc(v) : 'All categories'}</option>`).join('');
    const stockedOpts = [['', 'All items'], ['Yes', 'Stocked only'], ['No', 'Not stocked']].map(([val, label]) =>
      `<option value="${val}" ${(f.stocked || '') === val ? 'selected' : ''}>${label}</option>`).join('');
    const warehouseOpts = ['', ...c4FilterOptions('warehouse')].map(v =>
      `<option value="${esc(v)}" ${f.warehouse === v ? 'selected' : ''}>${v ? 'Bay ' + esc(v) : 'All locations'}</option>`).join('');

    const panel = open ? `
      <div class="c4-filter-panel">
        <div class="c4-filter-row">
          <label class="c4-filter-label">Vendor</label>
          <select class="c4-filter-select" data-action="c4-filter-change" data-field="vendor">${vendorOpts}</select>
        </div>
        <div class="c4-filter-row">
          <label class="c4-filter-label">Install Category</label>
          <select class="c4-filter-select" data-action="c4-filter-change" data-field="install_category">${installOpts}</select>
        </div>
        <div class="c4-filter-row">
          <label class="c4-filter-label">Stocked</label>
          <select class="c4-filter-select" data-action="c4-filter-change" data-field="stocked">${stockedOpts}</select>
        </div>
        <div class="c4-filter-row">
          <label class="c4-filter-label">Warehouse Location</label>
          <select class="c4-filter-select" data-action="c4-filter-change" data-field="warehouse">${warehouseOpts}</select>
        </div>
        ${activeCount > 0 ? `<button class="c4-filter-clear" data-action="c4-filter-clear">Clear all filters</button>` : ''}
      </div>` : '';

    return `<div class="c4-filter-bar">
      <button class="c4-filter-toggle" data-action="c4-filter-toggle">
        <span>&#9663; Filter</span>
        ${badge}
        <span style="margin-left:auto;font-size:.75rem;color:var(--muted);">${open ? 'Hide' : 'Show'}</span>
      </button>
      ${panel}
    </div>`;
  }

  function applyC4Filters(items) {
    const f = state.c4.filters || {};
    return items.filter(i => {
      if (f.vendor          && i.vendor           !== f.vendor)           return false;
      if (f.install_category && i.install_category !== f.install_category) return false;
      if (f.stocked         && i.stocked           !== f.stocked)          return false;
      if (f.warehouse       && i.warehouse          !== f.warehouse)        return false;
      return true;
    });
  }

  function renderC4SubCats() {
    const cat = C4_CATS.find(c => c.key === state.c4.cat);
    if (state.c4.loading) {
      return `<div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-overview">&#8592; Categories</button></div>
        <div class="card"><p class="text-muted">Loading&hellip;</p></div>`;
    }
    const items = state.c4.items || [];

    /* group by sub_category, count items and counted items per group */
    const groups = {};
    items.forEach(i => {
      const g = i.sub_category || 'Other';
      if (!groups[g]) groups[g] = { total: 0, counted: 0 };
      groups[g].total++;
      if (i.current_qty !== null && i.current_qty !== undefined) groups[g].counted++;
    });
    const groupKeys = Object.keys(groups).sort();

    const rows = groupKeys.map(g => {
      const { total, counted } = groups[g];
      return `
        <div class="c4-subcat-row" data-action="c4-open-subcat" data-subcat="${esc(g)}">
          <div class="c4-subcat-name">${esc(g)}</div>
          <div class="c4-subcat-meta">
            <span class="c4-cat-count">${total} item${total !== 1 ? 's' : ''}</span>
            ${counted > 0 ? `<span class="c4-cat-count" style="background:#d1fae5;color:#059669;">${counted} counted</span>` : ''}
          </div>
          <span style="color:var(--muted);font-size:.9rem;">&#9658;</span>
        </div>`;
    }).join('');

    const totalCounted = items.filter(i => i.current_qty !== null && i.current_qty !== undefined).length;

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-overview">&#8592; Categories</button></div>
      <div class="card">
        <div class="card-title">${esc(cat ? cat.name : '')}</div>
        <p class="text-muted text-sm" style="margin-bottom:12px;">${totalCounted} of ${items.length} counted</p>
        ${rows || '<div class="text-muted text-sm">No items found.</div>'}
      </div>`;
  }

  function renderC4Category() {
    const cat = C4_CATS.find(c => c.key === state.c4.cat);
    if (state.c4.loading) {
      return `<div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-subcats">&#8592; ${esc(state.c4.subCat || 'Back')}</button></div>
        <div class="card"><p class="text-muted">Loading items&hellip;</p></div>`;
    }
    const allItems = state.c4.items || [];
    const subCat = state.c4.subCat || null;
    const inSubCat = subCat ? allItems.filter(i => (i.sub_category || 'Other') === subCat) : allItems;
    const q = (state.c4.search || '').toLowerCase().trim();
    const afterSearch = q
      ? inSubCat.filter(i => (i.name || '').toLowerCase().includes(q) || (i.sku || i.vendor_sku || '').toLowerCase().includes(q) || (i.vendor || '').toLowerCase().includes(q))
      : inSubCat;
    const filtered = applyC4Filters(afterSearch);

    /* group by sub_category */
    const groups = {};
    filtered.forEach(i => {
      const g = i.sub_category || 'Other';
      (groups[g] = groups[g] || []).push(i);
    });
    const groupKeys = Object.keys(groups).sort();

    const countedTotal = inSubCat.filter(i => i.current_qty !== null && i.current_qty !== undefined).length;

    const sections = groupKeys.map(g => {
      const rows = groups[g].map(i => {
        const isBackordered = !!i.backorder_until;
        const boTag = isBackordered
          ? `<div class="c4-bo-tag" data-action="c4-bo-open" data-id="${esc(i.id)}">Back order - due ${esc(formatDateUK(i.backorder_until))}${i.backorder_note ? `: ${esc(i.backorder_note)}` : ''}</div>`
          : `<button class="c4-bo-add" data-action="c4-bo-open" data-id="${esc(i.id)}">+ Back order</button>`;
        const boForm = state.c4.boOpenId === i.id ? `
          <div class="c4-bo-form">
            <input class="text-input" type="date" data-action="c4-bo-date" data-id="${esc(i.id)}" value="${i.backorder_until || ''}" />
            <input class="text-input" type="text" placeholder="Note (optional)" data-action="c4-bo-note" data-id="${esc(i.id)}" value="${esc(i.backorder_note || '')}" style="flex:1;" />
            <button class="btn btn-ghost" data-action="c4-bo-save" data-id="${esc(i.id)}">Save</button>
            ${isBackordered ? `<button class="btn btn-ghost" data-action="c4-bo-clear" data-id="${esc(i.id)}">Clear</button>` : ''}
          </div>` : '';
        return `
        <div class="c4-item-row${isBackordered ? ' c4-item-row-bo' : ''}${i.stocked === 'no' ? ' c4-item-row-oos' : ''}">
          <div class="c4-item-info">
            <div class="c4-item-name">${esc(i.name)}</div>
            ${(i.sku || i.vendor_sku) ? `<span class="item-sku">${esc(i.sku || i.vendor_sku)}</span>` : ''}
            ${i.stocked === 'no' ? `<span class="c4-oos-tag">Out of stock${i.oos_expected_label ? ' - ' + esc(i.oos_expected_label) : ''}</span>` : ''}
            <div class="c4-loc-pills">
              <span class="c4-loc-label">Location</span>
              ${['7','9','11','SHO','19'].map(loc => `<button class="c4-loc-pill${(i.warehouse||'') === loc ? ' active' : ''}" data-action="c4-loc" data-id="${esc(i.id)}" data-loc="${loc}">${loc}</button>`).join('')}
            </div>
            ${boTag}
            ${boForm}
          </div>
          <div class="c4-stepper">
            <button class="c4-step-btn" data-action="c4-step" data-id="${esc(i.id)}" data-dir="-1">&minus;</button>
            <input class="qty-input" type="tel" inputmode="numeric" placeholder="Qty"
              value="${i.current_qty ?? ''}"
              data-action="c4-qty-input" data-id="${esc(i.id)}" />
            <button class="c4-step-btn" data-action="c4-step" data-id="${esc(i.id)}" data-dir="1">&plus;</button>
          </div>
        </div>`;
      }).join('');
      return `<div class="c4-group">
        <div class="c4-group-title">${esc(g)}</div>
        ${rows}
      </div>`;
    }).join('') || `<div class="empty-state"><div class="icon">&#128269;</div><p>No items match</p></div>`;

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="c4-back-subcats">&#8592; ${esc(state.c4.subCat || (cat ? cat.name : 'Back'))}</button></div>
      <div class="card">
        <div class="card-title">${esc(state.c4.subCat || (cat ? cat.name : ''))}</div>
        <p class="text-muted text-sm" style="margin-bottom:8px;">${countedTotal} of ${inSubCat.length} counted</p>
        <input class="text-input" type="text" placeholder="Search by name or SKU&hellip;"
          value="${esc(state.c4.search || '')}" data-action="c4-search" style="margin-bottom:10px;width:100%;" />
        ${renderC4FilterBar()}
        ${sections}
      </div>`;
  }

  function formatDateUK(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  let c4SaveTimers = {};
  function queueC4Save(id, qty) {
    clearTimeout(c4SaveTimers[id]);
    c4SaveTimers[id] = setTimeout(() => saveC4Qty(id, qty), 500);
  }
  async function saveC4Qty(id, qty) {
    const val = qty === '' ? null : Number(qty);
    const countedBy = state.role || 'warehouse';
    const countedAt = new Date().toISOString();
    const { error } = await sb.from('stock_items').update({
      current_qty: val,
      counted_by:  countedBy,
      counted_at:  countedAt,
    }).eq('id', id);
    if (error) { toast('Save failed - check connection'); return; }
    const item = (state.c4.items || []).find(i => i.id === id);
    if (item) item.current_qty = val;
    state.c4.counts = null; state.c4.countedCounts = null;
    /* count history - append only, never blocks the main save if it fails */
    sb.from('stock_count_log').insert({ item_id: id, qty: val, counted_by: countedBy, counted_at: countedAt });
  }

  async function saveC4Location(id, loc) {
    const item = (state.c4.items || []).find(i => i.id === id);
    if (!item) return;
    /* toggle off if already selected */
    const newVal = item.warehouse === loc ? null : loc;
    const { error } = await sb.from('stock_items').update({ warehouse: newVal }).eq('id', id);
    if (error) { toast('Save failed - check connection'); return; }
    item.warehouse = newVal;
    render();
  }

  function stepC4Qty(id, dir) {
    const item = (state.c4.items || []).find(i => i.id === id);
    if (!item) return;
    const current = Number(item.current_qty) || 0;
    const next = Math.max(0, current + dir);
    item.current_qty = next;
    render();
    saveC4Qty(id, String(next));
  }

  function toggleBoForm(id) {
    state.c4.boOpenId = state.c4.boOpenId === id ? null : id;
    render();
  }

  async function saveBackorder(id) {
    const dateEl = document.querySelector(`[data-action="c4-bo-date"][data-id="${id}"]`);
    const noteEl = document.querySelector(`[data-action="c4-bo-note"][data-id="${id}"]`);
    const dateVal = dateEl ? dateEl.value : '';
    const noteVal = noteEl ? noteEl.value.trim() : '';
    if (!dateVal) { toast('Pick a date first'); return; }
    const { error } = await sb.from('stock_items').update({
      backorder_until: dateVal,
      backorder_note: noteVal || null,
      backorder_logged_by: state.role || 'office',
      backorder_logged_at: new Date().toISOString(),
    }).eq('id', id);
    if (error) { toast('Save failed - check connection'); return; }
    const item = (state.c4.items || []).find(i => i.id === id);
    if (item) { item.backorder_until = dateVal; item.backorder_note = noteVal || null; }
    state.c4.boOpenId = null;
    render();
    toast('Back order logged');
  }

  async function clearBackorder(id) {
    const { error } = await sb.from('stock_items').update({
      backorder_until: null, backorder_note: null,
    }).eq('id', id);
    if (error) { toast('Save failed - check connection'); return; }
    const item = (state.c4.items || []).find(i => i.id === id);
    if (item) { item.backorder_until = null; item.backorder_note = null; }
    state.c4.boOpenId = null;
    render();
  }

  /* ═══════════════════════════════════════════════
     EVENT BINDING (drag-and-drop for M1)
  ═══════════════════════════════════════════════ */
  function bindEvents() {
    const dz = document.getElementById('drop-zone');
    if (dz) {
      dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
      dz.addEventListener('drop', e => {
        e.preventDefault();
        dz.classList.remove('drag-over');
        handleFiles([...e.dataTransfer.files].filter(f => f.type === 'application/pdf'));
      });
    }
    /* Goods In file input */
    attachGIFileListener();
    attachGOFileListener();
  }

  /* ═══════════════════════════════════════════════
     GLOBAL CLICK HANDLER
  ═══════════════════════════════════════════════ */
  document.addEventListener('click', async e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    /* ── navigation ── */
    if (action === 'open-module') {
      stopSnake();
      const mod = btn.dataset.mod;
      state.module = mod;
      if (mod === 'verifier')   { state.view = 'pp-home'; loadC6BadgeCount(); }
      if (mod === 'completion') { state.view = 'c2-home'; }
      if (mod === 'delivery')   { state.view = 'c3-home'; }
      if (mod === 'stock')      { state.view = 'c4-overview'; Promise.all([loadC4Counts(), loadMiscItems(), loadShowroomBays(), loadWallPanels(), loadC4EOLItems()]).then(render); }
      if (mod === 'admin')      { state.module = 'admin'; applyTheme('home'); state.view = 'admin-home'; render(); return; }
      if (mod === 'remedial')   { state.module = 'remedial'; state.view = 'c6-list'; applyTheme('remedial'); loadC6Remedials().then(render); render(); return; }
      if (mod === 'goodsin')    {
        state.module = 'goodsin';
        state.view = 'c5-list';
        applyTheme('goodsin');
        render(); loadC5POs();
        return;
      }
      render(); return;
    }
    /* ── upload-cancel: clears staging/append state, returns to pp-home without wiping M2/M3 ── */
    if (action === 'upload-cancel') {
      state.stagedFiles       = [];
      state.appendTarget      = null;
      state.dupWarnings       = [];
      state.dupPendingJobObjs = null;
      state.module = 'verifier'; state.view = 'pp-home';
      state.dash = { loading: true, m1: [], m2: [], m3: [] };
      render(); return;
    }
    if (action === 'stock-oos-open') {
      state.dash.oosOpen = true;
      state.dash.oosSearch = '';
      const dashEl = document.getElementById('dashboard');
      if (dashEl) dashEl.innerHTML = renderDashboardContent();
      return;
    }
    if (action === 'stock-oos-close') {
      state.dash.oosOpen = false;
      const dashEl = document.getElementById('dashboard');
      if (dashEl) dashEl.innerHTML = renderDashboardContent();
      return;
    }
    if (action === 'stock-oos-mark-open') {
      openOosMarkForm(btn.dataset.id);
      return;
    }
    if (action === 'stock-oos-mark-cancel') {
      closeOosMarkForm();
      return;
    }
    if (action === 'stock-oos-confirm') {
      confirmOosMark(btn.dataset.id);
      return;
    }
    if (action === 'stock-toggle-oos') {
      toggleOosItem(btn.dataset.id, btn.dataset.current === '1');
      return;
    }
    if (action === 'stock-add-open') {
      state.dash.addItemOpen = true;
      const dashEl = document.getElementById('dashboard');
      if (dashEl) dashEl.innerHTML = renderDashboardContent();
      return;
    }
    if (action === 'stock-add-cancel') {
      state.dash.addItemOpen = false;
      const dashEl = document.getElementById('dashboard');
      if (dashEl) dashEl.innerHTML = renderDashboardContent();
      return;
    }
    if (action === 'stock-add-save') {
      saveStockAddItem();
      return;
    }
    if (action === 'c4-step') {
      stepC4Qty(btn.dataset.id, Number(btn.dataset.dir));
      return;
    }
    if (action === 'c4-loc') {
      saveC4Location(btn.dataset.id, btn.dataset.loc);
      return;
    }
    if (action === 'c4-open-showroom') {

      const { error } = await sb.from('pick_completions').delete()
        .or(`job_ref.eq.${job},job_ref.eq.Q${job},job_ref.ilike.${job} %`);

      const warnings = state.dupWarnings || [];
      const dupRefs  = new Set(warnings.map(w => String(w.quoteRef).toUpperCase()));
      for (const w of warnings) {
        await sb.from('audit_log').insert({
          event: 'duplicate_skipped',
          detail: JSON.stringify({ quote_ref: w.quoteRef, existing_code: w.existingCode, existing_date: w.existingDate }),

        });
      }
      const jobObjs = (state.dupPendingJobObjs || []).filter(j => !dupRefs.has(String(j.id).toUpperCase()));
      state.dupWarnings = [];
      state.dupPendingJobObjs = null;
      if (!jobObjs.length) {
        toast('All files in this batch were duplicates - nothing to upload');
        state.stagedFiles = [];
        render(); return;

      const masterList = buildMasterList(jobObjs);
