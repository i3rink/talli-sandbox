      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
      width: 100%;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .45;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 80px;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .header-logo-wrap {
      flex-shrink: 0;
      width: 160px;
      height: 44px;
      display: flex;
      align-items: center;
    }
    .header-logo-svg { width: 160px; height: auto; display: block; }
    .header-divider { width: 1px; height: 36px; background: var(--border); flex-shrink: 0; }
    .header-text span { font-size: .8rem; color: var(--muted); white-space: nowrap; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 600;
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 28px 20px;
      text-align: center;
      transition: border-color .2s, background .2s;
      cursor: pointer;
    }
    .upload-zone.drag-over { border-color: var(--teal); background: var(--teal-faint); }
    .upload-zone p { color: var(--muted); font-size: .9rem; margin-bottom: 14px; }
    .upload-zone p strong { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }
    #file-input { display: none; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s, transform .1s, opacity .15s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--teal); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--teal-dark); }
    .btn-outline { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); }
    .btn-outline:hover:not(:disabled) { background: var(--teal-faint); }
    .btn-ghost { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--red); color: #fff; }

    .upload-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }

    .btn-drive { background: #fff; color: #3c4043; border: 1.5px solid #dadce0; font-weight: 600; }
    .btn-drive:hover:not(:disabled) { background: #f8f9fa; border-color: #4285f4; }
    .btn-drive svg { flex-shrink: 0; }

    .drive-status { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); margin-top: 10px; justify-content: center; }
    .drive-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .drive-status.authed .dot { background: var(--green); }
    .drive-status.authed { color: var(--green); }

    .session-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .session-code { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--teal); letter-spacing: .08em; flex: 1; }

    /* ── Item rows ── */
    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: .875rem;
    }
    .item-name { flex: 1; font-weight: 500; }
    .item-qty { color: var(--muted); font-size: .8rem; white-space: nowrap; }
    .item-status { display: flex; gap: 6px; flex-shrink: 0; }
    .status-btn {
      width: 32px; height: 32px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, border-color .12s;
    }
    .status-btn.active-green { background: #d1fae5; border-color: var(--green); }
    .status-btn.active-amber { background: #fef3c7; border-color: var(--amber); }
    .status-btn.active-red   { background: #fee2e2; border-color: var(--red); }

    .item-row.status-in    { background: #f0fdf4; border-color: #bbf7d0; }
    .item-row.status-part  { background: #fffbeb; border-color: #fde68a; }
    .item-row.status-short { background: #fef2f2; border-color: #fecaca; }

    .qty-input {
      width: 64px; padding: 4px 8px;
      border: 1.5px solid var(--amber); border-radius: 6px;
      font-family: 'Hanken Grotesk', sans-serif; font-size: .85rem;
      text-align: center; outline: none;
    }
    .qty-input:focus { border-color: var(--teal); }

    .job-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .75rem; font-weight: 600; background: var(--teal-light); color: var(--teal-dark); margin-right: 4px; margin-bottom: 2px; }

    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text); color: #fff;
      padding: 10px 20px; border-radius: 99px;
      font-size: .85rem; font-weight: 500;
      z-index: 999; transition: transform .25s ease;
      white-space: nowrap; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .shortfall-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .shortfall-table th { text-align: left; padding: 6px 8px; color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
    .shortfall-table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .shortfall-table tr:last-child td { border-bottom: none; }
    .need { color: var(--red); font-weight: 600; }

    .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn { padding: 7px 16px; border-radius: 99px; border: 1.5px solid var(--border); background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; }
    .tab-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; }

    .progress-bar-wrap { background: var(--border); border-radius: 99px; height: 6px; margin-bottom: 14px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--teal); border-radius: 99px; transition: width .3s ease; }

    .text-muted { color: var(--muted); }
    .text-sm { font-size: .82rem; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .flex { display: flex; }
    .gap-2 { gap: 8px; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .w-full { width: 100%; }

    .empty-state { text-align: center; padding: 32px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Home launchpad ── */
    .lp-intro { margin-bottom: 20px; }
    .lp-intro h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }

    .lp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    /* M5 and M6 share bottom row — no full-width override */
    .lp-card {
      position: relative;
      display: flex; flex-direction: column; gap: 6px;
      padding: 20px 18px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      border-top-width: 3px;
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      transition: transform .12s, box-shadow .15s;
      font-family: 'Hanken Grotesk', sans-serif;
    }
    .lp-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .lp-card:active { transform: scale(.98); }
    .lp-card.c-blue   { border-top-color: #0075ab; }
    .lp-card.c-green  { border-top-color: #059669; }
    .lp-card.c-orange { border-top-color: #ea580c; }
    .lp-card.c-purple { border-top-color: #7c3aed; opacity: .85; }
    .lp-card.c-teal   { border-top-color: #0d9488; }
    .lp-card.c-slate  { border-top-color: #475569; }
    /* M6 remedial badge */
    .lp-badge-count { position: absolute; top: 10px; right: 10px; background: #dc2626; color: #fff; font-size: .72rem; font-weight: 800; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; border: 2px solid #fff; z-index: 1; }

    .lp-num { font-family: 'Bricolage Grotesque', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .1em; }
    .lp-card.c-blue   .lp-num { color: #0075ab; }
    .lp-card.c-green  .lp-num { color: #059669; }
    .lp-card.c-orange .lp-num { color: #ea580c; }
    .lp-card.c-purple .lp-num { color: #7c3aed; }
    .lp-card.c-teal   .lp-num { color: #0d9488; }
    .lp-card.c-slate  .lp-num { color: #475569; }

    /* ── Module 5 - Goods In ── */
    .gi-po-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; background: var(--bg); transition: box-shadow .15s; margin-bottom: 8px; }
    .gi-po-card:hover { box-shadow: var(--shadow); }
    .gi-po-num  { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.1rem; font-weight: 700; color: #0d9488; flex-shrink: 0; }
    .gi-po-meta { flex: 1; min-width: 0; }
    .gi-po-supplier { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gi-po-date { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .gi-po-badge { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
    .gi-po-badge.open     { background: #ccfbf1; color: #0f766e; }
    .gi-po-badge.complete { background: #d1fae5; color: #059669; }
    .gi-line { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; background: var(--bg); }
    .gi-line-name { font-weight: 600; font-size: .88rem; margin-bottom: 2px; }
    .gi-line-sku  { font-family: monospace; font-size: .75rem; color: var(--muted); }
    .gi-line-ordered { font-size: .8rem; color: var(--muted); margin: 6px 0 10px; }
    .gi-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .gi-status-btn { flex: 1; min-width: 80px; padding: 8px 6px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; font-size: .8rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .12s, border-color .12s; }
    .gi-status-btn.active-ok  { background: #d1fae5; border-color: #6ee7b7; color: #059669; }
    .gi-status-btn.active-part { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
    .gi-status-btn.active-dmg  { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
    .gi-sub-fields { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .gi-sub-fields label { font-size: .78rem; color: var(--muted); font-weight: 600; }
    .gi-sub-fields input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: .9rem; }
    .gi-progress { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 16px; }
    .gi-progress-fill { height: 100%; background: #0d9488; border-radius: 2px; transition: width .3s; }
    .gi-name-label { font-size: .8rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .gi-complete-line { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .gi-complete-line:last-child { border-bottom: none; }
    .gi-complete-icon { font-size: 1rem; flex-shrink: 0; }
    .gi-complete-detail { flex: 1; font-size: .83rem; }
    .gi-flag { display: inline-block; font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 6px; }
    .gi-flag.partial  { background: #fef3c7; color: #92400e; }
    .gi-flag.damaged  { background: #fee2e2; color: #b91c1c; }
    .gi-section-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }

    .lp-name { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.2; }
    .lp-desc { font-size: .78rem; color: var(--muted); line-height: 1.4; }
    .lp-glyph { position: absolute; top: 14px; right: 16px; opacity: .22; line-height: 1; display: block; }
    .lp-glyph svg { display: block; }

    .lp-badge { display: inline-block; font-size: .65rem; font-weight: 700; background: #ede9fe; color: #7c3aed; border-radius: 20px; padding: 2px 8px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }

    /* ── Module 4 category grid ── */
    .c4-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
    .c4-eol-group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
    .c4-eol-group-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; background: var(--bg); user-select: none; gap: 10px; }
    .c4-eol-group-header:active { background: var(--faint); }
    .c4-eol-group-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .85rem; color: var(--text); flex: 1; }
    .c4-eol-group-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .c4-eol-group-body { border-top: 1px solid var(--border); padding: 0 4px 4px; }
    .c4-eol-chevron { display: inline-block; }
    .c4-cat {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 10px; text-align: center;
    }
    .c4-cat-icon { font-size: 1.4rem; margin-bottom: 6px; opacity: .25; }
    .c4-cat-name { font-family: 'Bricolage Grotesque', sans-serif; font-size: .8rem; font-weight: 700; color: var(--text); }
    .c4-cat-freq { font-size: .7rem; color: var(--muted); margin-top: 2px; }
    .c4-cat-count { font-size: .7rem; color: var(--muted); margin-top: 4px; background: var(--border); border-radius: 20px; display: inline-block; padding: 1px 8px; }
    .text-input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: .95rem; font-family: inherit; }
    /* ── filter bar ── */
    .c4-filter-bar { margin-bottom: 12px; }
    .c4-filter-toggle { display: flex; align-items: center; gap: 8px; background: var(--faint); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--text); width: 100%; text-align: left; }
    .c4-filter-toggle:active { background: var(--teal-light); }
    .c4-filter-badge { background: var(--teal); color: #fff; border-radius: 20px; font-size: .7rem; font-weight: 700; padding: 1px 7px; }
    .c4-filter-panel { background: var(--faint); border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .c4-filter-row { display: flex; flex-direction: column; gap: 3px; }
    .c4-filter-label { font-size: .72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .c4-filter-select { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: .82rem; background: var(--bg); color: var(--text); }
    .c4-filter-clear { font-size: .75rem; color: var(--teal); background: none; border: none; padding: 2px 0; cursor: pointer; text-align: left; align-self: flex-start; }
    /* ── wall panels section ── */
    .c4-bay-field-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 4px; }
    .c4-bay-field-text { flex: 1; min-width: 0; }
    .c4-bay-field-text span { display: block; font-size: .72rem; color: var(--muted); }
    .c4-bay-field-text strong { display: block; font-size: .82rem; color: var(--text); word-break: break-word; }
    .c4-bay-img-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 7px; border: 1px solid var(--border); flex-shrink: 0; cursor: pointer; }
    .c4-bay-img-add { width: 56px; height: 56px; border: 2px dashed var(--border); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--muted); cursor: pointer; flex-shrink: 0; background: var(--faint); }
    .c4-bay-img-add:active { background: var(--teal-light); }
    .c4-wall-section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .c4-wall-section-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .9rem; color: var(--text); margin-bottom: 10px; }
    .c4-wall-panel-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    .c4-wall-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); }
    .c4-wall-panel-name { font-weight: 600; font-size: .85rem; }
    .c4-wall-panel-body { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .c4-wall-panel-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; }
    .c4-wall-panel-img-placeholder { width: 100%; height: 80px; border: 2px dashed var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .78rem; cursor: pointer; }
    .c4-group { margin-bottom: 18px; }
    .c4-group-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
    .c4-item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .c4-item-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .c4-item-name { font-size: .9rem; }
    .c4-item-row .qty-input { width: 60px; flex-shrink: 0; text-align: center; }
    .c4-stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .c4-step-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 1.1rem; line-height: 1; cursor: pointer; }
    .c4-step-btn:active { background: var(--border); }
    .c4-item-row-bo { background: #fff7ed; border-radius: 8px; padding-left: 8px; }
    .c4-bo-tag { font-size: .72rem; color: #c2410c; margin-top: 3px; cursor: pointer; }
    .c4-bo-add { font-size: .72rem; color: var(--muted); background: none; border: none; padding: 0; margin-top: 3px; cursor: pointer; text-decoration: underline; }
    .c4-bo-form { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    .c4-bo-form .text-input { padding: 6px 8px; font-size: .8rem; }
    .stock-add-form { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--bg); border-radius: 8px; margin-top: 4px; }
    .stock-add-form .text-input { width: 100%; }
    .c4-item-row-oos { opacity: .65; }
    .c4-loc-pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
    .c4-loc-label { font-size: .7rem; color: var(--text-muted); margin-right: 2px; white-space: nowrap; }
    .c4-loc-pill { padding: 2px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); font-size: .72rem; font-family: var(--font-body); cursor: pointer; color: var(--text-muted); line-height: 1.6; }
    .c4-loc-pill.active { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: 600; }
    .c4-loc-pill:active { opacity: .75; }
    .c4-oos-tag { font-size: .72rem; color: var(--red); font-weight: 700; margin-top: 3px; display: block; }
    .stock-oos-mark-form { width: 100%; margin-top: 6px; padding: 10px; background: #fef2f2; border-radius: 8px; }
    .stock-oos-mark-form .text-input { width: 100%; padding: 6px 8px; font-size: .82rem; }

    /* ── Coming-soon banner ── */
    .cs-banner {
      background: #faf5ff; border: 1px solid #c4b5fd; border-radius: 8px;
      padding: 14px 16px; margin-bottom: 18px;
    }
    .cs-banner-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: .9rem; color: #5b21b6; margin-bottom: 4px; }
    .cs-banner-body { font-size: .84rem; color: #6d28d9; line-height: 1.5; }

    /* ── Module nav row ── */
    .mod-back { margin-bottom: 14px; }

    /* ── Pick row indicator ── */
    .pick-indicator { font-weight: 700; font-size: 1rem; flex-shrink: 0; width: 20px; text-align: center; }

    /* ── Dashboard ── */
    .dash-wrap { margin-top: 20px; }
    .dash-heading {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .dash-heading-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: .8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    }
    .dash-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 10px; overflow: hidden;
    }
    .dash-section-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .dash-stripe { width: 4px; height: 20px; border-radius: 2px; flex-shrink: 0; }
    .dash-section-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: .88rem; font-weight: 700; flex: 1; color: var(--text);
    }
    .dash-count {
      font-size: .72rem; font-weight: 800; min-width: 22px; height: 22px;
      border-radius: 50%; background: #dc2626; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0 5px; flex-shrink: 0;
    }
    .dash-count.ok { background: #d1fae5; color: var(--green); border-radius: 20px; min-width: unset; height: unset; padding: 2px 9px; font-weight: 700; }
    .dash-section-head { cursor: pointer; user-select: none; }
    .dash-module-body { display: none; }
    .dash-module-body.open { display: block; }
    .dash-module-chevron { font-size: .75rem; color: var(--muted); transition: transform .2s; margin-left: 4px; }
    .dash-module-chevron.open { transform: rotate(90deg); }
    .c4-subcat-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 4px; border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .c4-subcat-row:last-child { border-bottom: none; }
    .c4-subcat-row:active { background: var(--bg); }
    .c4-subcat-name { flex: 1; font-weight: 600; font-size: .88rem; color: var(--text); }
    .c4-subcat-meta { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Dashboard session expand ── */
    .dash-session {
      border-bottom: 1px solid var(--border);
    }
    .dash-session:last-child { border-bottom: none; }
    .dash-session-head {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px; cursor: pointer; user-select: none;
      background: var(--bg);
    }
    .dash-session-head:hover { background: var(--border); }
    .dash-session-code {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: .78rem; font-weight: 700; letter-spacing: .06em;
      color: var(--muted); text-transform: uppercase; flex: 1;
    }
    .dash-session-meta { font-size: .75rem; color: var(--muted); }
    .dash-session-chevron {
      font-size: .75rem; color: var(--muted); transition: transform .15s; flex-shrink: 0;
    }
    .dash-session-chevron.open { transform: rotate(90deg); }
    .dash-session-body { display: none; }
    .dash-session-body.open { display: block; }

    .dash-job-group { border-bottom: 1px solid var(--border); }
    .dash-job-group:last-child { border-bottom: none; }
    .dash-job-label {
      padding: 7px 16px 3px; font-size: .72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); background: var(--bg);
    }
    .dash-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; border-top: 1px solid var(--border);
      font-size: .84rem;
    }
    .dash-item-name { flex: 1; font-weight: 500; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-item-short { color: var(--red); font-weight: 700; font-size: .8rem; white-space: nowrap; }
    .dash-item-detail { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .dash-more { padding: 6px 16px; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--border); }
    .dash-footer {
      padding: 10px 16px; display: flex; justify-content: flex-end;
      border-top: 1px solid var(--border); background: var(--bg);
    }
    .dash-clear {
      text-align: center; padding: 28px 16px; color: var(--muted);
    }
    .dash-clear-icon { font-size: 2rem; margin-bottom: 6px; }
    .dash-loading { padding: 20px 16px; text-align: center; color: var(--muted); font-size: .84rem; }
    .dash-archive-btn {
      font-size: .72rem; padding: 3px 10px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--muted); cursor: pointer; flex-shrink: 0;
      font-family: inherit; line-height: 1.4;
    }
    .dash-archive-btn:hover { background: #fee2e2; color: var(--red); border-color: #fca5a5; }

    @media (max-width: 520px) {
      .item-row { flex-wrap: wrap; }
      .session-code { font-size: 1.3rem; }
      .header-logo-wrap { width: 120px; }
      .header-logo-svg { width: 120px; }
      .lp-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .lp-name { font-size: .9rem; }
      .lp-desc { display: none; }
      .c4-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

    module: 'home',
    /* module 1 - pick verifier */
    session: null,
    checks:  {},
    role:    'office',
    tab:     'all',
    driveAuthed:     false,
    driveToken:      null,
    pickerApiLoaded: false,
    stagedFiles:     [],   /* files queued before session creation */
    dupWarnings:     [],   /* duplicate job warnings pending user decision */
    altModal:        null,  /* { key, name, qty } when alt input is open */
    alternatives:    {},    /* key -> { altName, altSku } saved locally */
    driveFileDocs:   [],    /* Drive doc metadata from picker for PDF links */
    appendTarget:    null,  /* session to append to { id, code, masterList, jobs } */
    appendDupWarnings:    [],   /* duplicate job warnings for append flow */
    appendPendingJobObjs: null, /* parsed jobs pending append dupe decision */
    catExpanded:     {},   /* category open/closed state in check view */
    catSubmitted:    {},   /* categories marked done by user */
    /* module 2 - pick completion */
    c2: { session: null, selectedJob: null, picks: {}, loading: false, pickerName: '' },
    /* module 3 - driver delivery */
    c3: { jobRef: '', items: [], delivered: {}, driverName: '', loading: false, session: null, signoff: null, goodsOutOrder: null },
    /* module 4 - stock checker */
    c4: { screen: 'overview', subCat: null },
    /* module 5 - goods in */
    c5: { screen: 'list', po: null, lines: [], receipts: {}, receiverName: '', arrivalType: 'delivery', loading: false, stagedFile: null, uploadError: null, isRemedialPO: false, remedialMatchError: null, tab: 'in', completedExpanded: false },
    c5out: { orders: [], loading: false, badgeCount: 0, activeOrder: null, activeLines: [], uploadError: null, po: null, pickChecks: [] },
    ppEntrySource: null,   /* tracks if counter/remedial was entered from pp-home */
    adhocRemedial: { open: false, jobRef: '', itemName: '', qty: '', reason: 'damaged_delivery', submitting: false },
    c6: { items: [], loading: false, badgeCount: 0, capture: null },
    /* home dashboard */
    dash: { loading: true, m1: [], m2: [], m3: [], m5: [] },
    dashUnlocked: false,
    /* expanded session keys in dashboard M1 */
    dashExpanded: {},
    dashModuleExpanded: {},
  };

  let snakeAnimId = null;

  /* ═══════════════════════════════════════════════
     PDF.js
  ═══════════════════════════════════════════════ */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ── SKU pill style (injected once) ── */
  (function () {
    const s = document.createElement('style');
    s.textContent =
      '.item-name{flex:1;font-weight:500;display:flex;flex-direction:column;align-items:flex-start;gap:3px}' +
      '.item-sku{font-family:monospace;background:var(--bg);border:1px solid var(--border);' +
      'border-radius:4px;padding:1px 6px;font-size:11px;color:var(--muted);white-space:nowrap}' +
      '.report-sku{font-family:monospace;font-size:12px;color:var(--muted)}';
    document.head.appendChild(s);
  })();

  /* ═══════════════════════════════════════════════
     TOAST
  ═══════════════════════════════════════════════ */
  let toastTimer;
  function toast(msg, dur = 2800) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), dur);
  }

  /* ═══════════════════════════════════════════════
     RENDER DISPATCH
  ═══════════════════════════════════════════════ */
  function render() {
    applyTheme(state.module);
    const root = document.getElementById('root');
    const v = state.view;
    if (v === 'home')          root.innerHTML = renderHome();
    else if (v === 'pp-home')  root.innerHTML = renderPPHome();
    else if (v === 'upload')   root.innerHTML = renderUpload();
    else if (v === 'session')  root.innerHTML = renderSession();
    else if (v === 'check')    root.innerHTML = renderCheck();
    else if (v === 'report')   root.innerHTML = renderReport();
    else if (v === 'c2-home')  root.innerHTML = renderC2Home();
    else if (v === 'c2-jobs')  root.innerHTML = renderC2Jobs();
    else if (v === 'c2-pick')  root.innerHTML = renderC2Pick();
    else if (v === 'c2-done')  root.innerHTML = renderC2Done();
    else if (v === 'c6-list')    root.innerHTML = renderC6List();
    else if (v === 'c6-capture') root.innerHTML = renderC6Capture();
    else if (v === 'c6-detail')  root.innerHTML = renderC6Detail();
    else if (v === 'c3-home')  root.innerHTML = renderC3Home();
    else if (v === 'c3-check')   root.innerHTML = renderC3Check();
    else if (v === 'c3-signoff') root.innerHTML = renderC3Signoff();
    else if (v === 'c3-done')    root.innerHTML = renderC3Done();
    else if (v === 'c4-overview') root.innerHTML = renderC4Overview();
    else if (v === 'c4-misc')     root.innerHTML = renderC4Misc();
    else if (v === 'c4-eol')       root.innerHTML = renderC4EOL();
    else if (v === 'c4-showroom')  root.innerHTML = renderC4Showroom();
    else if (v === 'c5-list')      root.innerHTML = renderC5List();
    else if (v === 'c5out-list')    root.innerHTML = renderC5OutList();
    else if (v === 'c5out-type')    root.innerHTML = renderC5OutType();
    else if (v === 'c5out-upload')  root.innerHTML = renderC5OutUpload();
    else if (v === 'admin-home')   root.innerHTML = renderAdminHome();
    else if (v === 'c5out-preview') root.innerHTML = renderC5OutPreview();
    else if (v === 'c5out-staged')  root.innerHTML = renderC5OutStaged();
    else if (v === 'c5out-signoff') root.innerHTML = renderC5OutSignoff();
    else if (v === 'c5-preview')   root.innerHTML = renderC5Preview();
    else if (v === 'c5-upload')    root.innerHTML = renderC5Upload();
    else if (v === 'c5-receive')   root.innerHTML = renderC5Receive();
    else if (v === 'c5-complete')  root.innerHTML = renderC5Complete();
    else if (v === 'c4-subcats') root.innerHTML = renderC4SubCats();
    else if (v === 'c4-category') {
      root.innerHTML = renderC4Category();
      const s = document.querySelector('[data-action="c4-search"]');
      if (s && state.c4.searchFocused) {
        s.focus();
        s.setSelectionRange(s.value.length, s.value.length);
      }
    }
    bindEvents();
  }

  /* ═══════════════════════════════════════════════
     HOME VIEW
  ═══════════════════════════════════════════════ */
  function renderHome() {
    const h = new Date().getHours();
    const greet = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
    if (state.dashUnlocked) setTimeout(loadDashboard, 0);
    loadC6BadgeCount();
    loadC5OutBadgeCount();
    setTimeout(startSnake, 80);
    const ic = {
      list: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="12" x2="16" y1="11" y2="11"/><line x1="8" x2="8.01" y1="11" y2="11"/><line x1="12" x2="16" y1="16" y2="16"/><line x1="8" x2="8.01" y1="16" y2="16"/></svg>`,
      check:`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>`,
      truck:`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>`,
      pkg:  `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></svg>`,
      wrench:`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
      inbox:`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
    };
    return `
      <canvas id="snake-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:-1;"></canvas>
      <div class="lp-intro">
        <h1>Good ${greet}.</h1>
        <div class="text-muted text-sm">Pick a module to get started.</div>
      </div>
      <div class="lp-grid">
        <button class="lp-card c-blue" data-action="open-module" data-mod="goodsin">
          <span class="lp-num">01</span>
          <span class="lp-name">Goods In</span>
          <span class="lp-desc">Receive stock against purchase orders.</span>
          <span class="lp-glyph" style="color:#0075ab;">${ic.inbox}</span>
        </button>
        <button class="lp-card c-green" data-action="open-module" data-mod="verifier">
          <span class="lp-num">02</span>
          <span class="lp-name">Pick &amp; Pack</span>
          <span class="lp-desc">Pick, pack and sign off any outbound order.</span>
          <span class="lp-glyph" style="color:#059669;">${ic.check}</span>
        </button>
        <button class="lp-card c-orange" data-action="open-module" data-mod="delivery">
          <span class="lp-num">03</span>
          <span class="lp-name">Driver Hub</span>
          <span class="lp-desc">All van jobs — deliveries, collections and remedial runs.</span>
          <span class="lp-glyph" style="color:#ea580c;">${ic.truck}</span>
        </button>
        <button class="lp-card c-purple" data-action="open-module" data-mod="remedial">
          <span class="lp-num">04</span>
          <span class="lp-name">Remedials</span>
          <span class="lp-desc">Fitter-raised jobs from pick through to delivery.</span>
          <span class="lp-glyph" style="color:#7c3aed;">${ic.wrench}</span>
          ${state.c6.badgeCount > 0 ? `<span class="lp-badge-count">${state.c6.badgeCount}</span>` : ''}
        </button>
        <button class="lp-card c-teal" data-action="open-module" data-mod="stock" style="position:relative;">
          <span class="lp-num">05</span>
          <span class="lp-name">Stock Checker</span>
          <span class="lp-desc">Counts, levels and audit trail.</span>
          <span class="lp-glyph" style="color:#0d9488;">${ic.pkg}</span>
        </button>
        <button class="lp-card c-slate" data-action="open-module" data-mod="admin">
          <span class="lp-num">06</span>
          <span class="lp-name">Admin</span>
          <span class="lp-desc">Dashboard and management tools.</span>
          <span class="lp-glyph" style="color:#475569;">${ic.list}</span>
          ${(() => {
            const total = (state.c5out.badgeCount || 0) +
              (state.dash.m1 || []).reduce((s, g) => s + g.items.length, 0) +
              (state.dash.m2 || []).reduce((s, [, rows]) => s + rows.length, 0) +
              (state.dash.m3 || []).reduce((s, [, rows]) => s + rows.length, 0) +
              (state.dash.m5 || []).length +
              (state.dash.goOrders || []).length +
              (state.dash.fitterRemedials || []).length;
            return total > 0 ? `<span class="lp-badge-count">${total}</span>` : '';
          })()}
        </button>
      </div>`;
  }

  /* ═══════════════════════════════════════════════
     PICK & PACK HOME
  ═══════════════════════════════════════════════ */
  function renderPPHome() {
    const remedialCount = (state.c6.items || []).filter(r => r.status === 'approved').length;
    const remedialBadge = remedialCount > 0
      ? `<span style="display:inline-block;margin-left:8px;background:#dc2626;color:#fff;font-size:.7rem;font-weight:800;min-width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;padding:0 4px;">${remedialCount}</span>`
      : '';

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="go-home">&#8592; Back</button></div>

      <div style="display:flex;flex-direction:column;gap:10px;">

        <div class="card" style="cursor:pointer;border-color:#bbf7d0;background:#f0fdf4;"
          data-action="pp-entry" data-entry="slip">
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:40px;height:40px;border-radius:10px;background:#dcfce7;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <div style="flex:1;">
              <div class="card-title" style="margin-bottom:2px;color:#166534;">Packing slip</div>
              <div class="text-muted text-sm" style="color:#15803d;">Upload packing slips and pick for installation jobs.</div>
            </div>
            <div style="color:#16a34a;font-size:1.3rem;flex-shrink:0;">&#8250;</div>
          </div>
        </div>

        <div class="card" style="cursor:pointer;border-color:#bfdbfe;background:#eff6ff;"
          data-action="pp-entry" data-entry="counter">
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div style="flex:1;">
              <div class="card-title" style="margin-bottom:2px;color:#1e40af;">Goods out</div>
              <div class="text-muted text-sm" style="color:#1d4ed8;">Retail, trade, external and counter collections.</div>
            </div>
            <div style="color:#1d4ed8;font-size:1.3rem;flex-shrink:0;">&#8250;</div>
          </div>
        </div>

        <div class="card" style="cursor:pointer;border-color:#fecaca;background:#fef2f2;"
          data-action="pp-entry" data-entry="remedial">
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>

            </div>
            <div style="color:#dc2626;font-size:1.3rem;flex-shrink:0;">&#8250;</div>

        <div class="card" style="background:#fffbeb;border-color:#fde68a;">
          <div class="card-title" style="color:#92400e;margin-bottom:10px;">&#128269; Search by job number</div>
          <div style="display:flex;gap:8px;">

      </div>`;
  }

  /* ═══════════════════════════════════════════════
     MODULE 1 - PICK VERIFIER
  ═══════════════════════════════════════════════ */
  function renderUpload() {
    const driveStatusHtml = state.driveAuthed
      ? `<div class="drive-status authed"><span class="dot"></span>Connected to Google Drive</div>`
      : `<div class="drive-status"><span class="dot"></span>Not connected to Google Drive</div>`;

    const staged = state.stagedFiles;
    const stagedHtml = staged.length ? `
      <div style="margin-top:16px;">
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;">
          ${staged.length} file${staged.length !== 1 ? 's' : ''} queued
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px;">
          ${staged.map((f, idx) => `
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;font-size:.84rem;">
              <span>&#128196;</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(f.name)}</span>
              <button class="btn btn-ghost" data-action="stage-remove" data-idx="${idx}"
                style="padding:2px 8px;font-size:.78rem;flex-shrink:0;">&#10005;</button>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-drive" data-action="drive-pick">${driveIcon()} Add more from Drive</button>
          <button class="btn btn-ghost" data-action="browse-files">&#128196; Add more files</button>
          <button class="btn btn-primary" data-action="stage-create" style="margin-left:auto;">
            Create Session &#8594;
          </button>
        </div>
        <div id="parse-progress" style="display:none;margin-top:14px;">
          <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
          <p class="text-muted text-sm" id="progress-label">Parsing PDFs&#8230;</p>
        </div>
      </div>` : `
      <div class="upload-zone" id="drop-zone">
        <p><strong>Upload Packing Slips</strong>Drag &amp; drop PDF files here, or use the buttons below</p>
        <div class="upload-btns">
          <button class="btn btn-primary" data-action="browse-files">&#128196; Choose Files</button>
          <button class="btn btn-drive" data-action="drive-pick">${driveIcon()} Upload from Google Drive</button>
        </div>
        ${driveStatusHtml}
      </div>
      <div id="parse-progress" style="display:none;margin-top:14px;">
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
        <p class="text-muted text-sm" id="progress-label">Parsing PDFs&#8230;</p>
      </div>`;

    /* ── Duplicate warning banner ── */
    const dupHtml = (state.dupWarnings && state.dupWarnings.length) ? `
      <div style="background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:16px 18px;margin-bottom:16px;">
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.95rem;color:#92400e;margin-bottom:6px;">
          &#9888; Duplicate job${state.dupWarnings.length > 1 ? 's' : ''} detected
        </div>
        ${state.dupWarnings.map(w => `
          <div style="font-size:.87rem;color:#78350f;margin-bottom:4px;">
            Job <strong>${esc(w.quoteRef.replace(/^Q/i,''))}</strong> was already uploaded on ${esc(w.existingDate)} (session <strong>${esc(w.existingCode)}</strong>).
          </div>`).join('')}
        <div style="font-size:.84rem;color:#92400e;margin-top:8px;margin-bottom:14px;">
          This may be a rescheduled job. Only continue if you are sure this is not a mistake.
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary" data-action="dup-continue" style="background:#d97706;border-color:#d97706;">
            Upload all anyway
          </button>
          ${(state.dupPendingJobObjs || []).length > (state.dupWarnings || []).length ? `
          <button class="btn btn-outline" data-action="dup-skip">
            Skip duplicate${(state.dupWarnings||[]).length > 1 ? 's' : ''}, upload the rest
          </button>` : ''}
          <button class="btn btn-ghost" data-action="dup-cancel">Cancel</button>
        </div>
      </div>` : '';

    return `
      <div class="mod-back"><button class="btn btn-ghost" data-action="upload-cancel">&#8592; Back</button></div>
      ${dupHtml}
      <div class="card">
        <div class="card-title">New Stock Check Session</div>
        ${stagedHtml}
      </div>
      <input type="file" id="file-input" accept="application/pdf" multiple />
      <div class="card">
        <div class="card-title">Join a Session (Warehouse)</div>
        <div class="flex gap-2 flex-wrap items-center">
          <input id="join-code" type="text" placeholder="Enter session code e.g. AB3K7P"

          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--teal-faint);border:1px solid var(--teal-light);border-radius:8px;margin-bottom:12px;">

            <button class="btn btn-ghost" data-action="append-clear" style="padding:4px 10px;font-size:.78rem;">Clear</button>
          </div>
          ${(state.appendDupWarnings && state.appendDupWarnings.length) ? `
            <div style="background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:14px 16px;margin-bottom:12px;">
              <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.9rem;color:#92400e;margin-bottom:6px;">

              </div>

  }

  function renderSession() {
    const s = state.session;
    return `
      <div class="card">
        <div class="card-title">Session Created</div>
        <div class="session-row">
          <div class="session-code">${s.code}</div>

      </div>
      ${(state.session.sourceFiles && state.session.sourceFiles.length) ? `
