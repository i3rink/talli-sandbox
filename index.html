          event: 'duplicate_override',
          detail: JSON.stringify({ quote_ref: w.quoteRef, existing_code: w.existingCode, existing_date: w.existingDate }),
          created_at: new Date().toISOString(),
        });
      }
      /* Proceed with session creation using the pending parsed jobs */
      const jobObjs = state.dupPendingJobObjs || [];
      state.dupWarnings = [];
      state.dupPendingJobObjs = null;
      const masterList = buildMasterList(jobObjs);
      const session = await createSession(masterList, jobObjs.map(j => j.id));

      state.appendTarget = { id: data.id, code: data.code, masterList: data.master_list || [], jobs: data.jobs || [] };

      /* Save to Supabase alternatives table */
      if (state.session?.id && state.session.id !== 'local') {

        await sb.from('alternatives').insert({
          session_id: state.session.id,
          item_key:   key,
          item_name:  item.name || key,

      state.catSubmitted[cat] = !state.catSubmitted[cat];
      render(); return;

    if (action === 'submit-all') { submitAllChecks(); return; }
    if (action === 'set-status')  { setStatus(btn.dataset.key, btn.dataset.status); return; }
    if (action === 'copy-report') { copyReport(); return; }

    /* ── module 2 ── */
    if (action === 'c2-load')       { loadC2Session(); return; }
    if (action === 'c2-select-job') { state.c2.selectedJob = btn.dataset.job; state.view = 'c2-pick'; render(); return; }
    if (action === 'c2-back-jobs')  { state.view = 'c2-jobs'; render(); return; }
    if (action === 'c2-submit')     { submitC2Picks(); return; }
    if (action === 'dash-raise-order') {
      const job = btn.dataset.job;

      if (!state.dashMoonOpened) state.dashMoonOpened = {};
      state.dashMoonOpened[job] = true;

      render();
      return;
    }
    if (action === 'dash-rem-type') {
      const job = btn.dataset.job;
      const remtype = btn.dataset.remtype;
      if (!job || !remtype) return;
      if (!state.dashRemedialType) state.dashRemedialType = {};
      state.dashRemedialType[job] = remtype;

    if (action === 'dash-adhoc-remedial') {

      showAdhocRemedialModal();
      return;
    }

    if (action === 'dash-confirm-po') {
      const job = btn.dataset.job;
      if (!job) return;
      const remedialType = btn.dataset.remtype || 'delivery';
      const poRef = prompt('Enter the PO number from Moon Invoice for job ' + job.replace(/^Q/i,'') + ':');
      if (!poRef || !poRef.trim()) return;
      const cleanPO = poRef.trim();
      /* Normalise for storage — uppercase, no leading/trailing spaces */
      const normPO = cleanPO.toUpperCase().replace(/\s+/g, '');
      /* Collection remedials skip Goods In wait — go straight to ready */
      const newStatus = remedialType === 'collection' ? 'ready' : 'ordered';
      (async () => {
        /* flip existing pending remedials for this job to ordered/ready, store po_ref */
        const { data: existing } = await sb.from('remedials')
          .select('id').eq('job_ref', job).eq('status', 'pending');
        if (!existing || !existing.length) {
          /* no pending rows — create from deliveries shortfall */
          const { data: rows } = await sb.from('deliveries')
            .select('*').eq('job_ref', job).gt('shortfall', 0);
          if (!rows || !rows.length) { toast('No shortfall items found for job ' + job.replace(/^Q/i,'')); return; }
          await sb.from('remedials').delete().eq('job_ref', job).eq('status', 'pending');
          const remedialRows = rows.map(r => ({
            session_id:    r.session_id,
            job_ref:       r.job_ref,
            item_key:      r.item_key,
            item_name:     r.item_name,
            shortfall_qty: r.shortfall,
            status:        newStatus,
            po_ref:        normPO,
            remedial_type: remedialType,
            source:        'm2_shortfall',
            ordered_at:    new Date().toISOString(),
            created_at:    new Date().toISOString(),
          }));
          const { error } = await sb.from('remedials').insert(remedialRows);
          if (error) { toast('Failed: ' + (error.message || 'unknown')); return; }
        } else {
          const { error } = await sb.from('remedials')
            .update({ status: newStatus, po_ref: normPO, remedial_type: remedialType, ordered_at: new Date().toISOString() })
            .eq('job_ref', job).eq('status', 'pending');
          if (error) { toast('Failed: ' + (error.message || 'unknown')); return; }
        }
        if (!state.dashRemedialPORefs) state.dashRemedialPORefs = {};
        state.dashRemedialPORefs[job] = cleanPO;
        if (state.dashMoonOpened) delete state.dashMoonOpened[job];
        if (remedialType === 'collection') {
          await loadC6BadgeCount();
          toast('PO ' + cleanPO + ' confirmed — collection remedial sent to warehouse');
        } else {
          toast('PO ' + cleanPO + ' confirmed — waiting for Goods In');
        }
        render();
      })();
      return;
    }
    if (action === 'c6-mark-ready') {
      const id = btn.dataset.id;
      if (id) markRemedialReady(id);
      return;
    }
    if (action === 'c6-mark-complete') {
      const id = btn.dataset.id;
      if (!id) return;
      const item = state.c6.items.find(r => r.id === id);
      if (!item) return;
      state.c6.capture = { id, item, postcode: '', doorNumber: '', remedialType: 'delivery' };
      state.view = 'c6-capture';
      render();
      return;
    }
    if (action === 'c6-capture-type') {
      if (state.c6.capture) state.c6.capture.remedialType = btn.dataset.type;
      render();
      return;
    }
    if (action === 'c6-capture-cancel') {
      state.c6.capture = null;
      state.view = 'c6-list';
      render();
      return;
    }
    if (action === 'c6-capture-confirm') {
      const cap = state.c6.capture;
      if (!cap) return;
      const postcodeEl   = document.getElementById('c6-cap-postcode');
      const doorEl       = document.getElementById('c6-cap-door');
      const postcode     = postcodeEl ? postcodeEl.value.trim().toUpperCase() : '';
      const doorNumber   = doorEl ? doorEl.value.trim() : '';
      if (!postcode)   { toast('Postcode is required'); return; }
      if (!doorNumber) { toast('Door number is required'); return; }
      cap.postcode   = postcode;
      cap.doorNumber = doorNumber;
      markRemedialComplete(cap);
      return;
    }
    if (action === 'c2-copy-short') { copyC2Shortfall(); return; }

    /* ── module 3 ── */
    if (action === 'c3-load') { loadC3Job(); return; }
    if (action === 'c3-back') {
      state.c3 = { jobRef: '', items: [], delivered: {}, driverName: state.c3.driverName, loading: false, session: null, signoff: null, goodsOutOrder: null };
      state.view = 'c3-home'; render(); return;
    }
    if (action === 'c3-back-to-check') { state.view = 'c3-check'; render(); return; }
    if (action === 'c3-to-signoff') {
      /* persist any text state before leaving check screen */
      if (!state.c3.signoff) state.c3.signoff = {};
      state.view = 'c3-signoff'; render();
      initC3SignaturePad();
      return;
    }
    if (action === 'c3-status') {
      const key = btn.dataset.key; const status = btn.dataset.status;
      if (state.c3.delivered[key]?.status === status) { delete state.c3.delivered[key]; }
      else { state.c3.delivered[key] = { status, deliveredQty: state.c3.delivered[key]?.deliveredQty }; }
      render(); return;
    }
    if (action === 'c3-signoff-radio') {
      const field = btn.dataset.field;
      if (!state.c3.signoff) state.c3.signoff = {};
      if (field === 'c3-team')            state.c3.signoff.team           = btn.value;
      if (field === 'c3-deliverystatus')  state.c3.signoff.deliveryStatus = btn.value;
      if (field === 'c3-customerpresent') state.c3.signoff.customerPresent = btn.value;
      render(); initC3SignaturePad(); return;
    }
    if (action === 'c3-photo-pick') {
      const inp = document.getElementById('c3-photo-input');
      if (inp) { inp.value = ''; inp.click(); }
      return;
    }
    if (action === 'c3-photo-remove') {
      const idx = parseInt(btn.dataset.idx, 10);
      if (!state.c3.signoff) state.c3.signoff = {};
      if (!state.c3.signoff.photos) state.c3.signoff.photos = [];
      state.c3.signoff.photos.splice(idx, 1);
      render(); initC3SignaturePad(); return;
    }
    if (action === 'c3-sig-clear') {
      const canvas = document.getElementById('c3-sig-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (action === 'c3-submit')  { submitC3Delivery(); return; }
    if (action === 'c3-another') {
      state.c3 = { jobRef: '', items: [], delivered: {}, driverName: state.c3.driverName, loading: false, session: null, signoff: null, goodsOutOrder: null };
      state.view = 'c3-home'; render(); return;

    /* ── Module 5 - Goods In ── */
    if (bindC5Events(action, btn, e)) return;
    /* ── Module 5 - Goods Out ── */
    if (bindC5OutEvents(action, btn, e)) return;
  });

  /* ═══════════════════════════════════════════════
     GOOGLE DRIVE PICKER
  ═══════════════════════════════════════════════ */
  function loadPickerApi() {
    return new Promise(resolve => {
      if (state.pickerApiLoaded) { resolve(); return; }
      gapi.load('picker', () => { state.pickerApiLoaded = true; resolve(); });
    });
  }

  function getOAuthToken() {
    return new Promise((resolve, reject) => {
      if (state.driveToken) { resolve(state.driveToken); return; }
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: resp => {
          if (resp.error) { reject(resp.error); return; }
          state.driveToken = resp.access_token; state.driveAuthed = true;
          /* do NOT render() here - it wipes the DOM mid-flow on mobile
             before the picker can open. Status dot updates on next natural render. */
          resolve(resp.access_token);
        },
      });
      tokenClient.requestAccessToken({ prompt: state.driveAuthed ? '' : 'consent' });
    });
  }

  function showPicker(token) {
    return new Promise(resolve => {
      const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setMimeTypes('application/pdf').setMode(google.picker.DocsViewMode.LIST);
      const picker = new google.picker.PickerBuilder()
        .setAppId(GOOGLE_APP_ID).setOAuthToken(token).setDeveloperKey(GOOGLE_API_KEY)
        .addView(view).setTitle('Select packing slip PDFs')
        .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
        .setCallback(data => {
          if (data.action === google.picker.Action.PICKED)  resolve(data.docs);
          else if (data.action === google.picker.Action.CANCEL) resolve([]);
        }).build();
      picker.setVisible(true);
    });
  }

  async function downloadDriveFile(fileId, token) {
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
    if (!resp.ok) throw new Error(`Drive download failed: ${resp.status}`);
    return resp.blob();
  }

  async function handleDrivePick() {
    try {
      await loadPickerApi();
      const token = await getOAuthToken();
      const docs  = await showPicker(token);
      if (!docs.length) return;
      toast(`Downloading ${docs.length} file${docs.length > 1 ? 's' : ''} from Drive\u2026`, 5000);
      const files = await Promise.all(docs.map(async doc => {
        const blob = await downloadDriveFile(doc.id, token);
        return new File([blob], doc.name, { type: 'application/pdf' });
      }));
      /* Store Drive metadata for PDF links */
      docs.forEach(doc => {
        if (!state.driveFileDocs.find(d => d.id === doc.id)) {
          state.driveFileDocs.push({ id: doc.id, name: doc.name });
        }
      });
      handleFiles(files);
    } catch (err) {
      console.error('Drive pick error:', err);
      if (String(err).includes('401') || String(err).includes('invalid_token')) {
        state.driveToken = null; state.driveAuthed = false;
        toast('Drive session expired \u2014 please sign in again'); render();
      } else { toast('Could not load from Google Drive. Try again.'); }
    }
  }

  /* ═══════════════════════════════════════════════
     FILE HANDLING + PDF PARSING
  ═══════════════════════════════════════════════ */
  /* handleFiles - adds incoming files to the staging queue, deduplicating by name.
     Nothing is parsed or submitted until the user hits "Create Session". */
  async function handleFiles(files) {
    if (!files.length) return;
    const existing = new Set(state.stagedFiles.map(f => f.name));
    for (const f of files) {
      if (!existing.has(f.name)) { state.stagedFiles.push(f); existing.add(f.name); }
    }
    render();
  }

  /* processStaged - parse all staged files, check for duplicates, then create session. */
  async function processStaged() {
    const files = state.stagedFiles;
    if (!files.length) { toast('No files queued'); return; }
    const prog = document.getElementById('parse-progress');
    if (prog) prog.style.display = '';
    const jobObjs = [];
    for (let i = 0; i < files.length; i++) {
      setProgress(Math.round(i / files.length * 70), `Parsing ${files[i].name}\u2026`);
      try { jobObjs.push(await parseFile(files[i])); }
      catch (err) { console.error('Parse error:', files[i].name, err); toast(`Could not parse ${files[i].name}`); }
    }

    /* ── Duplicate check: query sessions for any matching job ref ── */
    setProgress(80, 'Checking for duplicates\u2026');
    const warnings = [];
    const { data: allSessions } = await sb.from('sessions').select('id, code, jobs, created_at').order('created_at', { ascending: false }).limit(100);
    for (const job of jobObjs) {
      const quoteRef = job.id; /* e.g. Q1785 */
      const match = (allSessions || []).find(s =>
        (s.jobs || []).some(j => String(j).toUpperCase() === String(quoteRef).toUpperCase())
      );
      if (match) {
        const dateStr = new Date(match.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        warnings.push({ quoteRef, existingCode: match.code, existingDate: dateStr, existingId: match.id });
      }
    }

    if (warnings.length) {
      setProgress(100, 'Done');
      state.dupWarnings = warnings;
      state.dupPendingJobObjs = jobObjs;
      render(); return;
    }

    setProgress(90, 'Consolidating\u2026');
    const masterList = buildMasterList(jobObjs);
    setProgress(100, 'Done!');
    const session = await createSession(masterList, jobObjs.map(j => j.id));
    state.session = session; state.checks = {};
    state.stagedFiles = [];
    state.dupWarnings = [];
    state.view = 'session';
    setTimeout(() => render(), 400);
  }

  function setProgress(pct, label) {
    const fill = document.getElementById('progress-fill');
    const lbl  = document.getElementById('progress-label');
    if (fill) fill.style.width = pct + '%';
    if (lbl)  lbl.textContent  = label;
  }

  async function extractPdfText(file) {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let full = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const page    = await pdf.getPage(p);
      const content = await page.getTextContent();
      const sorted  = content.items.slice().sort((a, b) => {
        const dy = b.transform[5] - a.transform[5];
        return Math.abs(dy) > 3 ? dy : a.transform[4] - b.transform[4];
      });
      const lines = []; let cur = [], lastY = null;
      for (const item of sorted) {
        const y = Math.round(item.transform[5]);
        if (lastY === null || Math.abs(y - lastY) > 3) {
          if (cur.length) lines.push(cur.map(i => i.str).join(' ').trim());
          cur = [item]; lastY = y;
        } else cur.push(item);
      }
      if (cur.length) lines.push(cur.map(i => i.str).join(' ').trim());
      full += lines.join('\n') + '\n';
    }
    return full;
  }

  async function parseFile(file) { return parsePackingSlip(await extractPdfText(file), file.name); }

  const ITEM_RE  = /^(\d+)\.\s+(.+?)\s{2,}(\d+(?:\.\d+)?)\s*(pcs|bundle|box|pk|2pk|3pk|4pk|pair|roll|m|lm|set|kit|each|no\.?|nr\.?)?$/i;
  const ITEM_RE2 = /^(\d+)\.\s+(.+)\s+(\d+(?:\.\d+)?)\s*(pcs|bundle|box|pk|2pk|3pk|4pk|pair|roll|m|lm|set|kit|each)?$/i;
  const SKU_RE   = /^[A-Z0-9][A-Z0-9\-_]{2,}$/i;
  const BUNDLE_KW = /\bkit\b|\bbundle\b/i;
  const SUB_RE   = /^(\d+)x\s+(.+)$/i;
  const SKIP_RE  = /mull collection supply|bute collection supply/i;

  function normaliseUnit(u) {
    u = u.toLowerCase().trim();
    if (!u || u === 'no' || u === 'nr') return 'pcs';
    if (u === '2pk') return '2-pack'; if (u === '3pk') return '3-pack'; if (u === '4pk') return '4-pack';
    return u;
  }

  function parsePackingSlip(text, filename) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    let jobId   = filename.replace(/\.pdf$/i, '');
    const qm    = text.match(/Quote\s*#\s*(\S+)/i);
    if (qm) jobId = `Q${qm[1]}`;
    const items = []; let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const m    = line.match(ITEM_RE) || line.match(ITEM_RE2);
      if (m) {
        const name = m[2].trim(); const qty = parseFloat(m[3]); const unit = normaliseUnit(m[4] || '');
        let j = i + 1, sku = '';
        if (j < lines.length && SKU_RE.test(lines[j]) && !/^\d+\.\s/.test(lines[j])) { sku = lines[j].toUpperCase(); j++; }
        if (SKIP_RE.test(name)) { while (j < lines.length && !/^\d+\.\s/.test(lines[j])) j++; i = j; continue; }
        if (BUNDLE_KW.test(name) || BUNDLE_KW.test(unit)) {
          const subs = [];
          while (j < lines.length && !/^\d+\.\s/.test(lines[j])) {
            const sm = lines[j].trim().match(SUB_RE);
            if (sm && sm[2].trim().length > 1) subs.push({ name: sm[2].trim(), sku: '', qty: parseInt(sm[1]) * qty, unit: 'pcs', fromBundle: `${name}${sku ? ' (' + sku + ')' : ''}` });
            j++;
          }
          if (subs.length) subs.forEach(s => items.push(s)); else items.push({ name, sku, qty, unit, fromBundle: null });
        } else { items.push({ name, sku, qty, unit, fromBundle: null }); }
        i = j; continue;
      }
      i++;
    }
    return { id: jobId, name: jobId, filename, items };
  }

  /* ── FIX: buildMasterList stores jobQtys so M2/M3 can show per-slip quantities ── */
  function buildMasterList(jobs) {
    const map = new Map();
    jobs.forEach(job => {
      job.items.forEach(item => {
        const key = item.sku ? item.sku.toUpperCase() : item.name.toLowerCase();
        if (map.has(key)) {
          const ex = map.get(key);
          ex.qty += item.qty;
          if (!ex.jobs.includes(job.id)) ex.jobs.push(job.id);
          /* accumulate per-job qty for M2/M3 - does not affect M1 consolidated qty */
          ex.jobQtys[job.id] = (ex.jobQtys[job.id] || 0) + item.qty;
        } else {
          map.set(key, {
            key,
            name: item.name,
            sku: item.sku || '',
            qty: item.qty,
            unit: item.unit,
            fromBundle: item.fromBundle || null,
            jobs: [job.id],
            jobQtys: { [job.id]: item.qty },
          });
        }
      });
    });
    return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
  }

  /* ═══════════════════════════════════════════════
     SUPABASE - M1 sessions & checks
  ═══════════════════════════════════════════════ */
  /* appendToSession - parse files, check for dupe jobs, show banner or proceed */
  async function appendToSession() {
    const target = state.appendTarget;
    const files  = state.stagedFiles;
    if (!target || !files.length) { toast('Load a session and upload PDFs first'); return; }

    const prog = document.getElementById('parse-progress');
    if (prog) prog.style.display = '';

    /* Parse new files */
    const newJobObjs = [];
    for (let i = 0; i < files.length; i++) {
      setProgress(Math.round(i / files.length * 70), `Parsing ${files[i].name}…`);
      try { newJobObjs.push(await parseFile(files[i])); }
      catch (err) { console.error('Parse error:', files[i].name, err); toast(`Could not parse ${files[i].name}`); }
    }
    if (!newJobObjs.length) { toast('No files parsed successfully'); if (prog) prog.style.display = 'none'; return; }

    /* Job-level dupe check - show styled banner, do not proceed silently */
    const existingJobSet = new Set((target.jobs || []).map(j => String(j).toUpperCase().trim()));
    const dupJobs = newJobObjs.filter(j => existingJobSet.has(String(j.id).toUpperCase().trim()));
    if (dupJobs.length) {
      if (prog) prog.style.display = 'none';
      state.appendDupWarnings    = dupJobs.map(j => j.id);
      state.appendPendingJobObjs = newJobObjs;
      render(); return;
    }

    await doAppendMerge(newJobObjs);
  }

  /* doAppendMerge - the actual merge+save, called after dupe check passes */
  async function doAppendMerge(newJobObjs) {
    const target = state.appendTarget;
    const prog = document.getElementById('parse-progress');
    if (prog) prog.style.display = '';

    setProgress(80, 'Fetching current session…');

    /* Always re-fetch the session fresh from the DB so we never merge against
       a stale in-memory masterList. This prevents a second append from
       clobbering items written by a previous one. */
    const { data: freshSession, error: fetchErr } = await sb.from('sessions').select('*').eq('id', target.id).single();
    if (fetchErr || !freshSession) {
      toast('Could not fetch session - check your connection');
      return;
    }
    const freshMasterList = freshSession.master_list || [];
    const freshJobs       = freshSession.jobs || [];

    setProgress(85, 'Merging into existing session…');

    /* Reconstruct existing items per-job from jobQtys so re-appending a job
       doesn't double-count. Each original job becomes its own job-like object
       with only its own quantities, matching what buildMasterList expects.    */
    const existingJobIds = [...new Set(
      freshMasterList.flatMap(i => Object.keys(i.jobQtys || {}))
    )];

    const existingJobObjs = existingJobIds.length
      ? existingJobIds.map(jobId => ({
          id: jobId,
          items: freshMasterList
            .filter(i => i.jobQtys && i.jobQtys[jobId] != null)
            .map(i => ({
              name: i.name ? i.name.trim() : i.name,
              sku:  i.sku  ? i.sku.trim()  : '',
              qty:  i.jobQtys[jobId],
              unit: i.unit || '',
              fromBundle: i.fromBundle || null,
            })),
        }))
      : [{
          /* fallback: no jobQtys stored - treat whole list as one existing block */
          id: '__existing__',
          items: freshMasterList.map(i => ({
            name: i.name ? i.name.trim() : i.name,
            sku:  i.sku  ? i.sku.trim()  : '',
            qty:  i.qty,
            unit: i.unit || '',
            fromBundle: i.fromBundle || null,
          })),
        }];

    /* Remove jobs being re-appended from the existing set so their quantities
       come entirely from the fresh PDF, not the old stored value + new value  */
    const incomingIds = new Set(newJobObjs.map(j => String(j.id).toUpperCase().trim()));
    const baseJobObjs = existingJobObjs.filter(j => !incomingIds.has(String(j.id).toUpperCase().trim()));

    /* Build merged master list */
    const merged = buildMasterList([...baseJobObjs, ...newJobObjs]);

    /* Merge job refs — use freshJobs from DB, not the potentially stale in-memory copy */
    const newJobIds = newJobObjs.map(j => j.id);
    const mergedJobs = [...new Set([...freshJobs, ...newJobIds])];

    /* Update session in Supabase */
    setProgress(95, 'Saving…');
    const { error } = await sb.from('sessions').update({
      master_list: merged,
      jobs: mergedJobs,
    }).eq('id', target.id);

    if (error) {
      console.error(error);
      toast('⚠ Could not save - check your connection');
      return;
    }

    setProgress(100, 'Done!');
    toast(`✓ ${newJobObjs.length} slip${newJobObjs.length !== 1 ? 's' : ''} merged into session ${target.code}`);

    /* Load the updated session */
    state.session = { id: target.id, code: target.code, masterList: merged, jobs: mergedJobs };
    state.checks  = {};
    state.stagedFiles  = [];
    state.appendTarget = null;
    state.view = 'session';
    setTimeout(() => render(), 400);
  }

  async function createSession(masterList, jobs) {
    const code = generateCode();
    const sourceFiles = (state.driveFileDocs || []).map(d => ({ id: d.id, name: d.name, url: `https://drive.google.com/file/d/${d.id}/view` }));
    const { data, error } = await sb.from('sessions').insert({ code, master_list: masterList, jobs, source_files: sourceFiles.length ? sourceFiles : null, created_at: new Date().toISOString() }).select().single();
    if (error) { console.error(error); toast('Could not save session \u2014 working offline'); return { id: 'local', code, masterList, jobs }; }
    subscribeToChecks(data.id);
    return { id: data.id, code, masterList, jobs, sourceFiles: data.source_files || [] };
  }

  async function joinSession(code) {
    const tryCode = async (c) => sb.from('sessions').select('*').eq('code', c).single();
    let { data, error } = await tryCode(code);
    if (error || !data) {
      const dashed = code.replace(/^(AB)(\d{4})(.+)$/, '$1-$2-$3');
      if (dashed !== code) { const r = await tryCode(dashed); data = r.data; error = r.error; }
    }
    if (error || !data) { toast('Session not found \u2014 check the code'); return; }
    state.session = { id: data.id, code: data.code, masterList: data.master_list, jobs: data.jobs };
    state.checks  = {}; state.role = 'warehouse'; state.view = 'check';
    const { data: ec } = await sb.from('checks').select('*').eq('session_id', data.id).order('updated_at', { ascending: false });
    if (ec) {
      const ml = data.master_list || [];
      const ntk = new Map();
      for (const item of ml) {
        ntk.set(String(item.key).toLowerCase().trim(), item.key);
        if (item.sku) ntk.set(String(item.sku).toLowerCase().trim(), item.key);
        ntk.set(String(item.name).toLowerCase().trim(), item.key);
      }
      const seen = new Set();
      for (const c of ec) {
        if (!c.status || c.status === 'unchecked') continue;
        const rk = ntk.get(String(c.item_key).toLowerCase().trim()) || c.item_key;
        if (!seen.has(rk)) { seen.add(rk); state.checks[rk] = { status: c.status, haveQty: c.have_qty }; }
      }
    }
    subscribeToChecks(data.id); render();
  }

  function subscribeToChecks(sessionId) {
    sb.channel('checks-' + sessionId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'checks', filter: `session_id=eq.${sessionId}` }, payload => {
        const c = payload.new;
        if (c.status && c.status !== 'unchecked') state.checks[c.item_key] = { status: c.status, haveQty: c.have_qty };
        if (state.view === 'check') render();
      }).subscribe();
  }

  async function setStatus(key, status) {
    if (state.checks[key]?.status === status) { delete state.checks[key]; } else { state.checks[key] = { status }; }
    render(); await pushCheck(key);
  }

  async function submitAllChecks() {
    const btn = document.getElementById('submit-all-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
    if (!state.session?.id || state.session.id === 'local') {
      toast('No active session - nothing to submit'); if (btn) { btn.disabled = false; btn.innerHTML = '&#10003; Submit'; } return;
    }
    const items = state.session.masterList;
    const checked = items.filter(i => state.checks[i.key]?.status);
    if (!checked.length) {
      toast('No items checked yet - tap items first');
      if (btn) { btn.disabled = false; btn.innerHTML = '&#10003; Submit'; } return;
    }
    try {
      const rows = checked.map(item => ({
        session_id: state.session.id,
        item_key:   item.key,
        status:     state.checks[item.key].status,
        have_qty:   state.checks[item.key].haveQty || null,
      }));
      const { error } = await sb.from('checks').upsert(rows, { onConflict: 'session_id,item_key' });
      if (error) throw error;
      toast('✓ Saved - ' + rows.length + ' item' + (rows.length !== 1 ? 's' : '') + ' recorded in Supabase', 4000);
    } catch (err) {
      console.error('submitAllChecks error:', err);
      toast('⚠ Save failed - check your connection and try again', 5000);
    }
    if (btn) { btn.disabled = false; btn.innerHTML = '&#10003; Submit'; }
  }

  async function pushCheck(key) {
    if (!state.session?.id || state.session.id === 'local') return;
    const c = state.checks[key];
    await sb.from('checks').upsert(
      { session_id: state.session.id, item_key: key, status: c?.status || null, have_qty: c?.haveQty || null, updated_at: new Date().toISOString() },
      { onConflict: 'session_id,item_key' }
    );
  }

  /* ═══════════════════════════════════════════════
     SNAKE BACKGROUND ANIMATION
  ═══════════════════════════════════════════════ */
  function startSnake() {
    stopSnake();
    const canvas = document.getElementById('snake-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const G = 24;

    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const cols = Math.ceil(canvas.width  / G) + 1;
    const rows = Math.ceil(canvas.height / G) + 1;

    const mx = Math.floor(cols / 2);
    const my = Math.floor(rows / 2);
    let body = Array.from({ length: 10 }, (_, i) => ({ x: mx - i, y: my }));
    let vx = 1, vy = 0;
    let pending = 0;

    let lastStep = 0, lastTurn = 0;
    const STEP   = 280;
    let nextTurn = 1800 + Math.random() * 2000;

    function wrap(v, max) { return ((v % max) + max) % max; }

    function loop(now) {
      if (!document.getElementById('snake-canvas')) { snakeAnimId = null; return; }

      if (now - lastStep >= STEP) {
        lastStep = now;
        const h = body[0];
        body.unshift({ x: wrap(h.x + vx, cols), y: wrap(h.y + vy, rows) });
        if (pending > 0) { pending--; } else { body.pop(); }
        if (body.length < 40 && Math.random() < 0.06) pending += 2;
      }

      if (now - lastTurn >= nextTurn) {
        lastTurn   = now;
        nextTurn   = 1500 + Math.random() * 2200;
        const opts = [[1,0],[-1,0],[0,1],[0,-1]]
          .filter(([dx,dy]) => !(dx === -vx && dy === -vy));
        [vx, vy]   = opts[Math.floor(Math.random() * opts.length)];
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      body.forEach((seg, i) => {
        const fade  = 1 - i / body.length;
        const alpha = fade * 0.52 + 0.04;
        const r     = i === 0 ? 5 : 3.5;
        ctx.beginPath();
        ctx.arc(seg.x * G, seg.y * G, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100,116,139,${alpha.toFixed(2)})`;
        ctx.fill();
      });

      snakeAnimId = requestAnimationFrame(loop);
    }

    snakeAnimId = requestAnimationFrame(loop);
  }

  function stopSnake() {
    if (snakeAnimId) { cancelAnimationFrame(snakeAnimId); snakeAnimId = null; }
    const c = document.getElementById('snake-canvas');
    if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  }

  async function loadDashboard() {
    const el = document.getElementById('dashboard');
    if (!el) return;
    try {
      /* ── All queries run in parallel ── */
      const STOCK_COLS = 'id,name,sku,current_qty,low_stock_qty,backorder_until,backorder_note,stocked,oos_expected_date,oos_expected_label';

      const [
        picksRes, delivsRes, remedialPoRes, shortChecksRes, altsRes, stockRes, giRes, goRes, fitterRemRes,
      ] = await Promise.allSettled([
        sb.from('pick_completions').select('*').gt('shortfall', 0).order('updated_at', { ascending: false }).limit(200),
        sb.from('deliveries').select('*').gt('shortfall', 0).order('updated_at', { ascending: false }).limit(200),
        sb.from('remedials').select('job_ref, po_ref').eq('status', 'ordered').not('po_ref', 'is', null),
        sb.from('checks').select('*').in('status', ['short', 'part']).order('updated_at', { ascending: false }).limit(300),
        sb.from('alternatives').select('*').eq('status', 'pending').order('updated_at', { ascending: false }).limit(100),
        sb.from('stock_items').select(STOCK_COLS),
        sb.from('goods_in_lines').select('*, goods_in_pos(po_number, supplier, po_date)').or('has_partial.eq.true,has_damage.eq.true').eq('resolved', false).order('created_at', { ascending: false }).limit(100),
        sb.from('goods_out_orders').select('id,invoice_ref,collector_name,customer_type,fulfilment_type,status,created_at').in('status', ['pending','staged']).order('created_at', { ascending: false }).limit(100),
        sb.from('remedials').select('id,job_ref,item_name,notes,created_at').eq('source', 'fitter').eq('status', 'pending').order('created_at', { ascending: false }).limit(100),
      ]);

      const picks          = picksRes.status       === 'fulfilled' ? (picksRes.value.data       || []) : [];
      const delivs         = delivsRes.status      === 'fulfilled' ? (delivsRes.value.data      || []) : [];
      const remedialPoData = remedialPoRes.status  === 'fulfilled' ? (remedialPoRes.value.data  || []) : [];
      const shortChecks    = shortChecksRes.status === 'fulfilled' ? (shortChecksRes.value.data || []) : [];
      const alts           = altsRes.status        === 'fulfilled' ? (altsRes.value.data        || []) : [];
      const stock          = stockRes.status       === 'fulfilled' ? (stockRes.value.data       || []) : [];
      const giExceptions   = giRes.status          === 'fulfilled' ? (giRes.value.data          || []) : [];
      const goOrders       = goRes.status          === 'fulfilled' ? (goRes.value.data          || []) : [];
      const fitterRemedials = fitterRemRes.status  === 'fulfilled' ? (fitterRemRes.value.data   || []) : [];

      /* ── Remedial PO refs ── */
      state.dashRemedialPORefs = {};
      remedialPoData.forEach(r => { if (r.po_ref) state.dashRemedialPORefs[r.job_ref] = r.po_ref; });

      /* ── M1 purchasing shortfalls — secondary query only if needed ── */
      let m1 = [];
      if (shortChecks.length) {
        const sessIds = [...new Set(shortChecks.map(c => c.session_id))].slice(0, 8);
        const { data: sessions } = await sb.from('sessions')
          .select('id, code, master_list').in('id', sessIds).neq('archived', true);
        (sessions || []).forEach(sess => {
          const sessChecks = shortChecks.filter(c => c.session_id === sess.id);
          const mlMap = new Map((sess.master_list || []).map(i => [String(i.key), i]));
          const items = sessChecks.map(c => {
            const item = mlMap.get(String(c.item_key)) || {};
            const have = c.status === 'part' ? (Number(c.have_qty) || 0) : 0;
            const needed = Number(item.qty) || 0;
            return { name: item.name || c.item_key, sku: item.sku || '', needed, have, toOrder: needed - have, jobs: item.jobs || [] };
          }).filter(i => i.toOrder > 0);
          if (items.length) m1.push({ code: sess.code, items });
        });
      }

      const m2Map = new Map();
      picks.forEach(r => {
        const job = displayJobRef(r.job_ref) || r.job_ref;
        if (!m2Map.has(job)) m2Map.set(job, []);
        m2Map.get(job).push(r);
      });

      const m3Map = new Map();
      delivs.forEach(r => {
        const job = displayJobRef(r.job_ref) || r.job_ref;
        if (!m3Map.has(job)) m3Map.set(job, []);
        m3Map.get(job).push(r);
      });

      /* ── Stock checker summary ── */
      const stockCounted   = stock.filter(i => i.current_qty !== null && i.current_qty !== undefined).length;
      const stockLow       = stock.filter(i =>
        i.current_qty !== null && i.current_qty !== undefined &&
        i.low_stock_qty !== null && i.low_stock_qty !== undefined &&
        Number(i.current_qty) <= Number(i.low_stock_qty));
      const stockBackorder = stock.filter(i => !!i.backorder_until);

      state.dash = {
        loading: false, m1, m2: [...m2Map.entries()], m3: [...m3Map.entries()], alts,
        stockTotal: stock.length, stockCounted, stockLow, stockBackorder, stockAll: stock,
        m5: giExceptions, goOrders, fitterRemedials,
      };
      el.innerHTML = renderDashboardContent();
    } catch (err) {
      console.error('Dashboard error:', err);
      if (el) el.innerHTML = '<p class="dash-loading">Could not load pending actions.</p>';
    }
  }

        <div class="dash-stripe" style="background:#7c3aed;"></div>
        <div class="dash-section-title" style="flex:1;">06 &nbsp;Stock Checker</div>
        ${stockBadge}
        <span class="dash-module-chevron${state.dashModuleExpanded.m4 ? ' open' : ''}" data-module="m4">&#9658;</span>
      </div>
      <div class="dash-module-body${state.dashModuleExpanded.m4 ? ' open' : ''}" data-module="m4">
      ${lowRows ? `<div class="dash-item" style="font-weight:700;border-bottom:none;padding-bottom:0;">Low stock</div>${lowRows}` : `<div class="dash-item text-muted text-sm">No items below their low stock threshold.</div>`}
      ${boRows ? `<div class="dash-item" style="font-weight:700;border-bottom:none;padding-bottom:0;margin-top:6px;">Back order</div>${boRows}` : ''}
      <div class="dash-footer" style="flex-wrap:wrap;gap:8px;">
        ${state.dash.addItemOpen ? addForm : `<button class="btn btn-ghost" data-action="stock-add-open" style="font-size:.8rem;padding:6px 14px;">&#43; Add stock item</button>`}
        ${state.dash.oosOpen ? '' : `<button class="btn btn-ghost" data-action="stock-oos-open" style="font-size:.8rem;padding:6px 14px;">Mark item out of stock</button>`}
      </div>
      ${oosOpen}
      </div>
    </div>`;
  }

  async function toggleOosItem(id, currentlyOos) {
    /* this path only runs for "mark back in stock" now - going out of stock uses the mark form */
    const { error } = await sb.from('stock_items').update({
      stocked: 'yes', oos_expected_date: null, oos_expected_label: null,
    }).eq('id', id);
    if (error) { toast('Save failed - check connection'); return; }
    const item = (state.dash.stockAll || []).find(i => i.id === id);
    if (item) { item.stocked = 'yes'; item.oos_expected_date = null; item.oos_expected_label = null; }
    toast('Marked back in stock');
    const dashEl = document.getElementById('dashboard');
    if (dashEl) dashEl.innerHTML = renderDashboardContent();
  }

  function openOosMarkForm(id) {
    state.dash.oosMarkFormId = id;
    const dashEl = document.getElementById('dashboard');
    if (dashEl) dashEl.innerHTML = renderDashboardContent();
  }

  function closeOosMarkForm() {
    state.dash.oosMarkFormId = null;
    const dashEl = document.getElementById('dashboard');
    if (dashEl) dashEl.innerHTML = renderDashboardContent();
  }

  function addMonthsLabel(n) {
    const d = new Date();
    d.setMonth(d.getMonth() + n);
    return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  }

  async function confirmOosMark(id) {
    const sel = document.getElementById(`oos-expected-${id}`);
    const customEl = document.getElementById(`oos-expected-custom-${id}`);
    const choice = sel ? sel.value : '1m';
    let label = '';
    let dateVal = null;
    if (choice === '1m') { label = `Expected ${addMonthsLabel(1)}`; }
    else if (choice === '2m') { label = `Expected ${addMonthsLabel(2)}`; }
    else if (choice === '3m') { label = `Expected ${addMonthsLabel(3)}`; }
    else if (choice === 'never') { label = 'Never \u2014 end of line'; }
    else if (choice === 'custom') { label = (customEl ? customEl.value.trim() : '') || 'Date to be confirmed'; }
    const { error } = await sb.from('stock_items').update({
      stocked: 'no', oos_expected_date: dateVal, oos_expected_label: label,
    }).eq('id', id);
    if (error) { toast('Save failed - check connection'); return; }
    const item = (state.dash.stockAll || []).find(i => i.id === id);
    if (item) { item.stocked = 'no'; item.oos_expected_date = dateVal; item.oos_expected_label = label; }
    state.dash.oosMarkFormId = null;
    toast('Marked out of stock');
    const dashEl = document.getElementById('dashboard');
    if (dashEl) dashEl.innerHTML = renderDashboardContent();
  }

  async function saveStockAddItem() {
    const catEl  = document.getElementById('stock-add-cat');
    const subEl  = document.getElementById('stock-add-sub');
    const skuEl  = document.getElementById('stock-add-sku');
    const nameEl = document.getElementById('stock-add-name');
    const lowEl  = document.getElementById('stock-add-low');
    const errEl  = document.getElementById('stock-add-error');
    const name = nameEl ? nameEl.value.trim() : '';
    if (!name) { if (errEl) errEl.textContent = 'Product name is required'; return; }
    const row = {
      category:      catEl ? catEl.value : 'wall_floor',
      sub_category:  subEl && subEl.value.trim() ? subEl.value.trim() : null,
      sku:           skuEl && skuEl.value.trim() ? skuEl.value.trim() : null,
      name,
      low_stock_qty: lowEl && lowEl.value !== '' ? Number(lowEl.value) : null,
    };
    const { error } = await sb.from('stock_items').insert(row);
    if (error) { if (errEl) errEl.textContent = 'Save failed - check connection'; return; }
    state.dash.addItemOpen = false;
    toast('Item added');
    await loadDashboard();
  }

  function renderDashboardContent() {
    const { m1, m2, m3, fitterRemedials } = state.dash;
    const m1Count = m1.reduce((s, g) => s + g.items.length, 0);
    const m2Count = m2.reduce((s, [, rows]) => s + rows.length, 0);
    const m3Count = m3.reduce((s, [, rows]) => s + rows.length, 0);
    const fitterCount = (fitterRemedials || []).length;
    const stockHtml = renderStockDashSection();

    if (!m1Count && !m2Count && !m3Count && !fitterCount) {
      return `<div class="dash-clear">
        <div class="dash-clear-icon">&#10003;</div>
        <div style="font-weight:700;color:var(--green);margin-bottom:4px;">All clear</div>
        <div class="text-muted text-sm">No outstanding shortfalls across any module.</div>
      </div>` + stockHtml;
    }

    /* ── M1: expandable per-session ── */
    let m1Html = '';
    if (m1Count) {
      const sessionBlocks = m1.map(({ code, items }) => {
        const isOpen = !!state.dashExpanded[code];
        const itemRows = items.map(i => {
          const jobList = (i.jobs || []).map(j => displayJobRef(normJobRef(j))).filter(Boolean);

            </div>
            <span class="dash-item-short" style="flex-shrink:0;">Need ${i.toOrder}</span>
            ${jobList.length ? `<div class="c4-loc-pills" style="width:100%;margin-top:5px;"><span class="c4-loc-label">Jobs</span>${jobList.map(j => `<span class="c4-loc-pill">${esc(j)}</span>`).join('')}</div>` : ''}

        }).join('');
        return `
          <div class="dash-session">
            <div class="dash-session-head" data-action="dash-expand" data-key="${esc(code)}">
              <div class="dash-session-code">Session ${esc(code)}</div>

            </div>
            <div class="dash-session-body ${isOpen ? 'open' : ''}" data-key="${esc(code)}">${itemRows}</div>
          </div>`;
      }).join('');

      m1Html = `<div class="dash-section">
        <div class="dash-section-head" data-action="dash-module-toggle" data-module="m1">
          <div class="dash-stripe" style="background:#0075ab;"></div>
          <div class="dash-section-title">01 &nbsp;Purchasing shortfalls</div>
          <span class="dash-count">${m1Count}</span>
          <span class="dash-module-chevron${state.dashModuleExpanded.m1 ? ' open' : ''}" data-module="m1">&#9658;</span>
        </div>
        <div class="dash-module-body${state.dashModuleExpanded.m1 ? ' open' : ''}" data-module="m1">
        ${sessionBlocks}
        <div class="dash-footer">
          <button class="btn btn-ghost" data-action="copy-dash-m1" style="font-size:.8rem;padding:6px 14px;">&#128722; Send purchasing list</button>
        </div>
        </div>
      </div>`;
    }

    /* ── M2: expandable per-job ── */
    let m2Html = '';
    if (m2Count) {
      const jobBlocks = m2.map(([job, items]) => {
        const key = 'm2-' + job;
        const isOpen = !!state.dashExpanded[key];
        const itemRows = items.map(i => `
          <div class="dash-item">
            <div class="dash-item-name">${esc(i.item_name)}</div>
            <span class="dash-item-detail">Needed ${i.needed_qty} &middot; Picked ${i.picked_qty}</span>
            <span class="dash-item-short">Short ${i.shortfall}</span>
          </div>`).join('');
        return `
          <div class="dash-session">
            <div class="dash-session-head" data-action="dash-expand" data-key="${esc(key)}">
              <div class="dash-session-code">Job ${esc(job)}</div>
              <div class="dash-session-meta">${items.length} item${items.length !== 1 ? 's' : ''}</div>
              <button class="dash-archive-btn" data-action="dash-archive-m2" data-job="${esc(job)}" title="Mark job as complete">Archive</button>
              <div class="dash-session-chevron ${isOpen ? 'open' : ''}" data-key="${esc(key)}">&#9658;</div>
            </div>
            <div class="dash-session-body ${isOpen ? 'open' : ''}" data-key="${esc(key)}">${itemRows}</div>
          </div>`;
      }).join('');

      m2Html = `<div class="dash-section">
        <div class="dash-section-head" data-action="dash-module-toggle" data-module="m2">
          <div class="dash-stripe" style="background:#059669;"></div>
          <div class="dash-section-title">02 &nbsp;Pick shortfalls</div>
          <span class="dash-count">${m2Count}</span>
          <span class="dash-module-chevron${state.dashModuleExpanded.m2 ? ' open' : ''}" data-module="m2">&#9658;</span>
        </div>
        <div class="dash-module-body${state.dashModuleExpanded.m2 ? ' open' : ''}" data-module="m2">
        ${jobBlocks}
        <div class="dash-footer">
          <button class="btn btn-ghost" data-action="copy-dash-m2" style="font-size:.8rem;padding:6px 14px;">&#128722; Send pick shortfalls</button>
        </div>
        </div>
      </div>`;
    }

    /* ── M3: expandable per-job ── */
    let m3Html = '';
    if (m3Count || fitterCount) {
      /* ── Fitter-raised pending remedials ── */
      const fitterBlocks = (fitterRemedials || []).map(r => {
        const jobDisplay = displayJobRef(r.job_ref || '') || r.job_ref || '—';
        const itemLabel = (r.item_name && r.item_name.trim()) ? esc(r.item_name) : 'Unspecified item';
        const notesLine = r.notes
          ? `<div style="font-size:.8rem;color:var(--text);margin-top:4px;">${esc(r.notes)}</div>`
          : '';
        return `
          <div class="dash-session" style="border-left:3px solid #7c3aed;padding-left:10px;margin-bottom:8px;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;">

                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">

            </div>
          </div>`;

      const jobBlocks = m3.map(([job, items]) => {
        const key = 'm3-' + job;
        const isOpen = !!state.dashExpanded[key];
        const driver = items[0]?.driver_name ? ` &middot; ${esc(items[0].driver_name)}` : '';
        const isRemedialJob = items.some(i => i.is_remedial);
        const itemRows = items.map(i => `
          <div class="dash-item">
            <div class="dash-item-name">${esc(i.item_name)}</div>

        const job_poRef = state.dashRemedialPORefs ? (state.dashRemedialPORefs[job] || '') : '';
        const job_moonOpened = state.dashMoonOpened ? !!state.dashMoonOpened[job] : false;
        return `
          <div class="dash-session">
            <div class="dash-session-head" data-action="dash-expand" data-key="${esc(key)}">
              <div class="dash-session-code">Job ${esc(job)}${driver}${isRemedialJob ? ' <span style="font-size:.68rem;background:#fee2e2;color:#991b1b;padding:2px 6px;border-radius:4px;font-weight:600;vertical-align:middle;">REMEDIAL</span>' : ''}</div>
              <div class="dash-session-meta">${items.length} item${items.length !== 1 ? 's' : ''}</div>
              ${job_poRef
  ? `<span style="font-size:.72rem;background:#d1fae5;color:#065f46;padding:3px 8px;border-radius:6px;white-space:nowrap;">PO ${esc(job_poRef)} raised</span>`
  : job_moonOpened
    ? `<button class="btn btn-sm" style="background:#059669;color:#fff;font-size:.75rem;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;" data-action="dash-confirm-po" data-job="${esc(job)}" data-remtype="${state.dashRemedialType && state.dashRemedialType[job] === 'collection' ? 'collection' : 'delivery'}" title="Enter the PO number from Moon Invoice">Confirm PO number</button>`
    : `<button class="btn btn-sm" style="background:#0075ab;color:#fff;font-size:.75rem;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;" data-action="dash-raise-order" data-job="${esc(job)}" title="Open Moon Invoice to raise a PO">Raise order</button>`
}
              <button class="dash-archive-btn" data-action="dash-archive-m3" data-job="${esc(job)}" title="Mark job as complete">Archive</button>

              ${itemRows}
              ${!job_poRef ? `
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">

                  <button class="gi-status-btn ${state.dashRemedialType && state.dashRemedialType[job] === 'collection' ? 'active-ok' : ''}"

      m3Html = `<div class="dash-section">

          <div class="dash-section-title">03 &nbsp;Remedial deliveries needed</div>

        <div class="dash-module-body${state.dashModuleExpanded.m3 ? ' open' : ''}" data-module="m3">
        ${fitterCount ? `<div style="font-size:.75rem;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Fitter requests — awaiting approval</div>${fitterBlocks}<div style="border-top:1px solid var(--border);margin:12px 0 12px;"></div>` : ''}
        ${jobBlocks}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
          <button class="btn btn-ghost" data-action="dash-adhoc-remedial"
            style="width:100%;font-size:.82rem;color:#475569;border-color:#cbd5e1;">
            + Raise ad hoc remedial
          </button>
        </div>
        </div>
      </div>`;
    }

    /* ── Alternatives section ── */
    let altHtml = '';
    const alts = state.dash.alts || [];
    if (alts.length) {
      const altRows = alts.map(a => `
        <div class="dash-item" style="flex-wrap:wrap;gap:6px;">
          <div style="width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <div class="dash-item-name" style="white-space:normal;">${esc(a.item_name)}</div>
            <span class="dash-item-detail">Qty ${a.qty || '?'}</span>
          </div>
          <div style="width:100%;font-size:.8rem;color:#7c3aed;font-weight:600;">

    if (m5Count) {

    const m5Html = `<div class="dash-section">
      <div class="dash-section-head" data-action="dash-module-toggle" data-module="m5" style="cursor:pointer;">
        <div class="dash-stripe" style="background:#0d9488;"></div>
        <div class="dash-section-title" style="flex:1;">04 &nbsp;Goods In</div>

          style="padding:3px 10px;font-size:.75rem;color:#0d9488;border-color:#0d9488;flex-shrink:0;">Open &#8594;</button>
        ${m5Badge}
        ${m5Count ? `<span class="dash-module-chevron${state.dashModuleExpanded.m5 ? ' open' : ''}" data-module="m5">&#9658;</span>` : ''}

      ${m5Count ? `<div class="dash-module-body${state.dashModuleExpanded.m5 ? ' open' : ''}" data-module="m5">${m5ExceptionRows}</div>` : ''}

    /* ── M6: Goods Out — pending/staged orders ── */
    const goOrders  = state.dash.goOrders || [];
    const goCount   = goOrders.length;
    const ctMap     = { install: '#dcfce7:#166534:Install', retail: '#dbeafe:#1d4ed8:Retail', trade: '#fef3c7:#92400e:Trade', external: '#f3e8ff:#7e22ce:External' };
    const goBadge   = goCount
      ? `<span class="dash-count">${goCount}</span>`
      : `<span class="dash-count ok">&#10003; Clear</span>`;
    const goRows = goOrders.map(o => {
      const ctVal = ctMap[o.customer_type] || '#f1f5f9:#475569:Unknown';
      const [ctBg, ctCol, ctLabel] = ctVal.split(':');
      const isDelivery = (o.fulfilment_type || 'collection') === 'delivery';
      const statusLabel = o.status === 'pending' ? 'Pending pick' : 'Ready — awaiting ' + (isDelivery ? 'delivery' : 'collection');
      const statusBg = o.status === 'pending' ? '#fef3c7' : '#dcfce7';
      const statusCol = o.status === 'pending' ? '#92400e' : '#166534';
      return `
        <div class="dash-item" style="flex-wrap:wrap;gap:6px;">
          <div style="flex:1;min-width:0;">
            <div class="dash-item-name">${esc(o.invoice_ref || 'No ref')}${o.collector_name ? `<span class="dash-item-detail" style="margin-left:6px;">${esc(o.collector_name)}</span>` : ''}</div>
            <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;">

  /* ── Dashboard copy functions ── */
  /* ── Shared send helper: share sheet if available, clipboard fallback ── */
  function shareOrCopy(title, text, btnAction) {
    function flashBtn(ok) {
      const btn = document.querySelector(`[data-action="${btnAction}"]`);
      if (!btn) return;
      const orig = btn.innerHTML;
      btn.innerHTML = ok ? '&#10003; Sent!' : '&#10003; Copied!';
      btn.style.color = 'var(--green)';
      btn.style.borderColor = 'var(--green)';
      setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
    }
    if (navigator.share) {
      navigator.share({ title, text })
        .then(() => flashBtn(true))
        .catch(err => {
          /* User cancelled or share failed - fall back to clipboard silently */
          if (err.name !== 'AbortError') {
            navigator.clipboard.writeText(text).then(() => flashBtn(false)).catch(() => toast('Could not copy'));
          }
        });
    } else {
      navigator.clipboard.writeText(text).then(() => flashBtn(false)).catch(() => toast('Could not copy'));
    }
  }

  /* ═══════════════════════════════════════════════
     SUPABASE - M2 pick completion
  ═══════════════════════════════════════════════ */
  function normJobRef(j) {
    if (typeof j === 'string' && j.length) return j;
    if (j && typeof j === 'object') {
      return j.id || j.job_ref || j.code || j.jobName ||
             (j.filename ? j.filename.replace(/\.pdf$/i, '') : null) ||
             JSON.stringify(j);
    }
    return String(j);
  }

  function displayJobRef(ref) {
    if (!ref) return ref;
    const stripped = ref.replace(/^Q/i, '');
    const m = stripped.match(/^(\d+)/);
    return m ? m[1] : stripped;
  }

  async function loadC2Session() {
    const jobEl    = document.getElementById('c2-job');
    const pickerEl = document.getElementById('c2-picker');
    if (!jobEl) return;
    const raw = jobEl.value.trim();
    if (!raw) { toast('Enter a job number'); return; }
    const jobNum = displayJobRef(raw.replace(/^Q/i, '').trim()) || raw.trim();
    state.c2.pickerName = pickerEl ? pickerEl.value.trim() : '';
    state.c2.loading = true; render();

    /* search recent sessions for one containing this job */
    const { data: sessions } = await sb.from('sessions').select('*').order('created_at', { ascending: false }).limit(30);
    const matched = (sessions || []).find(s =>
      (s.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum) ||
      (s.master_list || []).some(i => (i.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum))
    );

    if (!matched) {
      state.c2.loading = false;
      toast('No session found for job ' + jobNum + '. Has Pick Verifier been run for this job?');
      render(); return;
    }

    const masterList = (matched.master_list || []).map(item => ({
      ...item,
      jobs: (item.jobs || []).map(normJobRef),
      jobQtys: item.jobQtys || {},
    }));

    const items = masterList
      .filter(i => (i.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum))
      .map(i => ({
        ...i,
        qty: (i.jobQtys && i.jobQtys[jobNum] != null) ? i.jobQtys[jobNum]
           : (i.jobQtys && i.jobQtys['Q' + jobNum] != null) ? i.jobQtys['Q' + jobNum]
           : i.qty,
      }));

    if (!items.length) {
      state.c2.loading = false;
      toast('No items found for job ' + jobNum);
      render(); return;
    }

    /* load existing pick completions for this session */
    const { data: existing } = await sb.from('pick_completions').select('*').eq('session_id', matched.id);
    if (existing && existing.length) {
      existing.forEach(row => {
        if (!state.c2.picks[row.job_ref]) state.c2.picks[row.job_ref] = {};
        if (!state.c2.picks[row.job_ref][row.item_key]) {
          state.c2.picks[row.job_ref][row.item_key] = { qty: row.picked_qty };
        }
      });
    }

    const jobSet = new Set();
    masterList.forEach(item => (item.jobs || []).forEach(j => jobSet.add(j)));
    if (jobSet.size === 0) (matched.jobs || []).forEach(j => jobSet.add(normJobRef(j)));

    state.c2.session     = { id: matched.id, code: matched.code, masterList, jobs: [...jobSet].sort() };
    state.c2.selectedJob = normJobRef('Q' + jobNum);
    /* if normJobRef with Q prefix doesn't match, try without */
    if (!state.c2.session.jobs.includes(state.c2.selectedJob)) {
      const direct = masterList.find(i => (i.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum));
      state.c2.selectedJob = direct ? direct.jobs.find(j => displayJobRef(normJobRef(j)) === jobNum) : state.c2.selectedJob;
    }
    state.c2.loading = false;
    state.view = 'c2-pick'; render();
  }

  async function submitC2Picks() {
    const s      = state.c2.session;
    const jobRef = state.c2.selectedJob;
    const picks  = state.c2.picks[jobRef] || {};
    const items  = s.masterList.filter(i => i.jobs && i.jobs.includes(jobRef));

    const rows = items.map(item => {
      const p = picks[item.key];
      /* ── FIX: use per-job qty as the baseline for shortfall calc ── */
      const neededQty = (item.jobQtys && item.jobQtys[jobRef] != null)
        ? item.jobQtys[jobRef]
        : item.qty;
      const pickedQty = (p && p.qty !== null && p.qty !== undefined) ? Number(p.qty) : neededQty;
      const shortfall  = Math.max(0, neededQty - pickedQty);
      return {
        session_id:   s.id,
        job_ref:      jobRef,
        item_key:     item.key,
        item_name:    item.name,
        needed_qty:   neededQty,
        picked_qty:   pickedQty,
        shortfall,
        updated_at:   new Date().toISOString(),
      };
    });

    const { error: delErr } = await sb.from('pick_completions').delete()
      .eq('session_id', s.id).eq('job_ref', jobRef);
    if (delErr) { console.error('M2 delete error:', delErr); toast('Save failed: ' + (delErr.message || 'unknown error')); return; }

    const { error } = await sb.from('pick_completions').insert(rows);
    if (error) { console.error('M2 insert error:', error); toast('Save failed: ' + (error.message || 'unknown error')); return; }

    if (!state.c2.picks[jobRef]) state.c2.picks[jobRef] = {};
    rows.forEach(r => { state.c2.picks[jobRef][r.item_key] = { qty: r.picked_qty }; });

    /* auto-create remedial rows for any shortfall items */
    const shortRows = rows.filter(r => r.shortfall > 0);
    if (shortRows.length) {
      const remedialRows = shortRows.map(r => ({
        session_id:   s.id,
        job_ref:      r.job_ref,
        item_key:     r.item_key,
        item_name:    r.item_name,
        shortfall_qty: r.shortfall,
        status:       'pending',
        created_at:   new Date().toISOString(),
      }));
      /* delete any existing pending remedials for this job first to avoid dupes */
      await sb.from('remedials').delete().eq('session_id', s.id).eq('job_ref', jobRef).eq('status', 'pending');
      await sb.from('remedials').insert(remedialRows);
    }

    state.view = 'c2-done'; render();
  }

  function copyC2Shortfall() {
    const s      = state.c2.session;
    const jobRef = state.c2.selectedJob;
    const picks  = state.c2.picks[jobRef] || {};
    const items  = s.masterList.filter(i => i.jobs && i.jobs.includes(jobRef));
    const shorts = items.filter(i => {
      const p = picks[i.key];
      if (!p || p.qty === null || p.qty === undefined) return false;
      const needed = (i.jobQtys && i.jobQtys[jobRef] != null) ? i.jobQtys[jobRef] : i.qty;
      return Number(p.qty) < needed;
    });
    if (!shorts.length) { toast('Nothing short'); return; }
    const lines = [
      'ANNICK BATHROOMS \u2014 PICK SHORTFALL',
      `Session: ${s.code}  Job: ${jobRef}`,
      `Generated: ${new Date().toLocaleString('en-GB')}`, '',
      'Item | SKU | Needed | Picked | Short', '\u2500'.repeat(60),
      ...shorts.map(i => {
        const p = picks[i.key];
        const needed = (i.jobQtys && i.jobQtys[jobRef] != null) ? i.jobQtys[jobRef] : i.qty;
        return `${i.name} | ${i.sku || ''} | ${needed} | ${p.qty} | ${needed - Number(p.qty)}`;
      }),
    ];
    navigator.clipboard.writeText(lines.join('\n')).then(() => toast('Shortfall copied!'));
  }

        <div style="font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:6px;">Reason <span style="color:#b91c1c;">*</span></div>

          <option value="other" ${state.adhocRemedial.reason === 'other' ? 'selected' : ''}>Other</option>
        </select>

        <div style="display:flex;gap:10px;">
          <button id="adhoc-cancel" class="btn btn-ghost" style="flex:1;">Cancel</button>
          <button id="adhoc-submit" class="btn btn-primary" style="flex:2;">Raise remedial</button>
        </div>

    document.getElementById('adhoc-cancel').addEventListener('click', () => overlay.remove());

    document.getElementById('adhoc-submit').addEventListener('click', async () => {
      const jobRef   = document.getElementById('adhoc-job').value.trim().replace(/^Q/i, '');
      const itemName = document.getElementById('adhoc-item').value.trim();
      const qty      = parseFloat(document.getElementById('adhoc-qty').value);

      const errEl    = document.getElementById('adhoc-error');

      if (!jobRef)        { errEl.textContent = 'Enter a job reference.'; errEl.style.display = 'block'; return; }
      if (!itemName)      { errEl.textContent = 'Enter an item description.'; errEl.style.display = 'block'; return; }
      if (!qty || qty < 1){ errEl.textContent = 'Enter a valid quantity.'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';

      /* Advisory check — does this job ref exist in sessions? */
      const { data: sessionCheck } = await sb.from('sessions').select('id').ilike('code', '%' + jobRef + '%').limit(1);

      const submitBtn = document.getElementById('adhoc-submit');
      submitBtn.textContent = 'Saving...';
      submitBtn.disabled = true;

      const { error } = await sb.from('remedials').insert({
        job_ref:       jobRef,
        item_key:      'adhoc-' + Date.now(),
        item_name:     itemName,
        shortfall_qty: qty,
        status:        'pending',
        source:        'adhoc',
        remedial_type: 'delivery',
        created_at:    new Date().toISOString(),

      if (error) {
        errEl.textContent = 'Save failed: ' + (error.message || 'unknown error');
        errEl.style.display = 'block';
        submitBtn.textContent = 'Raise remedial';
        submitBtn.disabled = false;
        return;
      }

      overlay.remove();
      toast('Ad hoc remedial raised for job ' + jobRef);
      render();
    });
  }

        : '<span style="font-size:.7rem;background:#d1fae5;color:#065f46;padding:1px 6px;border-radius:4px;font-weight:600;margin-left:6px;">DELIVERY</span>';
      const sourceTag = r.source === 'adhoc' ? ' &middot; Ad hoc' : r.source === 'fitter' ? ' &middot; Fitter' : '';
      const notesHtml = r.notes

        + notesHtml

  async function loadC3Job() {
    const jobEl    = document.getElementById('c3-job');
    const driverEl = document.getElementById('c3-driver');
    if (!jobEl) return;
    const raw = jobEl.value.trim();
    if (!raw) { toast('Enter a job reference'); return; }
    const driverName = driverEl ? driverEl.value.trim() : '';
    if (!driverName) { toast('Enter your name before continuing'); return; }
    const jobNum = displayJobRef(raw.replace(/^Q/i, '').trim()) || raw.trim();
    state.c3.jobRef     = jobNum;
    state.c3.driverName = driverName;
    state.c3.loading    = true;
    state.c3.goodsOutOrder = null;
    render();

    /* check goods_out_orders first — staged delivery/collection orders */
    const { data: goOrders } = await sb.from('goods_out_orders')
      .select('id,invoice_ref,collector_name,customer_type,fulfilment_type,status')
      .eq('status', 'staged')
      .eq('fulfilment_type', 'delivery')
      .ilike('invoice_ref', jobNum)
      .limit(5);
    const goMatch = (goOrders || []).find(o => (o.invoice_ref || '').trim().toUpperCase() === jobNum.toUpperCase());

    if (goMatch) {
      /* load lines for this goods out order */
      const { data: goLines } = await sb.from('goods_out_lines').select('*').eq('order_id', goMatch.id);
      state.c3.goodsOutOrder = goMatch;
      state.c3.items = (goLines || []).map(l => ({ key: l.id, name: l.item_name, sku: l.sku || '', qty: l.qty, unit: 'pcs', jobs: [jobNum] }));
      state.c3.session = null;
      if (!state.c3.items.length) { state.c3.loading = false; toast('Order found but no items on it — contact office'); render(); return; }
    } else {
      const { data: allPicks } = await sb.from('pick_completions').select('*')
        .order('updated_at', { ascending: false }).limit(500);
      const pickData = (allPicks || []).filter(r => displayJobRef(r.job_ref) === jobNum);

      if (pickData.length > 0) {
        const seen = new Map();
        pickData.forEach(row => {
          if (!seen.has(row.item_key) || row.updated_at > seen.get(row.item_key).updated_at) seen.set(row.item_key, row);
        });
        state.c3.items   = [...seen.values()].map(r => ({ key: r.item_key, name: r.item_name, sku: r.item_key.includes('-') ? r.item_key : '', qty: r.picked_qty, unit: 'pcs', jobs: [jobNum] }));
        state.c3.session = null;
      } else {
        const { data: sessions } = await sb.from('sessions').select('*').order('created_at', { ascending: false }).limit(30);
        const matched = (sessions || []).find(s =>
          (s.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum) ||
          (s.master_list || []).some(i => (i.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum))
        );
        if (!matched) {
          state.c3.loading = false;
          toast('No data found for job ' + jobNum + '. Has Pick Verifier been run for this job?');
          render(); return;
        }
        state.c3.session = matched;
        /* use per-job qty when available */
        state.c3.items = (matched.master_list || [])
          .filter(i => (i.jobs || []).some(j => displayJobRef(normJobRef(j)) === jobNum))
          .map(i => ({
            ...i,
            qty: (i.jobQtys && i.jobQtys[jobNum] != null) ? i.jobQtys[jobNum]
               : (i.jobQtys && i.jobQtys['Q' + jobNum] != null) ? i.jobQtys['Q' + jobNum]
               : i.qty,
          }));
        if (!state.c3.items.length) { state.c3.loading = false; toast('No items found for job ' + jobNum); render(); return; }
      }
    }

    state.c3.loading   = false;
    state.c3.delivered = {};
    state.view         = 'c3-check'; render();
  }

  function initC3SignaturePad() {
    const canvas = document.getElementById('c3-sig-canvas');
    if (!canvas || canvas._sigBound) return;
    canvas._sigBound = true;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    let drawing = false;
    let lastX = 0, lastY = 0;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const src = e.touches ? e.touches[0] : e;
      return [(src.clientX - rect.left) * scaleX, (src.clientY - rect.top) * scaleY];
    }
    function start(e) { e.preventDefault(); drawing = true; [lastX, lastY] = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); }
    function move(e)  { e.preventDefault(); if (!drawing) return; const [x,y] = getPos(e); ctx.lineTo(x, y); ctx.stroke(); lastX = x; lastY = y; }
    function end(e)   { e.preventDefault(); drawing = false; }

    canvas.addEventListener('mousedown',  start);
    canvas.addEventListener('mousemove',  move);
    canvas.addEventListener('mouseup',    end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove',  move,  { passive: false });
    canvas.addEventListener('touchend',   end,   { passive: false });
  }

  async function submitC3Delivery() {
    const items     = state.c3.items;
    const delivered = state.c3.delivered;
    const sessionId = state.c3.session ? state.c3.session.id : null;
    const s         = state.c3.signoff || {};

    /* read free-text fields from DOM — these have no change handler so state won't have them */
    const postcodeEl = document.getElementById('c3-postcode');
    const notesEl    = document.getElementById('c3-notes');
    if (postcodeEl) s.postcode = postcodeEl.value;
    if (notesEl)    s.notes    = notesEl.value;

    /* validate required sign-off fields */
    if (!s.postcode || !s.postcode.trim())    { toast('Enter a customer postcode'); return; }
    if (!s.team)                               { toast('Select a delivery team'); return; }
    if (!s.deliveryStatus)                     { toast('Select delivery status'); return; }
    if (!s.customerPresent)                    { toast('Select customer present option'); return; }
    if (!s.notes || !s.notes.trim())           { toast('Add a note before submitting'); return; }
    if (!s.photos || s.photos.length === 0)    { toast('Add at least one photo of the materials on site'); return; }

    /* check signature canvas has marks */
    const canvas = document.getElementById('c3-sig-canvas');
    let signatureUrl = null;
    if (canvas) {
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      const blankCtx = blank.getContext('2d');
      blankCtx.fillStyle = '#ffffff';
      blankCtx.fillRect(0, 0, blank.width, blank.height);
      if (canvas.toDataURL() === blank.toDataURL()) { toast('Please add a signature'); return; }
    }

    toast('Uploading…');

    /* upload all photos */
    const photoUrls = [];
    for (const p of (s.photos || [])) {
      const ext  = (p.file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = 'deliveries/photo-' + state.c3.jobRef + '-' + Date.now() + '-' + photoUrls.length + '.' + ext;
      const { error: upErr } = await sb.storage.from('showroom-images').upload(path, p.file, { upsert: true });
      if (upErr) { toast('Photo upload failed - check connection'); return; }
      const { data: urlData } = sb.storage.from('showroom-images').getPublicUrl(path);
      if (urlData) photoUrls.push(urlData.publicUrl);
    }
    const photoUrl = photoUrls.length > 1 ? JSON.stringify(photoUrls) : (photoUrls[0] || null);

    /* upload signature */
    if (canvas) {
      const sigBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const sigPath = 'deliveries/sig-' + state.c3.jobRef + '-' + Date.now() + '.png';
      const { error: sigErr } = await sb.storage.from('showroom-images').upload(sigPath, sigBlob, { upsert: true, contentType: 'image/png' });
      if (sigErr) { toast('Signature upload failed - check connection'); return; }
      const { data: sigUrl } = sb.storage.from('showroom-images').getPublicUrl(sigPath);
      signatureUrl = sigUrl ? sigUrl.publicUrl : null;
    }

    /* insert item rows into deliveries */
    const rows = items.map(item => {
      const d            = delivered[item.key] || {};
      const deliveredQty = d.status === 'delivered' ? item.qty
        : d.status === 'short' ? (d.deliveredQty !== undefined ? Number(d.deliveredQty) : 0)
        : item.qty;
      return {
        session_id:    sessionId,
        job_ref:       state.c3.jobRef,
        item_key:      item.key,
        item_name:     item.name,
        picked_qty:    item.qty,
        delivered_qty: deliveredQty,
        shortfall:     Math.max(0, item.qty - deliveredQty),
        driver_name:       state.c3.driverName || null,
        customer_postcode: s.postcode ? s.postcode.trim().toUpperCase() : null,
        updated_at:        new Date().toISOString(),
      };
    });

    const { error: delErr } = await sb.from('deliveries').insert(rows);
    if (delErr) { console.error(delErr); toast('Could not save delivery - check your connection'); return; }

    /* insert sign-off record into delivery_submissions */
    const subRow = {
      job_ref:           state.c3.jobRef,
      driver_name:       state.c3.driverName || null,
      delivery_team:     s.team || null,
      customer_postcode: s.postcode ? s.postcode.trim().toUpperCase() : null,
      delivery_status:   s.deliveryStatus || null,
      customer_present:  s.customerPresent || null,
      notes:             s.notes ? s.notes.trim() : null,
      photo_url:         photoUrl,
      signature_url:     signatureUrl,
    };
    const { error: subErr } = await sb.from('delivery_submissions').insert(subRow);
    if (subErr) { console.error(subErr); toast('Delivery saved but sign-off record failed - contact Neil'); }

    /* if partial sign-off, write a remedial row to deliveries so it appears on the dashboard */
    if (s.deliveryStatus === 'partial') {
      const noteText = s.notes ? s.notes.trim() : 'Partial delivery - see sign-off notes';
      const remedialRow = {
        is_remedial:   true,
        session_id:        sessionId,
        job_ref:           state.c3.jobRef,
        item_key:          'partial-signoff-' + Date.now(),
        item_name:         noteText,
        picked_qty:        1,
        delivered_qty:     0,
        shortfall:         1,
        driver_name:       state.c3.driverName || null,
        customer_postcode: s.postcode ? s.postcode.trim().toUpperCase() : null,
        updated_at:        new Date().toISOString(),
      };
      const { error: remErr } = await sb.from('deliveries').insert(remedialRow);
      if (remErr) { console.error(remErr); toast('Delivery saved but remedial alert failed - contact Neil'); }
    }

    state.view = 'c3-done'; render();
  }

  /* ── PO / Invoice PDF parser — handles Moon Invoice PO and Invoice formats ── */
  function parsePurchaseOrder(text, filename) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

    /* Doc type and reference number — covers "P.O. # 201" and "Invoice # t206" */
    const poMatch  = text.match(/P\.?\s*O\.?\s*#\s*(\S+)/i);
    const invMatch = text.match(/Invoice\s*#\s*(\S+)/i);
    const docRef   = poMatch ? poMatch[1].trim() : invMatch ? invMatch[1].trim() : filename.replace(/\.pdf$/i, '');
    const docType  = poMatch ? 'PO' : invMatch ? 'INV' : 'REF';

    /* Date */
    const dateMatch = text.match(/Date\s+(\d{1,2}\s+\w+\s+\d{4})/i);
    const poDate    = dateMatch ? dateMatch[1].trim() : '';

    /* Supplier / recipient — "Vendor To:" for POs, "Invoice To:" for invoices */
    let supplier = '';
    const vendorIdx = lines.findIndex(l => /vendor\s+to/i.test(l));
    const invoiceToIdx = lines.findIndex(l => /invoice\s+to/i.test(l));
    const nameIdx = vendorIdx >= 0 ? vendorIdx : invoiceToIdx;
    if (nameIdx >= 0 && lines[nameIdx + 1]) supplier = lines[nameIdx + 1].trim();

    /* Line item regex — Moon Invoice table format:
       "1. Product Name  qty [unit]  £price  £amount"
       The £ anchor stops the qty being consumed by the name */
    const ITEM_MOON = /^(\d+)\.\s+(.+?)\s+(\d+(?:\.\d+)?)\s*(?:pcs|bundle|box|pk|2pk|3pk|4pk|pair|roll|m|lm|set|kit|each|no\.?|nr\.)?\s*£/i;
    const SKU_RE_LOCAL = /^[A-Z0-9][A-Z0-9\-_]{2,}$/i;

    const items = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const m = line.match(ITEM_MOON) || line.match(ITEM_RE) || line.match(ITEM_RE2);
      if (m) {
        const name = m[2].trim();
        const qty  = parseFloat(m[3]);
        /* unit only present in ITEM_RE / ITEM_RE2 matches */
        const unit = normaliseUnit(m[4] || '');
        let j = i + 1, sku = '';
        if (j < lines.length && SKU_RE_LOCAL.test(lines[j]) && !/^\d+\.\s/.test(lines[j])) {
          sku = lines[j].toUpperCase(); j++;
        }
        /* skip Moon Invoice table header row */
        if (/^products$/i.test(name) || /^#\s*products/i.test(name)) { i++; continue; }
        items.push({ name, sku, qty, unit });
        i = j; continue;
      }
      i++;
    }
    return { poNumber: `${docType}-${docRef}`, supplier, poDate, items };
  }
