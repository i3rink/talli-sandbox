  /* ── Supabase: stage 1 — save PO as pending (office uploads in advance) ── */
  async function savePOPending() {
    const { po } = state.c5;
    if (!po) return;

    const normPoNum = (po.poNumber || '').toUpperCase().replace(/\s+/g, '');
    const { data: poRow, error: poErr } = await sb.from('goods_in_pos').upsert({
      po_number:       po.poNumber,
      supplier:        po.supplier,
      po_date:         po.poDate ? (() => { const d = new Date(po.poDate); return isNaN(d) ? null : d.toISOString().split('T')[0]; })() : null,
      status:          'pending',
      is_remedial:     state.c5.isRemedialPO || false,
      remedial_po_ref: state.c5.isRemedialPO ? normPoNum : null,
    }, { onConflict: 'po_number' }).select().single();
    if (poErr) { toast('Save failed — check connection'); console.error(poErr); return; }

    const lineRows = po.items.map(item => ({
      po_id:        poRow.id,
      product_name: item.name,
      sku:          item.sku || null,
      ordered_qty:  item.qty,
      resolved:     false,
    }));

    /* Delete any existing lines first (re-upload case) */
    await sb.from('goods_in_lines').delete().eq('po_id', poRow.id);
    const { error: lineErr } = await sb.from('goods_in_lines').insert(lineRows);
    if (lineErr) { toast('Lines save failed'); console.error(lineErr); return; }

    toast('PO saved');
    state.c5.po = null;
    state.c5.lines = [];
    state.view = 'c5-list';
    render();
    loadC5POs();
  }

  /* ── Supabase: stage 2 — submit receipt against an existing pending PO ── */
  async function saveGoodsInReceipt() {
    const { activePo, lines, receipts, receiverName, arrivalType } = state.c5;
    if (!activePo) return;
    if (!receiverName.trim()) { toast('Enter your name first'); return; }

    /* Update PO header to complete */
    const { error: poErr } = await sb.from('goods_in_pos').update({
      received_by:  receiverName.trim(),
      arrival_type: arrivalType || 'delivery',
      received_at:  new Date().toISOString(),
      status:       'complete',
    }).eq('id', activePo.id);
    if (poErr) { toast('Save failed — check connection'); console.error(poErr); return; }

    /* Update each line with receipt data */
    for (let idx = 0; idx < lines.length; idx++) {
      const line = lines[idx];
      const r = receipts[idx] || {};
      const status      = r.status || 'ok';
      const receivedQty = status === 'ok' ? line.ordered_qty : (Number(r.receivedQty) || 0);
      const damagedQty  = (status === 'damaged' || status === 'partial_damaged') ? (Number(r.damagedQty) || 0) : 0;
      const hasPartial  = receivedQty < line.ordered_qty;
      const hasDamage   = damagedQty > 0;
      await sb.from('goods_in_lines').update({
        received_qty: receivedQty,
        damaged_qty:  damagedQty,
        has_partial:  hasPartial,
        has_damage:   hasDamage,
      }).eq('id', line.id);
    }

    /* automatch: only attempt if this PO was flagged as a remedial PO */
    if (activePo.is_remedial && activePo.remedial_po_ref) {
      const normSaved = activePo.remedial_po_ref; /* already normalised on save */
      const { data: matchedRemedials } = await sb.from('remedials')
        .select('id, po_ref').eq('status', 'ordered').not('po_ref', 'is', null);
      if (matchedRemedials && matchedRemedials.length) {
        const normalise = s => (s || '').toUpperCase().replace(/\s+/g, '');
        const matchIds = matchedRemedials
          .filter(r => normalise(r.po_ref) === normSaved)
          .map(r => r.id);
        if (matchIds.length) {
          await sb.from('remedials')
            .update({ status: 'ready', actioned_at: new Date().toISOString() })
            .in('id', matchIds);
          await loadC6BadgeCount();
          toast('Receipt recorded — ' + matchIds.length + ' remedial item' + (matchIds.length !== 1 ? 's' : '') + ' ready to pick');
        } else {
          /* Flagged as remedial but no match found — loud failure */
          toast('&#9888; Receipt saved but no remedial found for PO ' + (activePo.po_number || '') + '. Check the PO number is correct.');
          /* Also show persistent warning on the complete screen */
          state.c5.remedialMatchError = 'No remedial order found matching PO ' + (activePo.po_number || '') + '. Check the PO number entered on the remedial matches exactly.';
        }
      } else {
        /* No ordered remedials at all — still flag it */
        toast('&#9888; Receipt saved — no remedial orders are currently waiting for this PO. Check the PO number.');
        state.c5.remedialMatchError = 'No remedial orders found waiting for PO ' + (activePo.po_number || '') + '. Check with Rab that the PO was raised correctly.';
      }
    } else {
      toast('Receipt recorded');
    }
    state.c5.savedPo = activePo;
    state.view = 'c5-complete';
    render();
  }

  /* ── RENDER: receive lines against a saved pending PO (stage 2) ── */
  function renderC5Receive() {
    const { activePo, lines, receipts, receiverName } = state.c5;
    if (!activePo) return renderC5List();

    const total = lines.length;
    const done  = lines.filter((_, i) => receipts[i] && receipts[i].status).length;
    const pct   = total ? Math.round((done / total) * 100) : 0;

    const lineCards = lines.map((line, idx) => {
      const r = receipts[idx] || {};
      const st = r.status || '';
      const needsReceived = st === 'partial' || st === 'partial_damaged';
      const needsDamaged  = st === 'damaged' || st === 'partial_damaged';

      return `
        <div class="gi-line ${st ? 'gi-line-done' : ''}">
          <div class="gi-line-name">${esc(line.product_name)}</div>
          ${line.sku ? `<div class="gi-line-sku">${esc(line.sku)}</div>` : ''}
          <div class="gi-line-ordered">Ordered: ${line.ordered_qty}</div>
          <div class="gi-btn-row">
            <button class="gi-status-btn ${st === 'ok' ? 'active-ok' : ''}"
              data-action="gi-set-status" data-idx="${idx}" data-status="ok">&#10003; All received</button>
            <button class="gi-status-btn ${st === 'partial' ? 'active-part' : ''}"
              data-action="gi-set-status" data-idx="${idx}" data-status="partial">Partial</button>
            <button class="gi-status-btn ${st === 'damaged' ? 'active-dmg' : ''}"
              data-action="gi-set-status" data-idx="${idx}" data-status="damaged">Damaged</button>
            <button class="gi-status-btn ${st === 'partial_damaged' ? 'active-dmg' : ''}"
              data-action="gi-set-status" data-idx="${idx}" data-status="partial_damaged">Both</button>
          </div>
          ${needsReceived || needsDamaged ? `<div class="gi-sub-fields">
            ${needsReceived ? `<div>
              <label>How many actually arrived?</label>
              <input type="number" min="0" max="${line.ordered_qty}" value="${r.receivedQty || ''}"
                placeholder="e.g. 12" data-action="gi-qty-input" data-idx="${idx}" data-field="receivedQty" />
            </div>` : ''}
            ${needsDamaged ? `<div>
              <label>How many are damaged?</label>
              <input type="number" min="0" max="${line.ordered_qty}" value="${r.damagedQty || ''}"
                placeholder="e.g. 3" data-action="gi-qty-input" data-idx="${idx}" data-field="damagedQty" />
            </div>` : ''}
          </div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="mod-back" style="display:flex;justify-content:space-between;align-items:center;">
        <button class="btn btn-ghost" data-action="c5-back-list">&#8592; Back to POs</button>
      </div>
      <div class="card">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px;">
          <div class="card-title" style="margin:0;">PO ${esc(activePo.po_number)}</div>
          <div class="text-muted text-sm">${esc(activePo.supplier || '')}</div>
        </div>
        ${activePo.po_date ? `<div class="text-muted text-sm" style="margin-bottom:12px;">${esc(activePo.po_date)}</div>` : ''}

        <div class="gi-name-label">How did it arrive?</div>
        <div class="gi-btn-row" style="margin-bottom:16px;">
          <button class="gi-status-btn ${state.c5.arrivalType === 'delivery' ? 'active-ok' : ''}"
            data-action="gi-arrival-type" data-type="delivery">&#128666; Delivery</button>
          <button class="gi-status-btn ${state.c5.arrivalType === 'collection' ? 'active-ok' : ''}"
            data-action="gi-arrival-type" data-type="collection">&#128230; Collection</button>
        </div>

        <div class="gi-name-label">Counted by <span style="color:#b91c1c;">*</span></div>
        <input class="text-input" type="text" placeholder="Your name e.g. Reiss"
          value="${esc(receiverName)}" data-action="gi-name-input"
          style="margin-bottom:16px;" />

        <div class="gi-progress"><div class="gi-progress-fill" style="width:${pct}%;"></div></div>
        <div style="font-size:.78rem;color:var(--muted);margin-top:6px;">${done} of ${total} lines checked</div>
      </div>
      ${lineCards}
      ${done === total ? `
        <button class="btn btn-primary" data-action="gi-submit" style="width:100%;margin-top:8px;">
          Submit receipt &#8594;
        </button>` : `
        <button class="btn btn-ghost" style="width:100%;margin-top:8px;opacity:.5;cursor:default;">
          Check all lines to submit
        </button>`}`;
  }

  /* ── RENDER: completion summary ── */
  function renderC5Complete() {
    const { savedPo, lines, receipts, receiverName, arrivalType } = state.c5;
    const exceptions = lines.filter((_, i) => {
      const r = receipts[i] || {};
      return r.status && r.status !== 'ok';
    });

    const summaryRows = lines.map((line, idx) => {
      const r = receipts[idx] || {};

        icon = '&#8776;';
        detail = `${r.receivedQty || '?'} of ${line.ordered_qty} received`;

        detail = `${r.damagedQty || '?'} damaged on arrival`;
      } else if (st === 'partial_damaged') {
        icon = '&#9888;';
        detail = `${r.receivedQty || '?'} received, ${r.damagedQty || '?'} damaged`;

      return `
        <div class="gi-complete-line">

    return `

      <div class="card" style="border-top:3px solid #0d9488;">
        <div class="card-title" style="color:#0d9488;">&#10003; Receipt recorded</div>
        <div style="font-weight:700;font-size:1rem;margin-bottom:2px;">PO ${esc(savedPo?.po_number || '')}</div>
        <div class="text-muted text-sm">${esc(savedPo?.supplier || '')}</div>

            &#9888; ${exceptions.length} exception${exceptions.length > 1 ? 's' : ''} flagged to Scott
          </div>` : `
          <div style="margin-top:12px;padding:10px 12px;background:#d1fae5;border-radius:8px;font-size:.82rem;color:#059669;font-weight:600;">
            &#10003; Full delivery — no issues

      <div class="card">

        ${summaryRows}

        &#8592; Back to POs
      </button>`;

  /* ── Goods In action handlers ── */
  function bindC5Events(action, btn, e) {
    if (action === 'gi-toggle-completed') {
      state.c5.completedExpanded = !state.c5.completedExpanded;
      render(); return;
    }
    if (action === 'gi-file-pick') return;

    if (action === 'gi-remedial-po-toggle') {
      state.c5.isRemedialPO = btn.dataset.val === 'yes';
      state.c5.remedialMatchError = null;
      render();
      return;
    }

    if (action === 'gi-save-pending') {
      savePOPending(); return true;
    }
    if (action === 'gi-open-receive') {
      const id = btn.dataset.id;
      const po = (state.c5.pos || []).find(p => p.id === id);
      if (!po) return true;
      (async () => {
        const { data: lineData, error } = await sb.from('goods_in_lines')
          .select('*').eq('po_id', id).order('created_at', { ascending: true });
        if (error || !lineData) { toast('Could not load PO lines'); return; }
        state.c5.activePo   = po;
        state.c5.lines      = lineData;
        state.c5.receipts   = {};
        state.c5.receiverName = '';
        state.c5.arrivalType  = 'delivery';
        state.view = 'c5-receive';
        render();
      })();
      return true;
    }
    if (action === 'c5-back-list') {
      state.view = 'c5-list';
      state.c5.po = null; state.c5.activePo = null;
      state.c5.lines = []; state.c5.receipts = {};
      state.c5.uploadError = null;
      render(); loadC5POs(); return true;
    }
    if (action === 'gi-delete-po') {
      e.stopPropagation();
      const id  = btn.dataset.id;
      const ref = btn.dataset.ref;
      const pin = prompt(`Enter admin PIN to delete ${ref}:`);
      if (!pin) return true;
      if (String(pin).trim() !== String(DASH_PIN)) { toast('Incorrect PIN — deletion cancelled'); return true; }
      (async () => {
        await sb.from('goods_in_lines').delete().eq('po_id', id);
        const { error } = await sb.from('goods_in_pos').delete().eq('id', id);
        if (error) { toast('Delete failed — check connection'); return; }
        toast(`${ref} deleted`);
        loadC5POs();
      })();
      return true;
    }
    if (action === 'gi-arrival-type') {
      state.c5.arrivalType = btn.dataset.type;
      render(); return true;
    }
    if (action === 'gi-set-status') {
      const idx = Number(btn.dataset.idx);
      const status = btn.dataset.status;
      if (!state.c5.receipts[idx]) state.c5.receipts[idx] = {};
      state.c5.receipts[idx].status = status;
      render(); return true;
    }
    if (action === 'gi-qty-input') {
      const idx   = Number(btn.dataset.idx);
      const field = btn.dataset.field;
      if (!state.c5.receipts[idx]) state.c5.receipts[idx] = {};
      state.c5.receipts[idx][field] = btn.value;
      return true;
    }
    if (action === 'gi-name-input') {
      state.c5.receiverName = btn.value;
      return true;
    }
    if (action === 'gi-submit') {
      saveGoodsInReceipt(); return true;
    }
    return false;
  }

  /* ── File input listener for GI PDF upload ── */
  function attachGIFileListener() {
    const inp = document.getElementById('gi-file-input');
    if (!inp || inp._gibound) return;
    inp._gibound = true;
    inp.addEventListener('change', async function () {
      const file = this.files[0];
      if (!file) return;
      state.view = 'c5-upload'; render();
      try {
        const text = await extractPdfText(file);
        const isPO      = /PURCHASE\s+ORDER/i.test(text);
        const isInvoice = /\bINVOICE\b/i.test(text);
        if (isInvoice && !isPO) {
          state.view = 'c5-list';
          state.c5.uploadError = "That looks like an invoice, not a purchase order. Please check the file and re-upload the correct PO PDF.";
          render(); return;
        }
        const po = parsePurchaseOrder(text, file.name);
        if (!po.items.length) {
          state.view = 'c5-list';
          state.c5.uploadError = 'No line items found in that PDF. Please check the file and try again.';
          render(); return;
        }
        state.c5.uploadError = null;
        state.c5.po    = po;
        state.c5.lines = po.items;
        state.c5.receipts = {};
        state.view = 'c5-preview';
        render();
      } catch (err) {
        console.error('GI parse error:', err);
        state.view = 'c5-list';
        state.c5.uploadError = 'Could not read that PDF. Please try again.';
        render();
      }
    });
  }

  function renderC5OutList() {
    const orders  = state.c5out.orders || [];
    const loading = state.c5out.loading;
    const pending = orders.filter(o => o.status === 'pending');
    const staged  = orders.filter(o => o.status === 'staged');
    const done    = orders.filter(o => o.status === 'complete');

    const collectorBadge = t => {
      const map = { install: '#dcfce7:#166534:Install', retail: '#dbeafe:#1d4ed8:Retail', trade: '#fef3c7:#92400e:Trade', external: '#f3e8ff:#7e22ce:External' };
      const v = map[t] || '#f1f5f9:#475569:Unknown';
      const [bg, col, label] = v.split(':');
      return `<span style="background:${bg};color:${col};font-size:.68rem;font-weight:700;border-radius:20px;padding:2px 8px;letter-spacing:.04em;text-transform:uppercase;">${label}</span>`;
    };

    const renderOrderCard = (o) => {
      const isActionable = o.status === 'pending' || o.status === 'staged';
      const isDeliveryOrder = (o.fulfilment_type || 'collection') === 'delivery';
      const statusLabel = o.status === 'pending' ? 'Pending pick'
        : o.status === 'staged' ? (isDeliveryOrder ? 'Ready for delivery' : 'Ready to collect')

  function initGOSignaturePad() {
    const canvas = document.getElementById('go-sig-canvas');
    if (!canvas || canvas._gobound) return;
    canvas._gobound = true;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    let drawing = false, lastX = 0, lastY = 0;
    const getPos = ev => {
      const r = canvas.getBoundingClientRect();
      const scaleX = canvas.width / r.width;
      const scaleY = canvas.height / r.height;
      const src = ev.touches ? ev.touches[0] : ev;
      return [(src.clientX - r.left) * scaleX, (src.clientY - r.top) * scaleY];
    };
    canvas.addEventListener('mousedown', ev => { drawing = true; [lastX, lastY] = getPos(ev); });
    canvas.addEventListener('mousemove', ev => {
      if (!drawing) return;
      const [x, y] = getPos(ev);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
      [lastX, lastY] = [x, y];
    });
    canvas.addEventListener('mouseup',   () => { drawing = false; });
    canvas.addEventListener('touchstart', ev => { ev.preventDefault(); drawing = true; [lastX, lastY] = getPos(ev); }, { passive: false });
    canvas.addEventListener('touchmove',  ev => {
      ev.preventDefault();
      if (!drawing) return;
      const [x, y] = getPos(ev);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
      [lastX, lastY] = [x, y];
    }, { passive: false });
    canvas.addEventListener('touchend', () => { drawing = false; });
  }

  function bindC5OutEvents(action, btn, e) {
    if (action === 'c5-tab-in') {
      state.c5.tab = 'in';
      state.view = 'c5-list';
      render(); loadC5POs(); return true;
    }
    if (action === 'c5-tab-out') {
      state.c5.tab = 'out';
      state.view = 'c5out-list';
      render(); loadC5OutOrders(); return true;
    }
    if (action === 'c5out-back-list') {
      state.c5.tab = 'out';
      state.view = 'c5out-list';
      state.c5out.po = null; state.c5out.activeOrder = null; state.c5out.activeLines = [];
      state.c5out.uploadError = null; state.c5out.collectorType = null;
      state.c5out.collectionDate = null; state.c5out.lineChecks = []; state.c5out.pickChecks = [];
      state.c5out.fulfilmentType = null;
      render(); loadC5OutOrders(); return true;
    }
    if (action === 'admin-open-goods-out') {
      state.module = 'goodsin';
      state.view = 'c5out-list';
      applyTheme('goodsin');
      render(); loadC5OutOrders(); return true;
    }
    if (action === 'c5out-new-order') {
      state.c5out.collectorType = null;
      state.c5out.fulfilmentType = null;
      state.view = 'c5out-type';
      render(); return true;
    }
    if (action === 'c5out-type-next') {
      if (!state.c5out.collectorType) { toast('Select a customer type first'); return true; }
      if (!state.c5out.fulfilmentType) { toast('Select delivery or collection'); return true; }
      state.view = 'c5out-list';
      render(); loadC5OutOrders(); return true;
    }
    if (action === 'c5out-set-type') {
      state.c5out.collectorType = btn.dataset.type;
      render(); return true;
    }
    if (action === 'c5out-set-fulfilment') {
      state.c5out.fulfilmentType = btn.dataset.ft;
      render(); return true;
    }
    if (action === 'c5out-toggle-pick') {
      const idx = Number(btn.dataset.idx);
      if (!state.c5out.pickChecks) state.c5out.pickChecks = [];
      state.c5out.pickChecks[idx] = !state.c5out.pickChecks[idx];
      render(); return true;
    }
    if (action === 'c5out-date-input') {
      state.c5out.collectionDate = btn.value;
      return true;
    }
    if (action === 'c5out-save') {
      const po = state.c5out.po;
      if (!po) return true;
      if (!state.c5out.collectorType) { toast('Select a customer type first'); return true; }
      const dateVal = document.getElementById('go-date-input');
      const collDate = dateVal ? dateVal.value : (state.c5out.collectionDate || new Date().toISOString().slice(0,10));
      (async () => {
        try {
          const { data: orderData, error: orderErr } = await sb.from('goods_out_orders')
            .insert({
              invoice_ref:      po.poNumber,
              collector_name:   po.supplier,
              customer_type:    state.c5out.collectorType,
              fulfilment_type:  state.c5out.fulfilmentType || 'collection',
              collection_date:  collDate,
              status:           'pending',
            }).select().single();
          if (orderErr || !orderData || !orderData.id) throw new Error('Order insert failed');
          const lineRows = (po.items || []).map(item => ({
            order_id:  orderData.id,
            item_name: item.name,
            sku:       item.sku || null,
            qty:       item.qty,
            confirmed: false,
          }));
          const { error: linesErr } = await sb.from('goods_out_lines').insert(lineRows);
          if (linesErr) throw new Error('Lines insert failed');
          toast('Order pushed to warehouse');
          state.c5out.po = null;
          state.c5out.collectorType = null;
          state.c5out.fulfilmentType = null;
          state.c5out.collectionDate = null;
          state.view = 'c5out-list';
          await loadC5OutOrders();
          await loadC5OutBadgeCount();
        } catch (err) {
          console.error('GO save error', err);
          toast('Save failed — check connection');
        }
      })();
      return true;
    }
    if (action === 'c5out-open-stage') {
      const id = btn.dataset.id;
      const order = (state.c5out.orders || []).find(o => o.id === id);
      if (!order) return true;
      (async () => {
        const { data: lines } = await sb.from('goods_out_lines')
          .select('*').eq('order_id', id).order('id', { ascending: true });
        state.c5out.activeOrder = order;
        state.c5out.activeLines = lines || [];
        state.c5out.pickChecks = (lines || []).map(() => false);
        state.view = 'c5out-staged';
        render();
      })();
      return true;
    }
    if (action === 'c5out-mark-staged') {
      const id = btn.dataset.id;
      (async () => {
        const isDelivery = (state.c5out.activeOrder?.fulfilment_type || 'collection') === 'delivery';
        await sb.from('goods_out_orders').update({ status: 'staged', picked_at: new Date().toISOString() }).eq('id', id);
        toast(isDelivery ? 'Order ready for delivery' : 'Order staged — ready for collection');
        await loadC5OutOrders();
        await loadC5OutBadgeCount();
        state.view = 'c5out-list';
        render();
      })();
      return true;
    }
    if (action === 'c5out-open-signoff') {
      const id = btn.dataset.id;
      const order = (state.c5out.orders || []).find(o => o.id === id);
      if (!order) return true;
      (async () => {
        const { data: lines } = await sb.from('goods_out_lines')
          .select('*').eq('order_id', id).order('id', { ascending: true });
        state.c5out.activeOrder = order;
        state.c5out.activeLines = lines || [];
        state.c5out.lineChecks  = (lines || []).map(() => false);
        state.view = 'c5out-signoff';
        render();
        setTimeout(initGOSignaturePad, 80);
      })();
      return true;
    }
    if (action === 'c5out-toggle-line') {
      const idx = Number(btn.dataset.idx);
      if (!state.c5out.lineChecks) state.c5out.lineChecks = [];
      state.c5out.lineChecks[idx] = !state.c5out.lineChecks[idx];
      render();
      setTimeout(initGOSignaturePad, 80);
      return true;
    }
    if (action === 'c5out-clear-sig') {
      const canvas = document.getElementById('go-sig-canvas');
      if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      return true;
    }
    if (action === 'c5out-confirm-collection') {
      const id = btn.dataset.id;
      const canvas = document.getElementById('go-sig-canvas');
      const sig = canvas ? canvas.toDataURL('image/png') : null;
      if (!sig || sig === 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAACoCAYAAADmRYAZAAAABmJLR0QA/wD/AP+gvaeTAAAAC0lEQVQI12NgAAIABQAABjkB6wAAAABJRU5ErkJggg==') {
        toast('Please get a signature before confirming'); return true;
      }
      (async () => {
        await sb.from('goods_out_orders').update({
          status: 'complete', completed_at: new Date().toISOString(), signature_data: sig,
        }).eq('id', id);
        await sb.from('goods_out_lines').update({ confirmed: true }).eq('order_id', id);
        toast('Collection confirmed');
        await loadC5OutOrders();
        await loadC5OutBadgeCount();
        state.view = 'c5out-list';
        state.c5out.activeOrder = null;
        state.c5out.activeLines = [];
        state.c5out.lineChecks  = [];
        render();
      })();
      return true;
    }
    if (action === 'c5out-delete') {
      e.stopPropagation();
      const id  = btn.dataset.id;
      const ref = btn.dataset.ref;
      const pin = prompt(`Enter admin PIN to delete ${ref}:`);
      if (!pin) return true;
      if (String(pin).trim() !== String(DASH_PIN)) { toast('Incorrect PIN — deletion cancelled'); return true; }
      (async () => {
        await sb.from('goods_out_lines').delete().eq('order_id', id);
        await sb.from('goods_out_orders').delete().eq('id', id);
        toast(`${ref} deleted`);
        await loadC5OutOrders();
        await loadC5OutBadgeCount();
      })();
      return true;
    }
    return false;
  }

  /* ── File input listener for GO PDF upload ── */
  function attachGOFileListener() {
    const inp = document.getElementById('go-file-input');
    if (!inp || inp._gobound) return;
    inp._gobound = true;
    inp.addEventListener('change', async function () {
      const file = this.files[0];
      if (!file) return;
      state.view = 'c5out-upload'; render();
      try {
        const text = await extractPdfText(file);
        const isPO = /PURCHASE\s+ORDER/i.test(text);
        if (isPO) {
          state.view = 'c5out-list';
          state.c5out.uploadError = 'That looks like a purchase order, not an invoice. Please upload the Moon Invoice PDF for this collection.';
          render(); return;
        }
        const parsed = parsePurchaseOrder(text, file.name);
        if (!parsed.items.length) {
          state.view = 'c5out-list';
          state.c5out.uploadError = 'No line items found in that PDF. Please check the file and try again.';
          render(); return;
        }
        state.c5out.uploadError = null;
        state.c5out.po = parsed;
        state.c5out.collectorType = null;
        state.c5out.collectionDate = new Date().toISOString().slice(0,10);
        state.view = 'c5out-preview';
        render();
      } catch (err) {
        console.error('GO parse error:', err);
        state.view = 'c5out-list';
        state.c5out.uploadError = 'Could not read that PDF. Please try again.';
        render();
      }
    });
  }

  /* ═══════════════════════════════════════════════
     UTILITIES
  ═══════════════════════════════════════════════ */
  function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let suffix = '';
    for (let i = 0; i < 4; i++) suffix += chars[Math.floor(Math.random() * chars.length)];
    return 'AB' + suffix;
  }

  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  render();

  // ── ANDROID BACK BUTTON FIX ──────────────────────────────────────────────
  // Wrap render so every screen change pushes a history entry.
  // Back button then navigates within Talli rather than exiting the PWA.
  var _origRender = render;
  render = function() {
    _origRender();
    history.pushState({ view: state.view, module: state.module }, '', location.href);
  };

  // Intercept back button — restore previous state and re-render
  window.addEventListener('popstate', function(e) {
    if (e.state && e.state.view) {
      state.view   = e.state.view;
      state.module = e.state.module || state.module;
      _origRender();
    } else {
      // No previous state — keep user in app
      history.pushState({ view: state.view, module: state.module }, '', location.href);
    }
  });

  // Seed initial history entry on load
  history.replaceState({ view: state.view, module: state.module }, '', location.href);
